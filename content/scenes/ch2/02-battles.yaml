# Chapter 2, part 2: the Sorre ford (battle 1) and Hautbois (battle 2, major).
# Late summer, year 21. Age 20.
# Knighthood: the King dubs men on the eve of Hautbois; a deed at Hautbois can
# earn it in the field. Great ransoms are on offer, but mostly taken by others.

- id: c2_sorre_eve
  chapter: ch2
  title: The River
  text: |
    The army reaches the Sorre on a hot evening and finds every bridge broken.

    The river is wide here and brown and slow, with marsh on both banks. On the far side, in the evening light, you can see the Valdrennish: a long line of tents, banners, the glint of a great many men. Amaury has come at last. He means to hold the river and let the Adalians starve on this side of it.

    [break]

    That night a prisoner, a Valdrennish carter, is brought to the King. He knows a ford, he says, downstream, where the tide goes out far enough at dawn for men to cross knee-deep. It is guarded. Everyone knows it will be guarded.

    The King gives the van the ford. [if alias.master == walter_pryce]The Earl of Carrow's company is in the van.[else]Lord Ravell's company is in the van.[/if] So are you.
  choices:
    - id: sleep
      text: Sleep, if you can.
      text_after: You lie in the long grass by the horses and do not sleep. Nobody near you sleeps. [if npc.davy_ludd.follower]Davy talks until you tell him to stop, and then lies awake in silence, which is worse.[/if]
      next: c2_sorre
    - id: men
      text: Go round your men and see they have eaten, and that their strings are dry.
      tags: [allies]
      text_after: It is a small thing. Every man in your following eats, and checks his gear twice, and lies down knowing that you checked it too. In the morning not one of them is late.
      effects: [ { set: flag.c2_sorre_ready }, { add: { rel.jankin_rooke.loyalty: 1, rel.simkin_barre.loyalty: 1, rel.roger_tallis.loyalty: 1, rel.davy_ludd.loyalty: 1, rel.wat_coker.loyalty: 1, rel.perkin_dyer.loyalty: 1, rel.gib_shawe.loyalty: 1, rel.dickon_laund.loyalty: 1 } } ]
      next: c2_sorre
    - id: scout
      text: Go down to the river in the dark and look at the ford yourself.
      tags: [cunning]
      check: { attr: wits, skill: woodcraft, difficulty: 3 }
      success:
        text: The ford is real. So are the stakes the Valdrennish have driven into the mud on the far bank, invisible at high tide. You come back and tell your master where they are. By dawn the whole van knows to go round them.
        effects: [ { set: flag.c2_sorre_scouted }, { add: { rel.@master.respect: 2, res.renown: 1 } } ]
        next: c2_sorre
      failure:
        text: You get wet to the waist and learn nothing except how cold the Sorre is at night.
        next: c2_sorre

- id: c2_sorre
  chapter: ch2
  title: The Ford of the Sorre
  checkpoint: true
  text: |
    Dawn. The tide goes out across the ford like a cloth being pulled off a table, and there it is: a quarter mile of grey mud and shallow water, and on the far side, behind a line of stakes, three thousand Valdrennish under the banner of a duke.

    The Adalian archers go in first, up to their knees, and shoot as they wade. The Valdrennish crossbowmen shoot back. Men fall in the water and do not get up because the water is only a foot deep and they are drowning in it anyway, in their armour, face down.

    [break]

    Then the trumpets go for the van, and the van goes in.
  choices:
    - id: front
      text: Go in at the front, for the stakes.
      tags: [martial]
      lethal: true
      warn: The first men through the stakes take the crossbows at ten paces. Without armour, or carrying a wound, you will not get through.
      check:
        attr: strength
        skill: arms
        difficulty: 4
        mods:
          - { if: flag.c2_sorre_scouted, add: 2, label: you know where the stakes are }
          - { if: armour >= 2, add: 2, label: your harness }
          - { if: armour == 1, add: 1, label: your jack }
          - { if: trait.veteran, add: 1, label: you have done this before }
          - { if: item.holy_ampulla, add: 1, label: "Saint Ebba's water, or your faith in it" }
      success:
        text: You go through the stakes at the place where they are thinnest and come up the far bank in the middle of the crossbowmen before they can wind. After that it is not a battle but a rout. The duke's banner goes back up the road toward the Valdrennish camp, and the Adalian army crosses the Sorre behind you all morning. Men will talk about who went through the stakes first. Your name is one of three they say.
        effects:
          - set: flag.c2_sorre_hero
          - add: { res.renown: 3, rep.knights: 1, rel.@master.respect: 2 }
          - trait: +veteran
        next: c2_sorre_after
      partial:
        text: You get through the stakes, and up the bank, and the bank is taken. Not all of you gets through. A bolt in the thigh, a sword-cut, and one of your men face down in the Sorre behind you.
        effects:
          - set: flag.c2_sorre_hero
          - add: { res.renown: 2 }
          - injury: arrow_wound
          - casualties: { men: 1, named: 0 }
          - trait: +veteran
        next: c2_sorre_after
      failure:
        text: "[if armour >= 1 && !injured]A bolt takes you in the chest at ten paces and your armour stops it, and you go down in the mud with the stakes all round you. Your men drag you back. Other men take the bank.[else]The bolt that finds you at the stakes is the last thing you ever see: grey water, grey sky.[/if]"
        effects:
          - if: [ armour >= 1, "!injured" ]
            then: [ { injury: crushed_ribs }, { casualties: { men: 1, named: 1, spare: [ davy_ludd ] } } ]
            else: [ { die: "Drowned at the ford of the Sorre with a crossbow bolt in him, aged {age}." } ]
        next: c2_sorre_after
    - id: archers
      text: Wade in with the archers, and keep the crossbowmen's heads down.
      tags: [martial, allies]
      check:
        attr: presence
        skill: command
        difficulty: 3
        mods:
          - { if: npc.jankin_rooke.follower, add: 1, label: Rooke does not miss }
          - { if: npc.will_cobb.friend, add: 1, label: Cobb's archers beside you }
          - { if: background == archer, add: 1, label: you were raised on this }
      success:
        text: Knee-deep in the Sorre, shooting into the crossbowmen until your fingers bleed, you watch the men-at-arms go past you through the stakes. The crossbows have stopped. That is your doing, yours and three hundred others'. Nobody will sing about it. The men-at-arms who got through alive know whom to thank.
        effects: [ { add: { res.renown: 1, rep.commons: 1 } }, { trait: +veteran } ]
        next: c2_sorre_after
      failure:
        text: The water is deeper than it was, and the tide is turning. You lose your footing, and your bow, and nearly yourself.
        effects: [ { injury: bruised_ribs } ]
        next: c2_sorre_after
    - id: master
      text: Stay at your master's side, wherever he goes.
      tags: [allies]
      text_after: |
        [if alias.master == hamon_darrell]Sir Hamon goes in slowly, because he is old, and by the time he reaches the stakes they are already broken. He is pleased with the day and with you.[elif alias.master == ancel_brome]Sir Ancel goes in like a man walking into his own hall, and you go in beside him. Neither of you is hurt. Neither of you does anything men will talk about. He says, "Hm," which is praise.[else]Your master goes where the trumpets send him, and you go behind. You come out of it with mud to the waist and nothing else.[/if]
      effects: [ { add: { rel.@master.affection: 2 } }, { trait: +veteran } ]
      next: c2_sorre_after

- id: c2_sorre_after
  chapter: ch2
  title: The Far Bank
  text: |
    By noon the whole army is across the Sorre and the duke's men are gone up the road, leaving their dead in the water and their wounded in the reeds.

    The King rides along the bank and looks at the stakes and says nothing. Then he says something to the Earl of Carrow that makes the Earl laugh. [if flag.c2_sorre_hero]Lord Ravell, beside them, points at you. The King looks.[/if]

    [break]

    There are Valdrennish in the reeds who will die if no one helps them, and Valdrennish in the reeds who are worth money, and there is little time before the army moves again.
  choices:
    - id: ransom
      text: Search the reeds for men worth ransoming.
      tags: [wealth]
      check: { attr: wits, skill: trade, difficulty: 3 }
      success:
        text: A young knight with a broken leg and a coat of arms you do not know, who offers you a hundred marks to keep him out of the hands of the archers. You take him. A hundred marks is more than Sir Hamon's manor brings in a year.
        effects: [ { add: { res.coin: 480, res.renown: 1 } }, { set: flag.c2_sorre_prisoner } ]
        next: c2_hautbois_eve
      failure:
        text: Every man in the reeds who was worth anything has been found by someone else.
        next: c2_hautbois_eve
    - id: wounded
      text: Get the wounded out of the reeds, ours and theirs, before the tide comes back.
      tags: [piety]
      text_after: It is filthy, slow work. The tide comes back before you are done. You get out eleven men, four of them Valdrennish. One of them dies on the bank holding your hand and calling you by someone else's name.
      effects: [ { add: { rep.honor: 2, rep.piety: 1, rep.valdrenne: 1, rep.commons: 1 } } ]
      next: c2_hautbois_eve
    - id: men
      text: Count your own men, and see to them first.
      tags: [allies]
      text_after: You count them twice. [if retinue >= 3]Most are here. You find the one who is not, and you see him buried properly, with a priest, which costs you a shilling and the rest of the afternoon.[else]Everyone is here. You sit down in the mud and shake for a while, and nobody looks at you while you do it.[/if]
      effects: [ { add: { rel.davy_ludd.loyalty: 1, rel.jankin_rooke.loyalty: 1, rel.simkin_barre.loyalty: 1, rel.roger_tallis.loyalty: 1, rel.wat_coker.loyalty: 1, rel.perkin_dyer.loyalty: 1, rel.gib_shawe.loyalty: 1, rel.dickon_laund.loyalty: 1 } } ]
      next: c2_hautbois_eve

- id: c2_hautbois_eve
  chapter: ch2
  title: The Night Before Hautbois
  checkpoint: true
  text: |
    Two days north of the Sorre, Amaury catches up.

    The King chooses his ground: a long slope above the village of Hautbois, with a wood on one flank and a stream on the other, and a windmill on the crest where he will stand. The army is drawn up on the slope in three battles, the men-at-arms on foot in the centre, the archers on the wings. Below, across the valley, the Valdrennish keep arriving all evening: more banners than anyone has ever seen in one place. Somebody says forty thousand. Somebody else says that is nonsense, it is only thirty.

    [break]

    It is the custom, the night before a battle, for knights to be made. A man may fight better with spurs on his heels, and may die a knight, which is something to die as. The King walks along the line at dusk with his sword drawn.

    [if station == knight]You are a knight already. You watch the others kneel.[elif flag.c1_sponsor_promise]Your master is looking at you. You remember the promise.[else]Squires and men-at-arms kneel in the grass, some of them shaking.[/if]
  choices:
    - id: kneel
      text: Kneel in the line when the King comes.
      tags: [diplomacy]
      visible_if: [ station != knight ]
      requires: [ { any: [ [ flag.c1_sponsor_promise, npc.@master.alive ], res.renown >= 4, flag.c1_king_noticed, [ flag.c1_served_well, npc.@master.alive, res.renown >= 2 ] ] } ]
      label: "Requires: someone to put you forward (your sponsor's promise, renown, or the King's notice)"
      text_after: |
        [if flag.c1_sworn_promise && npc.@master.alive]Your master steps forward before the King has reached you, because six men heard him swear on relics that he would, and he is not a man to be called forsworn.[elif flag.c1_sponsor_promise && npc.@master.alive]Your master steps forward and says your name to the King, and that you have earned it, and that he swore he would.[elif flag.c1_served_well && npc.@master.alive]Your master steps forward and tells the King who kept his lances sound at Ravell, and that a man who serves like that in peace will serve better in war. The King looks at you for the space of a breath.[elif flag.c1_king_noticed]The King stops in front of you and frowns, and then remembers. "The stirrup," he says. "Ravell." Or he says something like it. You will never be sure.[else]Your name is known in the van. Lord Ravell says it to the King.[/if]

        The flat of a sword on your shoulder, once, light as a hand. "Be a good knight." Then he is gone down the line, and you are kneeling in the grass with your heart going like a drum, Sir {name}, on the eve of the greatest battle anyone alive has seen.
      effects:
        - station: knight
        - set: flag.c2_knighted_eve
        - add: { rep.crown: 1, rep.knights: 1 }
      next: c2_hautbois_1
    - id: men
      text: Spend the night with your men instead.
      tags: [allies]
      text_after: |
        Nobody sleeps. Simkin Barre tells filthy stories. Jankin Rooke prays. Davy cleans your harness three times. [if npc.wat_coker.follower]Wat Coker sits a little apart and sharpens a knife and once, near dawn, says, "If I die, tell Mag it was quick. Whether it was or not."[/if][if npc.perkin_dyer.follower]Perkin Dyer eats everything anyone will give him and says, "No sense dying hungry."[/if] When the light comes they are still there, all of them.
      effects: [ { add: { rel.davy_ludd.loyalty: 2, rel.jankin_rooke.loyalty: 2, rel.simkin_barre.loyalty: 2, rel.roger_tallis.loyalty: 1, rel.wat_coker.loyalty: 2, rel.perkin_dyer.loyalty: 2, rel.gib_shawe.loyalty: 2, rel.dickon_laund.loyalty: 2 } } ]
      next: c2_hautbois_1
    - id: letter
      text: Write to someone at home, in case.
      tags: [learning]
      text_after: |
        [if trait.literate_vernacular]You write by the light of someone else's fire. It is a short letter. It says less than you mean and more than you would in daylight. You give it to Davy to carry if you do not come back.[else]Father Benet is with the army as Lord Ravell's chaplain. He writes it for you, and does not charge, and does not read it back.[/if]
      effects:
        - set: flag.c2_eve_letter
        - if: suit.isabel_sayer.status >= courted
          then: [ { add: { suit.isabel_sayer.regard: 1 } } ]
        - if: suit.cecily_fuller.status >= courted
          then: [ { add: { suit.cecily_fuller.regard: 1 } } ]
        - if: suit.maud_delisle.status >= courted
          then: [ { add: { suit.maud_delisle.regard: 1 } } ]
        - if: suit.joan_wyck.status >= courted
          then: [ { add: { suit.joan_wyck.regard: 1 } } ]
      next: c2_hautbois_1
    - id: watch
      text: Stand at the edge of the camp and watch the Valdrennish fires across the valley.
      text_after: There are so many fires that the valley looks like a city. Somewhere down there are men who are doing exactly what you are doing. At some point you stop being afraid, or you get so tired of it that it feels the same.
      next: c2_hautbois_1

- id: c2_hautbois_1
  chapter: ch2
  title: Hautbois
  text: |
    It rains in the morning, a short summer storm that soaks everyone to the skin and passes. Then the sun comes out behind the Adalian line, low, into the Valdrennish eyes.

    You are on foot in the centre with the men-at-arms, your horse sent to the rear with the others. [if alias.master == walter_pryce]The Earl of Carrow's banner is over you.[else]Lord Ravell's banner is over you.[/if] On either side the archers are drawn up in wedges, with stakes driven in front of them.

    [break]

    Down in the valley the Sarenzan crossbowmen come forward first, six thousand of them, hired for the day. They shout as they come, three great shouts. Their strings are wet from the storm.

    Every Adalian archer on the hill takes his string out from under his hat.
  choices:
    - id: dry
      text: Check that your own men kept their strings dry.
      tags: [cunning]
      text_after: They did. You look along the line and see that everyone did. Nobody told them to. They have done this before. The crossbows loose, and fall short, wet strings slapping. Then the sky over your head goes dark with arrows going the other way.
      effects: [ { add: { counter.hb_edge: 1 } } ]
      next: c2_hautbois_2
    - id: steady
      text: Steady the men around you. They have never seen anything like this.
      tags: [allies]
      check: { attr: presence, skill: command, difficulty: 3, mods: [ { if: trait.veteran, add: 1, label: you have stood in a line before } ] }
      success:
        text: "You talk to them the way Will Cobb talks to his archers: low, plain, about nothing in particular. The weather. Supper. Who owes whom money. By the time the crossbows break under the arrows, the men around you are steady as posts."
        effects: [ { add: { counter.hb_edge: 2, skill.command: 1 } } ]
        next: c2_hautbois_2
      failure:
        text: You try. Your own voice shakes. The man next to you is sick on his feet.
        next: c2_hautbois_2
    - id: pray
      text: Kneel with the rest of the line when the priests go along it.
      tags: [piety]
      text_after: The whole Adalian army kneels in the wet grass at the same moment and takes a pinch of earth in its mouth, which is the old way, for men who may not get to be buried. When you stand up the crossbowmen are already breaking.
      effects: [ { add: { counter.hb_edge: 1, rep.piety: 1 } } ]
      next: c2_hautbois_2

- id: c2_hautbois_2
  chapter: ch2
  title: The First Charge
  text: |
    The Sarenzan crossbowmen break and run back down the slope. And the Valdrennish knights, behind them, impatient, furious at being made to wait behind hired foot, ride them down.

    Then they come up the hill. Not in order: in a flood, banners everywhere, every lord racing every other for the honour of reaching the Adalian line first. The archers shoot them to pieces on the slope. Horses go down screaming, men fall under them, the ones behind ride over the ones in front.

    Some of them reach the line anyway.

    [break]

    They reach it in front of you.
  choices:
    - id: hold
      text: Hold the line. Shoulder to shoulder, and let them come onto the points.
      tags: [martial]
      lethal: true
      warn: Knights on horseback, against men on foot. Without armour, or carrying a wound, you will not survive being ridden down.
      check:
        attr: endurance
        skill: arms
        difficulty: 4
        mods:
          - { if: counter.hb_edge >= 2, add: 1, label: your men are steady }
          - { if: armour >= 2, add: 2, label: your harness }
          - { if: armour == 1, add: 1, label: your jack }
          - { if: trait.veteran, add: 1, label: you have stood in a line before }
          - { if: retinue >= 4, add: 1, label: your following at your shoulder }
          - { if: flag.c1_won_combat || flag.c1_tourney_won, add: 1, label: you have beaten trained men before }
          - { if: flag.c1_joan_harness, add: 1, label: Sir Hugh Wyck's harness }
      success:
        text: The horse in front of you takes three spear-points in the chest and goes down kicking. Its rider rolls clear into your feet, and you hit him until he stops trying to get up. The line holds. The next wave comes, and it holds again.
        effects: [ { add: { counter.hb_held: 1, res.renown: 1 } }, { trait: +veteran } ]
        next: c2_hautbois_3
      partial:
        text: The line holds. A horse goes down across it, across you, and when they drag it off you are alive with your ribs stove in. Around you, not everyone is.
        effects: [ { add: { counter.hb_held: 1 } }, { injury: crushed_ribs }, { casualties: { men: 1, named: 1, spare: [ davy_ludd ] } }, { trait: +veteran } ]
        next: c2_hautbois_3
      failure:
        text: "[if armour >= 1 && !injured]The line bends where you are standing. A horse comes through it and over you, and your harness is the only reason you are still there when they pull you out.[else]A horse comes through the line where you are standing, and you go under it, and do not come up.[/if]"
        effects:
          - if: [ armour >= 1, "!injured" ]
            then: [ { injury: crushed_ribs }, { casualties: { men: 1, named: 1, spare: [ davy_ludd ] } } ]
            else: [ { die: "Ridden down in the line at Hautbois, in the first charge, aged {age}." } ]
        next: c2_hautbois_3
    - id: second
      text: Stand in the second rank, behind your men, and let the front rank take the shock.
      tags: [yield]
      text_after: It is where a captain is supposed to stand, some say. Others say different. The front rank takes the shock and holds, mostly. You lose men you put in front of you. You keep your own skin, and you know exactly what it cost.
      effects: [ { add: { counter.hb_held: 1 } }, { casualties: { men: 1, named: 1, spare: [ davy_ludd ] } } ]
      next: c2_hautbois_3
    - id: archers
      text: Get the stakes moved forward where the archers' wedge meets the line, to close the gap the horses are making for.
      tags: [cunning, allies]
      check:
        attr: wits
        skill: tactics
        difficulty: 4
        mods:
          - { if: counter.hb_edge >= 1, add: 1, label: the line is steady }
          - { if: background == archer, add: 1, label: you know archers }
      success:
        text: It is twenty men's work for the space of a paternoster, under arrows. When it is done, the gap the knights were riding for is a hedge of stakes, and the charge breaks on it and slides along the line to where the archers can shoot into the horses' flanks. Your captain sees who moved them.
        effects: [ { add: { counter.hb_held: 1, res.renown: 2, rel.@master.respect: 1 } } ]
        next: c2_hautbois_3
      failure:
        text: You get half of them moved before the horses arrive. It is not enough. You are knocked flat and trampled, and get up, and keep going.
        effects: [ { injury: bruised_ribs } ]
        next: c2_hautbois_3

- id: c2_hautbois_3
  chapter: ch2
  title: The Long Afternoon
  text: |
    They come fifteen times. Nobody can believe it afterwards, but men count, and it is fifteen. Each time the archers break them on the slope, and the ones who reach the line die on it, and each time there are more bodies on the hill for the next charge to ride over.

    By the eleventh charge you can barely lift your arms. By the thirteenth the archers are running out of arrows and going out in front of the stakes to pull them from the dead.

    [break]

    In the fourteenth, a great lord's banner reaches the line fifty paces to your left. A duke, by the lilies on his coat. His horse is killed under him and he goes down in a heap of his own men, alive, and worth more than everything you will ever own.

    At the same moment [if npc.aymer_ravell.friend]you see Aymer Ravell go down, to your right, under a Valdrennish knight with an axe.[elif npc.will_cobb.friend]you see Will Cobb, out in front of the stakes gathering arrows, cut off by three horsemen.[else]the line to your right begins to give, and if it goes, the whole centre goes.[/if]
  choices:
    - id: duke
      text: Go for the duke. A prisoner like that is a fortune.
      tags: [wealth, martial]
      check:
        attr: strength
        skill: arms
        difficulty: 6
        mods: [ { if: retinue >= 4, add: 1, label: your men go with you } ]
      success:
        text: You get to him first, through his own men, and he gives you his gauntlet with the lilies on it before anyone else can reach him. The Duke of Orbec. His ransom will be set by the King himself. Your share of it will be more money than your family has seen in four generations. It is the luck of a lifetime, and it was luck. The man who should have had him, a knight of the Earl of Carrow's, is lying dead a yard short.
        effects:
          - set: flag.c2_took_duke
          - add: { res.renown: 4, res.coin: 2400, rep.knights: 1 }
          - if: flag.c1_better_terms
            then: [ { add: { res.coin: 1200 } } ]
        next: c2_hautbois_4
      failure:
        text: You get there third. Sir Walter Pryce gets there first, and has the duke's gauntlet in his fist before you are close enough to see the lilies. It will make him rich. It was always going to be someone. It just was not going to be you.
        effects: [ { set: flag.c2_pryce_took_duke }, { add: { rel.walter_pryce.respect: 1 } } ]
        next: c2_hautbois_4
    - id: friend
      text: "[if npc.aymer_ravell.friend]Go for Aymer.[elif npc.will_cobb.friend]Go for Cobb.[else]Go right, where the line is breaking.[/if]"
      tags: [allies]
      lethal: true
      warn: You will be out of the line and alone for a moment. Without armour, or carrying a wound, a moment is enough.
      check:
        attr: strength
        skill: arms
        difficulty: 4
        mods:
          - { if: armour >= 2, add: 2, label: your harness }
          - { if: armour == 1, add: 1, label: your jack }
          - { if: npc.roger_tallis.follower, add: 1, label: Tallis comes with you }
      success:
        text: "[if npc.aymer_ravell.friend]You reach Aymer as the axe comes up the second time and take it on your own shield, and then Tallis and your men are there, and the Valdrennish knight is on the ground. Aymer gets up covered in someone else's blood and laughs like a madman. He will never mention this. He will never forget it either.[elif npc.will_cobb.friend]You reach Cobb with your men as the third horseman comes round, and drag him back behind the stakes with an arrow-bundle still under his arm. He curses you for a fool all the way. Then he sits down in the mud and does not say anything for a long time.[else]You get there in time. The line on the right holds, just. Men who were there remember who came.[/if] Somewhere to your left, someone else is taking the duke."
        effects:
          - add: { res.renown: 2, rep.honor: 1 }
          - if: npc.aymer_ravell.friend
            then: [ { add: { rel.aymer_ravell.affection: 3, rel.aymer_ravell.respect: 3 } }, { set: flag.c2_saved_aymer } ]
          - if: npc.will_cobb.friend
            then: [ { add: { rel.will_cobb.affection: 3, rel.will_cobb.respect: 2 } }, { set: flag.c2_saved_cobb } ]
        next: c2_hautbois_4
      partial:
        text: "[if npc.aymer_ravell.friend]You save Aymer. The axe that was for him takes you across the arm instead.[elif npc.will_cobb.friend]You save Cobb. A horseman's mace takes you on the shoulder on the way back.[else]The line holds. You pay for it.[/if]"
        effects:
          - injury: arrow_wound
          - add: { res.renown: 1, rep.honor: 1 }
          - if: npc.aymer_ravell.friend
            then: [ { add: { rel.aymer_ravell.affection: 3, rel.aymer_ravell.respect: 2 } }, { set: flag.c2_saved_aymer } ]
          - if: npc.will_cobb.friend
            then: [ { add: { rel.will_cobb.affection: 3 } }, { set: flag.c2_saved_cobb } ]
        next: c2_hautbois_4
      failure:
        text: "[if armour >= 1 && !injured]You are too late, and you go down yourself on the way back, and your men carry you behind the line. [if npc.aymer_ravell.friend]Aymer Ravell is dead.[elif npc.will_cobb.friend]Will Cobb is dead.[else]The line holds without you.[/if][else]You are too late, and alone, and out of the line, and that is how you die at Hautbois.[/if]"
        effects:
          - if: [ armour >= 1, "!injured" ]
            then:
              - injury: crushed_ribs
              - if: npc.aymer_ravell.friend
                then: [ { kill: aymer_ravell } ]
                else: [ { if: npc.will_cobb.friend, then: [ { kill: will_cobb } ] } ]
            else: [ { die: "Killed at Hautbois going out of the line for a friend, aged {age}." } ]
        next: c2_hautbois_4
    - id: hold
      text: Stay in your place in the line. The line is everything.
      tags: [yield]
      text_after: You stay. The duke is taken by someone. [if npc.aymer_ravell.friend]Aymer Ravell is pulled out from under the axe by men from his father's company, alive, his arm broken. He does not see that you stayed in the line. You do.[elif npc.will_cobb.friend]Will Cobb is dragged back behind the stakes by his own archers, bleeding, alive. He does not ask where you were.[else]The line holds.[/if]
      effects: [ { add: { rel.@master.respect: 1 } } ]
      next: c2_hautbois_4

- id: c2_hautbois_4
  chapter: ch2
  title: Dusk
  text: |
    The fifteenth charge is the last. When it breaks there is nobody left behind it.

    The sun goes down on the slope at Hautbois and on the dead on it, more dead than anyone has words for. The Valdrennish army is gone: fled, scattered, or lying in the valley. King Amaury left the field at dusk with a handful of men, they say, and knocked on the gate of a castle in the dark, and called out, "Open, it is the unfortunate King of Valdrenne."

    [break]

    The King forbids pursuit in the dark. The army stands on its hill all night in its ranks. Some men sleep standing up.

    There are still things to be done before morning.
  choices:
    - id: field
      text: Go down onto the field with a lantern, among the dead and the dying.
      tags: [cunning, piety]
      text_after: The heralds are going over the field already, counting the coats of arms. Fifteen hundred knights and lords, they say, and nobody counts the others. You find a boy younger than Davy under a horse, alive, and get him out, and give him water, and the next morning he is gone and so is your second-best knife. You find the dead of your own company and close their eyes.
      effects: [ { add: { rep.piety: 1, rep.honor: 1 } }, { set: flag.c2_hautbois_field } ]
      next: c2_hautbois_after
    - id: loot
      text: Go down onto the field for what the dead no longer need.
      tags: [wealth]
      text_after: Everyone is doing it. You come back with a Valdrennish sword better than your own, a purse, two rings, and a feeling you do not have a name for.
      effects: [ { item: +valdrennish_sword }, { add: { res.coin: 240, rep.ruthlessness: 1 } } ]
      next: c2_hautbois_after
    - id: stand
      text: Stand with your men in the line, as the King ordered, until dawn.
      tags: [allies]
      text_after: You stand. Your men stand around you. Toward dawn Simkin Barre starts singing quietly, and stops, and somebody else picks it up. When the sun comes up over the field nobody says anything at all.
      effects: [ { add: { rel.davy_ludd.loyalty: 1, rel.jankin_rooke.loyalty: 1, rel.simkin_barre.loyalty: 1, rel.roger_tallis.loyalty: 1, rel.wat_coker.loyalty: 1, rel.perkin_dyer.loyalty: 1, rel.gib_shawe.loyalty: 1, rel.dickon_laund.loyalty: 1 } } ]
      next: c2_hautbois_after

- id: c2_hautbois_after
  chapter: ch2
  title: After Hautbois
  on_enter:
    - if: [ station != knight, { any: [ flag.c2_took_duke, flag.c2_saved_aymer, flag.c2_saved_cobb, counter.hb_held >= 1 ] }, res.renown >= 5 ]
      then: [ { station: knight }, { set: flag.c2_knighted_field } ]
  text: |
    In the morning the King rides along the line and thanks the army, company by company. He is grey in the face and quiet. He thanks the archers first, which nobody has ever seen a king do.

    [if flag.c2_knighted_field]When he reaches your company he stops. Your master, or your captain, or Lord Ravell, you will never be sure who, has said something to him. He gets down from his horse, in the mud, in front of everyone, and draws his sword. "For yesterday," he says. And you kneel, and he knights you there on the field, among the dead, with blood still on your hands. There are men who will tell their grandsons that they saw it.[elif flag.c2_knighted_eve]You stand in the line with your new spurs, a knight of one day, and the King looks along the faces and nods.[/if]

    [break]

    The count comes in during the day. On the Valdrennish side: eleven princes and dukes, eighty bannerets, fifteen hundred knights, and nobody counts the rest. On the Adalian side, by the heralds' list: forty men.

    It does not feel like forty men.
  choices:
    - id: on
      text: Bury your dead, and go on.
      effects:
        - if: { any: [ [ npc.davy_ludd.follower ], [ npc.jankin_rooke.follower ] ] }
          then: [ { add: { rel.davy_ludd.loyalty: 1, rel.jankin_rooke.loyalty: 1 } } ]
      next: c2_feast

- id: c2_feast
  chapter: ch2
  title: The Victory Feast
  on_enter: [ { advance: { seasons: 1 } }, { meet: alys_fane } ]
  text: |
    The army marches north to the coast, and the Queen comes over from Adalia with her household to meet the King at the abbey of Saint-Riquier, and there is a feast for Hautbois.

    It is the strangest night of your life. A month ago you were in the mud at the Sorre. Tonight you are in an abbey refectory hung with captured banners, eating peacock, with the Queen's ladies at the high table in silk the colour of the sea.

    [break]

    [if flag.c1_omen_crown]The Queen wears a circlet of gold. You think of Mother Rook, and a woman with a crown on her, or near her, and you feel foolish, and you go on thinking it.[/if]

    One of them is Lady Alys Fane, the Earl of Westry's daughter. She is nineteen, tall, fair, and bored to death by the Earl of Carrow's son, who has been telling her about his horse for an hour. When the dancing starts, she looks down the hall for someone, anyone, who is not him.

    [if suit.heloise_corbie.status >= known]Héloïse de Corbie is at the feast too, at the far end of a lower table with the other Valdrennish women of rank who are guests of the King until their kinsmen's ransoms are paid. She is watching the Adalians celebrate. She is not smiling.[/if]
  choices:
    - id: alys
      text: Ask Lady Alys to dance, before the Earl of Carrow's son can.
      tags: [diplomacy]
      check:
        attr: presence
        skill: courtesy
        difficulty: 4
        audience: nobles
        mods:
          - { if: station == knight, add: 1, label: your spurs }
          - { if: res.renown >= 6, add: 1, label: your name from Hautbois }
          - { if: flag.c1_dubbed_by_king || flag.c2_knighted_eve || flag.c2_knighted_field, add: 1, label: the King made you himself }
      success:
        text: She looks at your hands, which are not a gentleman's, and at your face, and says yes before the Earl of Carrow's son has finished getting up. She dances well and talks badly, which she says is a family failing. At the end she asks what you did at Hautbois, and listens to the answer.
        effects:
          - assign: { suit.alys_fane.status: courted }
          - add: { suit.alys_fane.regard: 3, suit.alys_fane.discretion: -1, rel.alys_fane.affection: 2 }
        next: c2_sauvemer
      failure:
        text: She says, politely, that she has promised this dance. She has not promised it. She looks at you again later, once, from across the hall, as if she were reconsidering something.
        effects: [ { assign: { suit.alys_fane.status: known } }, { add: { suit.alys_fane.regard: 1 } } ]
        next: c2_sauvemer
    - id: heloise
      text: Go down to the lower table and sit with Héloïse de Corbie.
      tags: [diplomacy, piety]
      visible_if: [ suit.heloise_corbie.status >= known ]
      text_after: She does not want company, and says so, and does not tell you to leave. You sit there for an hour while the Adalians sing about Hautbois, and neither of you says much. At the end she says, "My cousin died on that hill. And two of my father's tenants. I do not know where they are buried." You find out, later. It takes a week. You write to tell her.
      effects:
        - add: { suit.heloise_corbie.regard: 3, rep.valdrenne: 1 }
        - assign: { suit.heloise_corbie.status: courted }
      next: c2_sauvemer
    - id: lords
      text: Work the room. Every great lord in Adalia is here tonight, and they are all drunk and generous.
      tags: [cunning]
      check: { attr: presence, skill: diplomacy, difficulty: 4, audience: nobles, mods: [ { if: res.renown >= 6, add: 2, label: your name from Hautbois } ] }
      success:
        text: By midnight the Earl of Westry has heard your name, the Earl of Carrow has offered you wine, and two bannerets have asked whose man you are. A name made on a battlefield fades fast. Tonight you have made sure the right people heard it while it was loud.
        effects: [ { set: flag.c2_feast_known }, { add: { rep.nobles: 2, rel.baldwin_westry.respect: 1 } }, { meet: baldwin_westry } ]
        next: c2_sauvemer
      failure:
        text: Great lords at a victory feast want to talk to each other, about themselves.
        next: c2_sauvemer
    - id: men
      text: Slip out and drink with your own men in the abbey barn.
      tags: [allies]
      text_after: It is a better party. Simkin Barre has stolen a whole cask from the abbey cellar. Davy is sick. Somebody sings the Harrow Ford song and then someone makes up a Hautbois verse, which is filthy, and everyone learns it.
      effects: [ { add: { rel.davy_ludd.loyalty: 2, rel.simkin_barre.loyalty: 2, rel.jankin_rooke.loyalty: 1, rel.roger_tallis.loyalty: 1, rel.wat_coker.loyalty: 1, rel.perkin_dyer.loyalty: 1, rel.gib_shawe.loyalty: 1, rel.dickon_laund.loyalty: 1, rep.commons: 1 } } ]
      next: c2_sauvemer

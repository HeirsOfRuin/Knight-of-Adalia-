# Chapter 1 ending: the war is declared. Knighthood in peacetime, or the
# field as a man-at-arms with a patron's promise. Age 19-20.

- id: c1_war_comes
  chapter: ch1
  title: The Claim
  on_enter: [ { advance: { seasons: 2 } } ]
  text: |
    You are {age}.

    At Christmas the heralds ride through every shire town in Adalia with the King's letters. Aldred, by the grace of God King of Adalia, is by right of his mother the true King of Valdrenne, and will take what is his. The Moot has granted a tenth and a fifteenth. Writs of array go out for archers. The great lords are to bring their companies to Saltcombe by Saint George's Day.

    Lord Ravell will take forty lances and two hundred archers. Every knight of his is going. Every squire is going. [if alias.master == walter_pryce]The Earl of Carrow's company will be twice that, and Sir Walter Pryce means to come home from it a banneret.[/if]

    For a squire, there is one question now. Whether you cross the Narrow Sea with spurs on your heels, or without them.
  choices:
    - id: ready
      text: Make ready.
      next:
        switch: [ { if: station == squire, go: c1_means } ]
        default: c1_man_at_arms

- id: c1_means
  chapter: ch1
  title: Horse and Harness
  text: |
    A knight must have a warhorse, a riding horse, a harness of plate, a squire of his own, and the means to keep all of them for a summer's campaign. A squire with none of those things can be knighted, in law. In practice, nobody will dub a man who cannot afford to be one. It shames the man who dubs him.

    You have {coin}. [if item.prize_harness]You have the prize harness from the Ravell tourney.[/if][if res.horses >= 1] You have a horse of your own.[/if]
  choices:
    - id: master
      text: "Accept what your master offers: his spare harness and a horse from his string."
      tags: [allies]
      requires: [ npc.@master.alive, rel.@master.affection >= 3 ]
      label: "Requires: your master's affection"
      text_after: "[if alias.master == hamon_darrell]Sir Hamon gives you his old harness, which was the best in the shire in the old King's day, and his second destrier. He cannot afford either. He will not hear a word about it.[elif alias.master == ancel_brome]Sir Ancel gives you a Caldmoor horse he took in a raid and a harness that has been mended in more places than it has not. \"You'll be killed in it,\" he says. \"Not soon.\"[else]Your master equips you from his own stores. You will owe him for it in service. That is the point.[/if]"
      effects: [ { set: flag.c1_has_means }, { add: { rel.@master.affection: 1, favor.@master: -1 } } ]
      next: c1_knighting
    - id: ravell
      text: Accept a fee from Lord Ravell, ten pounds a year for life, for your service.
      tags: [allies]
      requires: [ flag.ravell_favor ]
      label: "Requires: Lord Ravell's favour"
      text_after: Lord Ravell's clerk draws up the indenture. Ten pounds a year from the rents of Ravell Mill, for your life, for service in peace and war. You are Ravell's man now, in writing. People will treat you as one, for good and ill.
      effects:
        - set: flag.c1_has_means
        - set: flag.c1_ravell_fee
        - set: flag.strong_patron
        - trait: +ravell_man
        - add: { favor.thurstan_ravell: -1 }
      next: c1_knighting
    - id: own
      text: Ride your own horse, in your own prize harness.
      tags: [martial]
      requires: [ item.prize_harness, res.horses >= 1 ]
      label: "Requires: the prize harness and a horse of your own"
      text_after: You owe nobody for it. It is the best feeling you have had in your life, and it lasts until you see the cost of fodder.
      effects: [ { set: flag.c1_has_means }, { add: { rep.knights: 1 } } ]
      next: c1_knighting
    - id: buy
      text: Buy a second-hand harness and a horse in Wendham. Four pounds.
      tags: [wealth]
      requires: [ res.coin >= 960 ]
      text_after: The harness belonged to a knight who died of the flux at Christmas. The horse belonged to someone who did not want it. Both will do. Your purse will not recover this year.
      effects: [ { set: flag.c1_has_means }, { add: { res.coin: -960, res.horses: 1 } } ]
      next: c1_knighting
    - id: lanzi
      text: Borrow twenty pounds from the Lanzi bank against what you will win in Valdrenne.
      tags: [wealth]
      requires: [ { any: [ background == burgess, npc.bertuccio_lanzi.met ] } ]
      label: "Requires: a way in at the Lanzi bank"
      text_after: Master Lanzi lends against ransoms not yet taken, at a rate that assumes some of the borrowers will die. You sign. You are equipped like a lord's son and in debt like one.
      effects:
        - set: flag.c1_has_means
        - set: flag.c1_lanzi_debt
        - add: { counter.lanzi_debt: 20, res.horses: 1, rep.sarenza: 1 }
      next: c1_knighting
    - id: joan
      text: Accept Dame Joan Wyck's offer of her late husband's harness and horse.
      tags: [allies]
      requires: [ suit.joan_wyck.regard >= 3 ]
      label: "Requires: Dame Joan's regard"
      text_after: She sends them to Ravell with a groom and a letter that says only, "He would have wanted them used." Everyone at Ravell knows whose harness it is. Ralph Wyck, her stepson, rides over to say what he thinks of it, in the hall, in front of people.
      effects:
        - set: flag.c1_has_means
        - set: flag.c1_joan_harness
        - add: { suit.joan_wyck.regard: 2, suit.joan_wyck.discretion: -3 }
      next: c1_knighting
    - id: carrow
      text: Accept Sir Walter Pryce's offer of horse and harness from the Earl of Carrow, and wear the Earl's livery.
      tags: [cunning, allies]
      requires: [ { any: [ flag.c1_pryce_contact, flag.c1_pryce_man ] } ]
      label: "Requires: Sir Walter Pryce's acquaintance"
      text_after: The Earl of Carrow equips forty young men this spring, and asks only that they wear his badge, the black boar, and remember who paid for their horses. Lord Ravell sees the boar on your coat in the yard and says nothing at all, which is how lords say a great deal.
      effects:
        - set: flag.c1_has_means
        - set: flag.c1_carrow_livery
        - add: { rel.thurstan_ravell.affection: -3, rel.walter_pryce.affection: 1, rep.nobles: 1, res.horses: 1 }
      next: c1_knighting
    - id: none
      text: You cannot. Go to the war as you are, and win it there.
      tags: [yield]
      text_after: Many men have won their spurs in the field. Many more have died trying. You know the numbers. You go anyway.
      next: c1_man_at_arms

- id: c1_knighting
  chapter: ch1
  title: The Accolade
  text: |
    You have the means. Now you need a knight willing to give you the accolade, and to stand for you afterwards, because a knight dubbed by nobody in particular is nobody in particular.

    [if trait.oathbreaker]There are knights at Ravell who will not stand in the same chapel as you.[/if]
  choices:
    - id: master
      text: Ask your master to knight you.
      tags: [allies]
      requires: [ npc.@master.alive, rel.@master.respect >= 3, res.renown >= 2 ]
      label: "Requires: your master's respect, and some renown"
      text_after: He says yes before you have finished asking.
      effects:
        - station: knight
        - set: flag.c1_dubbed_by_master
        - add: { rel.@master.affection: 2 }
      next: c1_dubbing
    - id: ravell
      text: Accept Lord Ravell's offer to knight you himself, before the household.
      tags: [allies]
      requires: [ flag.ravell_favor, res.renown >= 3 ]
      label: "Requires: Lord Ravell's favour, and renown"
      text_after: A baron's accolade is worth more than a knight's. Lord Ravell knows it. So does everyone who will hear of it.
      effects:
        - station: knight
        - set: flag.c1_dubbed_by_ravell
        - set: flag.strong_patron
        - add: { rel.thurstan_ravell.affection: 2, rep.nobles: 1 }
      next: c1_dubbing
    - id: king
      text: Go to Saltcombe, where the King will knight a batch of squires before the army sails.
      tags: [diplomacy]
      requires: [ flag.c1_king_noticed, res.renown >= 2 ]
      label: "Requires: the King's notice, and renown"
      text_after: Sixty young men kneel on the shingle at Saltcombe in a gale. The King goes down the line with his sword and does not know most of their names. He knows yours. He says it as he touches your shoulder, so that the men either side of you hear it.
      effects:
        - station: knight
        - set: flag.c1_dubbed_by_king
        - add: { rep.crown: 2, res.renown: 1 }
      next: c1_dubbing
    - id: pryce
      text: Kneel to Sir Walter Pryce, in the Earl of Carrow's colours.
      tags: [cunning]
      requires: [ flag.c1_carrow_livery, res.renown >= 1 ]
      label: "Requires: the Earl of Carrow's livery, and a little renown"
      text_after: Sir Walter dubs you in the Earl's chapel at Carrow, with eleven others, all in the black boar. It is quick and businesslike. Afterwards he hands each of you an indenture for three years' service to the Earl. Everyone signs. That was always the price.
      effects:
        - station: knight
        - set: flag.c1_dubbed_by_pryce
        - set: flag.c1_carrow_indenture
        - alias: { master: walter_pryce }
        - add: { rel.walter_pryce.respect: 1, rep.knights: -1 }
      next: c1_dubbing
    - id: wait
      text: Not yet. Go to war as a man-at-arms under your master's banner, and win your spurs in the field.
      tags: [yield]
      text_after: It is the old way, and the harder one. Your master swears to put you forward at the first chance.
      next: c1_man_at_arms

- id: c1_dubbing
  chapter: ch1
  title: The Vigil
  text: |
    The night before, you keep vigil in the chapel in a white shirt, with your sword on the altar. You are supposed to pray until dawn and think about the duties of a knight: to defend the Church, the weak, the widow, and his lord.

    In the morning you are bathed, dressed, armed, and struck once on the neck. It is harder than you expected. Then you are Sir {name}, and the world is exactly the same, except that it is not.
  choices:
    - id: pray
      text: Pray, as you are meant to, until dawn.
      tags: [piety]
      text_after: Around Lauds you stop asking for things and just kneel. When the light comes through the east window it is the first time in your life you have been entirely alone with yourself. You do not much like the company. It is a start.
      effects: [ { add: { rep.piety: 2, rep.church: 1 } } ]
      next: c1_farewell
    - id: friends
      text: Let your friends smuggle in a flask and keep you company.
      tags: [allies]
      text_after: Aymer and two of the younger squires come in after Compline with a flask of brandywine and stay until the chaplain throws them out. It is not holy. It is the vigil you will remember.
      effects: [ { add: { rep.knights: 1, rel.aymer_ravell.affection: 2 } } ]
      next: c1_farewell
    - id: think
      text: Sit with your sword and think about what you will do with it.
      tags: [cunning]
      text_after: You count, as you always have. What a knight's fee is worth. What a ransom is worth. What a manor is worth. How many men your age will come back from Valdrenne richer than they went. By dawn you have a plan, of sorts. It has a great many dead men in it, and you are not one of them.
      effects: [ { add: { skill.tactics: 1, rep.ruthlessness: 1 } } ]
      next: c1_farewell

- id: c1_man_at_arms
  chapter: ch1
  title: The Indenture
  on_enter:
    - if: { any: [ "!npc.@master.alive", alias.master == hamon_darrell ] }
      then:
        - if: { any: [ "!npc.@master.alive", flag.c1_hamon_fell ] }
          then: [ { alias: { master: walter_pryce } }, { set: flag.c1_pryce_man } ]
  text: |
    You will cross as a man-at-arms: a mounted soldier in harness, paid a shilling a day, a long step below a knight and a long step above an archer.

    [if alias.master == walter_pryce]Sir Walter Pryce draws up the indenture for the Earl of Carrow's company. A year's service, half the profits of war to the Earl, a third of your ransoms to your captain. He adds a line in his own hand: that he will present you for knighthood at the first fit occasion in the field. "I keep my word," he says. "It's cheaper than keeping men."[elif alias.master == thurstan_ravell]Lord Ravell's clerk draws up the indenture. A year, wages at the King's rate, ransoms shared by custom. Lord Ravell signs it himself, and adds that he will see you knighted on the field if you give him the chance.[else]Your master draws up the indenture with Father Benet. A year's service, a shilling a day, a share of ransoms. Then he swears on the chapel relics, in front of you, that he will put you forward for the spurs at the first fight worth the name.[/if]

    It is a promise. On campaign promises are what men live on, until the pay comes.
  choices:
    - id: sign
      text: Put your hand to it.
      tags: [allies]
      text_after: The sand is shaken over your name and the indenture is cut in two along a wavy line, one half for each of you. You belong to someone now, in writing.
      effects:
        - station: retainer
          track: man_at_arms
        - set: flag.c1_sponsor_promise
        - add: { favor.@master: -1 }
      next: c1_farewell
    - id: haggle
      text: Haggle for better terms. A bigger share of ransoms.
      tags: [wealth]
      check: { attr: presence, skill: trade, difficulty: 3, audience: knights }
      success:
        text: Half your ransoms instead of two-thirds to your captain. He agrees, because the clerk is watching and you are right. He likes you a little less for it.
        effects:
          - station: retainer
            track: man_at_arms
          - set: flag.c1_sponsor_promise
          - set: flag.c1_better_terms
          - add: { rel.@master.affection: -1, favor.@master: -1 }
        next: c1_farewell
      failure:
        text: He laughs and tells you that a man who haggles before the first fight has not seen one. You sign the old terms.
        effects:
          - station: retainer
            track: man_at_arms
          - set: flag.c1_sponsor_promise
          - add: { favor.@master: -1 }
        next: c1_farewell
    - id: oath
      text: Ask him to swear the promise on the relics again, before witnesses.
      tags: [piety]
      text_after: He does it. Six men hear him. A promise made on relics in front of six men is hard to forget, even in Valdrenne.
      effects:
        - station: retainer
          track: man_at_arms
        - set: flag.c1_sponsor_promise
        - set: flag.c1_sworn_promise
        - add: { favor.@master: -1, rel.@master.respect: 1 }
      next: c1_farewell

- id: c1_farewell
  chapter: ch1
  title: Before the Ships
  on_enter: [ { advance: { seasons: 1 } } ]
  text: |
    You are {age}. The army musters at Saltcombe in a week.

    There is time for one thing before you go. Perhaps two, if you do not sleep.

    [if suit.isabel_sayer.status >= courted]Isabel Sayer is at Ravell with Lady Ravell's household.[/if] [if suit.maud_delisle.status >= courted]Lady Maud de Lisle is at Wendmere in the King's wardship, and has written to you twice.[/if] [if suit.cecily_fuller.status >= courted]Cecily Fuller is in Wendham, keeping her father's books.[/if] [if suit.joan_wyck.regard >= 3]Dame Joan Wyck is at Wyck, a half-day west.[/if] [if counter.tokens >= 1]You have already given a token to someone. Men who give two tokens are found out.[/if]
  choices:
    - id: isabel
      text: Find Isabel Sayer and give her your token.
      tags: [diplomacy]
      visible_if: [ suit.isabel_sayer.status >= courted ]
      text_after: She gives you a ring of plaited hair in return and tells you not to be a fool in Valdrenne. Her father, she says, has had an offer for her from a widowed knight in Hollesby. She has asked him to wait a year. He will not wait two.
      effects:
        - assign: { suit.isabel_sayer.pledge: token }
        - add: { suit.isabel_sayer.regard: 2, counter.tokens: 1 }
        - item: +girl_token
      next: c1_end
    - id: maud
      text: Ride to Wendmere and see Lady Maud, however briefly.
      tags: [cunning]
      visible_if: [ suit.maud_delisle.status >= courted ]
      text_after: You are allowed a quarter-hour in a parlour with a nun in the corner. Maud gives you her glove under the nun's nose. She says the King has promised her marriage to nobody yet, and that she has not promised herself to anybody either. She looks at you when she says it.
      effects:
        - assign: { suit.maud_delisle.pledge: token }
        - add: { suit.maud_delisle.regard: 2, suit.maud_delisle.discretion: -2, counter.tokens: 1 }
        - item: +girl_token
      next: c1_end
    - id: cecily
      text: Go to Wendham and see Cecily Fuller.
      tags: [wealth]
      visible_if: [ suit.cecily_fuller.status >= courted ]
      text_after: She gives you a purse she has embroidered herself, with a pound in it, and says it is a loan. Then she says it is not a loan. Then she says her father has been asked for her hand by a Sarenzan factor and has not said no.
      effects:
        - assign: { suit.cecily_fuller.pledge: token }
        - add: { suit.cecily_fuller.regard: 2, res.coin: 240, counter.tokens: 1 }
        - item: +girl_token
      next: c1_end
    - id: joan
      text: Ride to Wyck and see Dame Joan.
      tags: [diplomacy]
      visible_if: [ suit.joan_wyck.regard >= 3 ]
      text_after: She feeds you and walks you round the fields and tells you what the harvest will be. At the gate she says that a widow who remarries loses her dower lands in some counties, and that she has looked it up, and in this one she does not. She does not say why she looked it up.
      effects:
        - assign: { suit.joan_wyck.status: courted }
        - add: { suit.joan_wyck.regard: 2, counter.tokens: 1 }
      next: c1_end
    - id: home
      text: "Go home to [if background == reeve]Ashby[elif background == burgess]Wendham[elif background == archer]your father's cottage[else]Ravell's laundry yard[/if] one last time."
      tags: [allies]
      text_after: |
        [if background == reeve]Your father[if flag.c1_father_exposed] will not see you. Your mother does, at the door, for a moment.[else] walks you to the stile again. [if suit.mag_coker.regard >= 3]Mag Coker is at the well. She is not married yet. She says she is waiting for nobody in particular.[/if][/if][elif background == burgess]Your father shows you the family's accounts, all of them, for the first time. [if suit.annot_dyer.regard >= 3]Annot Dyer is still at the vats. She says the war will make you rich or dead and she does not mind which, which is a lie.[/if][elif background == archer]Your father makes you draw his bow for him, and watches, and nods. [if suit.mariot_wood.regard >= 3]Mariot Wood is where the chase meets the road, again. She gives you back the horn button you lost, which she found, she says, by chance.[/if][else]Your mother has a place in a Wendham household now, or still at Ravell; either way she makes you kneel for her blessing. [if suit.nell_laundress.regard >= 3]Nell is in the drying-yard and has stopped working.[/if][/if]
      effects:
        - if: background == reeve
          then: [ { add: { rel.piers_reeve.affection: 1, suit.mag_coker.regard: 1 } } ]
        - if: background == burgess
          then: [ { add: { rel.ralf_mercer.affection: 1, suit.annot_dyer.regard: 1 } } ]
        - if: background == archer
          then: [ { add: { rel.hugh_fletcher.affection: 1, suit.mariot_wood.regard: 1 } } ]
        - if: background == servant
          then: [ { add: { rel.agnes_tirewoman.affection: 1, suit.nell_laundress.regard: 1 } } ]
      next: c1_end
    - id: chapel
      text: Spend the night in the chapel. Nobody can say you went unshriven.
      tags: [piety]
      text_after: Father Benet hears your confession, which takes some time, and gives you absolution, which takes a moment. He says the dead in Valdrenne will all have been shriven too, and that you should remember it.
      effects: [ { add: { rep.piety: 1, rep.church: 1 } } ]
      next: c1_end
    - id: alehouse
      text: Spend the last night in the alehouse with the men.
      text_after: Will Cobb's archers sing the old Harrow Ford song, all twenty verses. You know nineteen. Nobody sleeps. Everyone remembers.
      effects: [ { add: { rep.commons: 1, rep.knights: 1 } } ]
      next: c1_end

- id: c1_end
  chapter: ch1
  kind: ending
  ending: ch1_complete
  title: Saltcombe
  on_enter:
    - if: counter.tokens >= 2
      then: [ { set: flag.c1_two_tokens } ]
  text: |
    You are {age}.

    Saltcombe harbour is so full of ships that you could walk across it on their decks. Horses are being slung aboard in canvas with their legs kicking. Archers are counting arrows. A Sarenzan galley sits at the mouth of the harbour like a crow on a fence, waiting to see who wins.

    [if station == knight]You go aboard as Sir {name}, with a horse below decks and a harness in a barrel, and no idea what any of it will be worth in a month.[else]You go aboard as a man-at-arms in {npc.@master.title}'s company, with a promise in your purse in place of spurs.[/if]

    [if trait.oathbreaker]There are men on this ship who know what you did to your old master. They will be beside you in the line.[/if][if flag.c1_coll_hanged] Somewhere north of the Leven, Black Ewan is waiting for the army to be gone.[/if][if flag.c1_lanzi_debt] The Lanzi bank has your name in its book, and twenty pounds against it.[/if][if flag.c1_two_tokens] Two women have your token, and each believes she is the only one.[/if]

    End of Chapter 1. The war is next.

        You give him the meadows. They were never really yours: half the hay there has been cut by Brésy men every summer since the old King's time. Gautier knows it, and you know it, and he is grateful anyway. Aliénor says nothing, but at dinner she passes you the salt before you ask for it.
      effects: [{"add": {"estate.food": -1}}, {"set": "flag.c3_gave_meadows"}]

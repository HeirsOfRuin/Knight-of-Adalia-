# Book I, Act II for the crowned path (STORY.md, "The crowned path, Act II", K1-K11, the author's decisions
# L3-34 to L3-37): years 58-63 (920-925). The Estates answer the summons of 920. In an elective run (Knight of
# Adalia's c5r_estates_choose) the likely outcome is the young sovereign confirmed for life with the Estates keeping
# the next choice (h_crown_for_life); the crown overturns it to a hereditary crown only if its case
# (counter.overturn) reaches six with an ally (counter.allies). Otherwise the crown's law is confirmed
# (h_crown_eldest). Penhoët, refused the Armance by the male line, waits for Mahaut's death (h_k_penhoet_waits).
# The regency ends at sixteen, handed over or taken. Bertrand de Quérec rises again with the free companies.

- id: h_k01_estates
  chapter: book1
  title: The Estates Sit
  checkpoint: true
  card: { title: "Book One, Act Two", subtitle: The Law, epigraph: "A crown is a promise the Estates made once, and are asked to make again every time it changes heads." }
  frames: [free]
  on_enter: [ { catch_up: { year: 58, season: summer } } ]
  text: |
    At Whitsun in 920 the Estates of the West sit at Lannec, in the hall where your father was made king and you were acclaimed: the lords on their benches, the bishops in their stalls, the burgesses of the salt towns at the back. [if inherited.c5r_estates_choose && !flag.h_c_law_written]They have one question in front of them, and it is you: whether the crown of the West is theirs to give each time it falls, or whether it goes by blood.[else]They have the law of succession in front of them, and a petition from the male-line lords to write it again.[/if]

    Before the first session Hervé de Penhoët asks for an hour, and gets it, in your mother's solar, with your mother in the room. He says it again, plainly: Penhoët's voice, and the voices of the Armance lords who go with Penhoët, for the {house.ruler_lc}'s cause. In return, the custom of the Armance, written by the Estates as it was: by the male line[if hero.sex == male], and through men[/if]. At your mother's death the duchy would come to Penhoët.

    Your mother says nothing at all. She is looking at you.
  choices:
    - id: accept
      text: Take Hervé's bargain. The crown is worth a duchy.
      effects: [ { set: flag.h_k_bargain }, { add: { counter.overturn: 2, counter.allies: 1, rival.penhoet.temper: 4, rel.mahaut_armance.affection: -4 } } ]
      text_after: |
        Hervé kneels to you, there in the solar, and kisses your hand, and goes out. Your mother stays. "My grandmother held the Armance against a king," she says, "for forty years. I'd hoped it would take longer than an hour to give away." She goes out too. She does not come to Compline that night, or the next.
      next: h_k02_case
    - id: refuse
      text: Refuse him. The Armance is your mother's, and then yours.
      effects: [ { set: flag.h_k_penhoet_waits }, { add: { rival.penhoet.temper: -3, rel.mahaut_armance.affection: 3, rel.mahaut_armance.respect: 1 } } ]
      text_after: |
        Hervé bows, as if you had given him the answer he expected, and says that Penhoët is a patient house. He votes against the crown that week, and so do the Armance lords who go with him. He says nothing about the duchy again. Your mother says, that night, "He'll wait for me to die. Let him wait."
      next: h_k02_case
    - id: estates
      text: Tell him the Estates will write the Armance's custom, not the crown.
      effects: [ { set: flag.h_k_armance_estates }, { add: { rival.penhoet.temper: -1 } } ]
      text_after: |
        "Then the Estates will have to be asked," Hervé says, pleasantly, and goes to ask them, bench by bench. Your mother says it was the right answer and the wrong year.
      next: h_k02_case

- id: h_k02_case
  chapter: book1
  title: The Crown's Case
  frames: [free]
  on_enter: [ { catch_up: { year: 58, season: autumn } } ]
  text: |
    [if inherited.c5r_estates_choose && !flag.h_c_law_written]At Michaelmas the council meets to decide what the crown will ask of the Estates. The chancellor has three drafts. The first asks the Estates to make the crown hereditary, the eldest child for ever, as Valdrenne's and Adalia's are. The second asks them only to confirm you for your life, and keep the next choice for themselves, as your father promised. The third asks them nothing and stands on the acclamation of 917.

    {house.querec_start} has a draft too. It came by a salt carter, nailed to the church door at Sauvemer: THE WEST CHOOSES ITS KINGS.[else]At Michaelmas the male-line lords present their petition: the crown and the great fiefs of the West to pass by sons, and through sons, as Valdrenne's do, "for the next reign, if not for this one". [if hero.sex == female]For this one too, some of them say, more quietly.[else]Nobody says it touches you. Everyone knows it touches your sisters, and your daughters.[/if] The council meets to decide what the crown will answer.[/if]
  choices:
    - id: hereditary
      visible_if: "inherited.c5r_estates_choose && !flag.h_c_law_written"
      text: Ask for a hereditary crown.
      effects: [ { set: flag.h_k_asked_hereditary }, { add: { counter.overturn: 2, rel.mahaut_armance.respect: 1 } }, { if: "counter.favour >= 3", then: [ { add: { counter.overturn: 1 } } ] }, { add: { counter.favour: -1 } } ]
      text_after: |
        The draft goes to the Estates under the Great Seal. In the inns at Lannec the lords read it aloud to each other, and the burgesses of the salt towns ask what they will be given in return for giving up a right. {house.querec_short} has a new pamphlet out by Martinmas.
      next: h_k03_count
    - id: for_life
      visible_if: "inherited.c5r_estates_choose && !flag.h_c_law_written"
      text: Ask only to be confirmed for life, as your father promised.
      effects: [ { set: flag.h_k_for_life_asked }, { add: { counter.favour: 2, counter.shadow: 1 } } ]
      text_after: |
        The draft goes to the Estates under the Great Seal, and the hall reads it in silence, and then a burgess of Sauvemer stands up and says, "That's a king who keeps his father's word," and the hall cheers. {house.querec_short}'s pamphlets stop selling for a while.
      next: h_k03_count
    - id: nothing
      text: "[if inherited.c5r_estates_choose && !flag.h_c_law_written]Ask them nothing. You were acclaimed.[else]Let the Estates decide it without the crown.[/if]"
      effects: [ { add: { counter.household: 1, counter.favour: -1 } } ]
      text_after: |
        The crown sends the Estates no word at all. They debate the question anyway, at length, without you, which your mother says is the worst of both.
      next: h_k03_count
    - id: answer
      visible_if: "!inherited.c5r_estates_choose || flag.h_c_law_written"
      text: Answer the petition yourself, in the hall.
      check: { attr: presence, skill: diplomacy, difficulty: 6, audience: nobles, mods: [ { if: flag.h_oath_reserved, add: 1, label: they remember your acclamation }, { if: flag.h_bc_vote, add: 1, label: you sit in your own council } ] }
      success:
        text: |
          You stand at the dais at {age_words} and answer them point by point, the way your mother taught you after Compline, and sit down. The petition is withdrawn a week later "for further consideration", which is how the Estates bury things.
        effects: [ { set: flag.h_k_petition_answered }, { add: { counter.favour: 2, rel.mahaut_armance.respect: 1 } } ]
        next: h_k03_count
      failure:
        text: |
          You stand and answer them, and an old lord of the male line asks, with great courtesy, whether the {house.ruler} wrote the answer, and the hall laughs. The petition stays on the table.
        effects: [ { add: { counter.shadow: 1 } } ]
        next: h_k03_count
    - id: mother
      visible_if: "!inherited.c5r_estates_choose || flag.h_c_law_written"
      text: Let your mother answer it, as regent.
      effects: [ { add: { counter.shadow: 1, rel.mahaut_armance.affection: 1 } }, { set: flag.h_k_petition_answered } ]
      text_after: |
        Your mother answers it in the hall in a quarter of an hour, in the voice she used when she chose your father, and the petition is withdrawn by Martinmas. Everyone agrees it was well done. Everyone notices who did it.
      next: h_k03_count

- id: h_k03_count
  chapter: book1
  title: The Count
  frames: [free]
  on_enter: [ { catch_up: { year: 58, season: winter } } ]
  text: |
    [if revisit]The chancellor makes a new mark in the second column, or rubs one out.[else]In the dark of the year the chancellor lays out the count on the council table: the lords, the bishops and the towns, in two columns.

    [if flag.h_k_asked_hereditary]The Estates will confirm you for life whatever happens; that much nobody disputes. A hereditary crown is another thing. The crown's case needs {house.law_need}[if counter.allies >= 1], and it has an ally beside the crown's own[else], and the crown cannot carry it alone[/if].[elif flag.h_k_for_life_asked]The crown has asked for what the Estates were always going to give. The count is a formality. The chancellor counts anyway, because a count is a list of friends.[else]The Estates will do what the Estates do. The chancellor's columns are the crown's friends and the crown's enemies, and the second is longer than he would like.[/if] [if flag.h_k_penhoet_waits]Penhoët and the Armance lords are in the second column, and will stay there.[elif flag.h_k_bargain]Penhoët and the Armance lords are in the first column, for now.[/if][/if]

    You have {coin}.
  choices:
    - id: spend
      text: Spend the crown's money in the corridors. (£150)
      visible_if: "!flag.h_k_spent"
      requires: "res.coin >= 36000"
      effects: [ { set: flag.h_k_spent }, { add: { res.coin: -36000, counter.overturn: 2 } } ]
      text_after: |
        Offices, a remission of the salt towns' farm, a debt or two forgiven, a wardship sold cheap to the right man. A hundred and fifty pounds of the crown's money goes where it will do the most good, and some of it gets there.
      next: h_k03_count
    - id: kerguen
      text: Bring Kerguen and its friends over.
      visible_if: "!flag.h_k_asked_kerguen"
      check: { attr: presence, skill: diplomacy, difficulty: 6, mods: [ { if: flag.h_bc_betrothed_kerguen, add: 2, label: your betrothed's house }, { if: holding.kerguen_loan, add: 1, label: Kerguen owes the crown }, { if: "rival.kerguen.temper >= 3", add: 1, label: Kerguen is friendly } ] }
      success:
        text: |
          Tanguy de Kerguen comes to the council table and puts his hand on it, and the three small houses that go where Kerguen goes put theirs beside it. "For the {house.ruler}," he says, and means it, and also means the thing he does not say, about what Kerguen will be owed.
        effects: [ { set: flag.h_k_asked_kerguen }, { add: { counter.allies: 1, counter.overturn: 2, rival.kerguen.standing: 3 } }, { set: flag.h_k_ally_kerguen } ]
        next: h_k03_count
      failure:
        text: |
          Tanguy hears you out with great courtesy and says that Kerguen must think. Kerguen thinks until Whitsun.
        effects: [ { set: flag.h_k_asked_kerguen }, { add: { rival.kerguen.temper: -1 } } ]
        next: h_k03_count
    - id: church
      text: Ask the Bishop of Saint-Lys to speak for the crown.
      visible_if: "!flag.h_k_asked_church"
      check: { attr: presence, skill: courtesy, difficulty: 6, mods: [ { if: flag.h_c_bishop_anselm, add: 2, label: your father's clerk is bishop }, { if: flag.h_c_bishop_armance, add: 1, label: your mother's confessor is bishop }, { if: flag.inv_h_school, add: 1, label: the school for clerks } ] }
      success:
        text: |
          The bishop preaches at Candlemas on the text "Render unto Caesar", and makes it clear which Caesar he means. The bishops' bench votes as one.
        effects: [ { set: flag.h_k_asked_church }, { add: { counter.allies: 1, counter.overturn: 2, rep.church: 1 } }, { set: flag.h_k_ally_church } ]
        next: h_k03_count
      failure:
        text: |
          The bishop preaches at Candlemas on the text "Render unto Caesar", and leaves it unclear which Caesar he means. The bishops' bench votes as it pleases.
        effects: [ { set: flag.h_k_asked_church } ]
        next: h_k03_count
    - id: hold
      text: "[if revisit]Enough. Let the count stand.[else]Spend nothing. Let the count stand.[/if]"
      effects: [ { if: "!flag.h_k_spent", then: [ { add: { counter.household: 1 } } ] } ]
      text_after: |
        The chancellor rolls up his columns. [if flag.h_k_spent]"Bought is bought," your mother says. "Let's hope it stays bought."[else]"The crown that has to buy its Estates," your mother says, "will have to buy them every time."[/if]
      next: { pool: h_b2_early, count: 1, then: h_k05_vote }

- id: h_k05_vote
  chapter: book1
  title: The Estates Decide
  checkpoint: true
  frames: [free]
  on_enter:
    - catch_up: { year: 60, season: summer }
    - if: [ inherited.c5r_estates_choose, "!flag.h_c_law_written" ]
      then:
        - if: [ flag.h_k_asked_hereditary, "counter.overturn >= 6", "counter.allies >= 1" ]
          then: [ { set: flag.h_crown_hereditary } ]
          else: [ { set: flag.h_crown_for_life } ]
      else: [ { set: flag.h_crown_eldest } ]
    - if: flag.h_k_bargain
      then: [ { set: flag.h_armance_male_line } ]
  text: |
    At Whitsun in 922 the Estates of the West vote, by bench, with their hands raised, and the clerk writes it in the roll of the Estates.

    [if flag.h_crown_hereditary]They make the crown hereditary: the eldest child of the last wearer, son or daughter, for ever. The Estates of the West have given away the one thing they were made to keep, and they cheer when they do it, which nobody had expected. In the marsh, they say, {house.querec_short} heard the news and went out and got drunk.[elif flag.h_crown_for_life]They confirm you as {house.ruler} of the West for your life, as your father promised, and keep for themselves the choosing of whoever comes after you. [if flag.h_k_asked_hereditary]The crown's draft for a hereditary crown is voted down, courteously, bench by bench. You have won your own crown and lost your children's.[else]The crown asked for nothing more, and gets nothing more.[/if] {house.querec_short} says, in the marsh, that the Estates have kept their right, and that rights are kept by being used.[else]They confirm the crown's law as it stands, the eldest child, son or daughter. [if flag.h_k_petition_answered]The male-line petition is not even put to the vote.[else]The male-line petition is put to the vote and lost, by fewer voices than the chancellor would like.[/if][/if]

    [if flag.h_armance_male_line]Then they write the custom of the Armance, as Hervé asked, and as the crown agreed: by the male line. At your mother's death the duchy goes to Penhoët. Your mother is in the hall. She does not move.[elif flag.h_k_armance_estates]Then they debate the custom of the Armance, and adjourn it to the next Estates, and the next. Penhoët will keep asking.[/if]
  choices:
    - id: on
      text: Go on.
      next: h_k07_rising

- id: h_k07_rising
  chapter: book1
  title: Bertrand Rises
  frames: [free]
  on_enter: [ { catch_up: { year: 61, season: summer } }, { war: Bertrand de Quérec } ]
  text: |
    At midsummer the free companies come down from the north, paid off from Caldmoor's war and looking for the next one, and {house.querec} finds them work.

    [if flag.h_bc_querec_exiled]He comes back over the march from Valdrenne with three companies behind him and his father's banner,[else]He rises in the marsh with three companies and the salt lords who never knelt,[/if] [if flag.h_crown_hereditary]in the name of the Estates' right, which the Estates gave away: THE WEST CHOOSES ITS KINGS.[elif flag.h_crown_for_life]in the name of the Estates' right, which the Estates kept: let them use it now.[else]against "the crown of a child and the child's mother".[/if][if flag.h_bc_querec_hostage] His son is your page at Lannec. Bertrand sends you word that the boy is yours to do with as you please, which is the worst thing he could have said.[/if] The salt-works at the edge of the marsh are his by Lammas. The salt carts stop. The trade of the West stops with them.

    The constable is at the door of the council chamber with his helmet under his arm. Your mother, at the end of the table, says, "This one is yours." For the first time in your life, so is the decision.
  choices:
    - id: lead
      text: Lead the host yourself. It is your first command.
      check: { attr: wits, skill: tactics, difficulty: 6, mods: [ { if: "res.men >= 100", add: 1, label: the crown's men }, { if: flag.h_c_rising_crushed, add: 1, label: you were at the bridge before }, { if: flag.inv_h_march, add: 1, label: the march castles hold } ] }
      lethal: false
      success:
        text: |
          You take the host down the salt road in the August heat, and the companies come out to meet you on the causeway, as companies do when they are paid by the day. At the toll bridge you put the archers on the dyke and the horse behind the sluice, the way the constable drew it in the dust, and when the companies break they break into the marsh, where the salt lords' tenants are waiting for them with flails. {house.querec_short} is taken in a reed hut at dawn, with his boots off.
        effects: [ { set: flag.h_k_bertrand_beaten }, { add: { res.renown: 6, counter.shadow: -2, res.men: -10, rep.knights: 2 } } ]
        next: h_k06_majority
      failure:
        text: |
          You take the host down the salt road in the August heat, and the companies will not come out to meet you; they burn the salt-works and fall back into the marsh, and you spend the autumn chasing smoke. By Michaelmas the host is half its size, and the companies are still in the marsh, and {house.querec_short} is still writing pamphlets.
        effects: [ { set: flag.h_k_war_long }, { add: { res.men: -25, res.coin: -12000, counter.household: -1 } } ]
        next: h_k06_majority
    - id: constable
      text: Send the constable, and stay at Lannec.
      effects: [ { set: flag.h_k_constable }, { add: { counter.shadow: 1, res.men: -12, res.coin: -7200 } } ]
      text_after: |
        The constable takes the host south and does it the old way, slowly, castle by castle, and it takes him till Martinmas. The companies are paid off with the crown's money in the end, which is what companies are for. {house.querec_short} escapes over the march again, laughing.
      next: h_k06_majority
    - id: treat
      text: Treat with him. Offer him the Estates' right, in a charter.
      visible_if: "!flag.h_crown_hereditary"
      effects: [ { set: flag.h_k_treated }, { add: { counter.favour: 1, rep.commons: 1, counter.household: -2 } } ]
      text_after: |
        You send the bishop, with a charter under the Great Seal: the Estates' right to choose the {house.ruler} after you, confirmed for ever, and a pardon for everyone in the marsh who goes home before Michaelmas. Most of them go home. The companies, who have not been paid, go north again. {house.querec_short} reads the charter twice and puts it inside his coat.
      next: h_k06_majority

- id: h_k06_majority
  chapter: book1
  title: Sixteen
  frames: [free]
  on_enter: [ { catch_up: { year: 61, season: autumn } }, { war: none } ]
  text: |
    At Michaelmas in 923 the regency ends. You are {age_words}, and of age, and your father's will set the day: the Michaelmas after the marsh was quiet, whatever the custom said, because he wanted you to have one war under your belt before you had the seals.

    [if rel.mahaut_armance.respect >= 3 || flag.h_bc_vote || flag.h_bc_learned]Your mother comes to the council chamber with the seals in a leather bag, the Great Seal and the privy seal and the signet, and puts them on the table in front of your chair, and steps back. "They're heavier than they look," she says. "I'll be in the solar, if you want me. Try not to want me for a month."[else]Your mother does not come to the council chamber. Her chancellor comes, with a paper: the regency council proposes, for the good of the realm, that the {house.ruler}'s government be shared with the council for a further term, until the {house.ruler} is "settled". The seals stay in your mother's solar. The Armance men on the council look at the table.[/if]
  choices:
    - id: thank
      visible_if: "rel.mahaut_armance.respect >= 3 || flag.h_bc_vote || flag.h_bc_learned"
      text: Take the seals, and ask her to stay on the council.
      effects: [ { set: flag.h_k_handed_over }, { add: { rel.mahaut_armance.affection: 2, counter.household: 1 } } ]
      text_after: |
        She stays on the council, at the end of the table, and says almost nothing for a year, and every lord in the room watches her face before he votes. It is the best of both, and it cannot last, and you both know it.
      next: h_k08_marsh
    - id: alone
      visible_if: "rel.mahaut_armance.respect >= 3 || flag.h_bc_vote || flag.h_bc_learned"
      text: Take the seals, and govern alone.
      effects: [ { set: flag.h_k_handed_over }, { add: { counter.shadow: -2, rel.mahaut_armance.affection: -1 } } ]
      text_after: |
        You thank her, and mean it, and take the seals to your own chamber. She goes back to the Armance at Whitsun, to her own lords, and writes to you every week, and never once tells you what to do. It is the hardest thing you have ever seen her do.
      next: h_k08_marsh
    - id: take
      visible_if: "rel.mahaut_armance.respect < 3 && !flag.h_bc_vote && !flag.h_bc_learned"
      text: Go to the solar yourself, and take the seals.
      check: { attr: presence, skill: command, difficulty: 6, mods: [ { if: "counter.household >= 3", add: 1, label: the household is yours }, { if: flag.h_bc_guard_own, add: 1, label: your own man keeps your door } ] }
      success:
        text: |
          You go to the solar with your guard captain behind you and the door open, so the whole gallery can see. Your mother looks at you for a long moment. Then she opens the chest and gives you the bag herself, so that it is a gift and not a taking. "Well," she says. "You're the {house.ruler}." It is what your father said, at your crowning, and she knows it.
        effects: [ { set: flag.h_k_took_seals }, { add: { counter.shadow: -2, rel.mahaut_armance.respect: 2, rel.mahaut_armance.affection: -2 } } ]
        next: h_k08_marsh
      failure:
        text: |
          You go to the solar, and your mother's chancellor is at the door, and talks to you for half an hour about the good of the realm, and by the end of it you have agreed to a council "for a year". You come out with nothing in your hands. The gallery saw.
        effects: [ { set: flag.h_k_council_year }, { add: { counter.shadow: 1, counter.household: -1 } } ]
        next: h_k08_marsh
    - id: wait
      text: "[if rel.mahaut_armance.respect >= 3 || flag.h_bc_vote || flag.h_bc_learned]Ask her to keep the seals a year longer.[else]Agree to the council, for a year.[/if]"
      effects: [ { set: flag.h_k_council_year }, { add: { counter.shadow: 1, rel.mahaut_armance.affection: 1 } } ]
      text_after: |
        A year, you say, and your mother's chancellor writes it down. It is the safe answer. The lords of the West note who gave it.
      next: h_k08_marsh
    - id: father
      visible_if: "rel.mahaut_armance.respect < 3 && !flag.h_bc_vote && !flag.h_bc_learned"
      text: Go to your father in the garden.
      effects: [ { set: flag.h_k_took_seals }, { add: { counter.shadow: 3, rel.mahaut_armance.affection: -2 } } ]
      text_after: |
        He listens, and gets up, slowly, and walks to the solar on your arm, and says three words to your mother at the door that you do not hear. She gives you the seals. It is your father's last victory in that palace, and it is yours on paper, and everyone knows the difference.
      next: h_k08_marsh

- id: h_k08_marsh
  chapter: book1
  title: After the Marsh
  frames: [free]
  on_enter: [ { catch_up: { year: 61, season: winter } }, { war: none } ]
  text: |
    [if flag.h_k_bertrand_beaten]{house.querec_short} is brought to Lannec in a cart, in chains, in the first snow, and put in the room over the gatehouse where the dukes kept their prisoners. In his baggage the constable finds letters. Some are from Valdrenne. Two, in a careful neat hand, are from Penhoët.[elif flag.h_k_treated]The marsh is quiet by Christmas. The charter is read out in every church in the West. The salt carts come back on the causeways, and the toll-keepers to their bridges, and the trade of the West begins to remember itself.[else]By Christmas the companies are gone north and {house.querec_short} is gone south, and the marsh is quiet, and empty, and burned. The salt carts come back slowly. The crown has spent a year of its money on a war it did not win and did not lose.[/if]
  choices:
    - id: attaint
      visible_if: flag.h_k_bertrand_beaten
      text: Try him before the Estates for treason.
      effects: [ { set: flag.h_k_bertrand_attainted }, { add: { rep.ruthlessness: 2, counter.favour: 1 } }, { if: "!holding.querec", then: [ { hold: { id: querec, name: Quérec, income: 2400 } } ] } ]
      text_after: |
        The Estates try him in a week and attaint him in an afternoon: his life forfeit, his lands to the crown, his name struck from the roll. Whether he dies is yours to say. You commute it to exile at the last, in the yard, in front of everyone, and nobody in the West mistakes it for weakness.
      next: { pool: h_b2_late, count: 1, then: h_k10_penhoet }
    - id: mercy
      visible_if: flag.h_k_bertrand_beaten
      text: Pardon him, and keep the letters.
      effects: [ { set: flag.h_k_bertrand_pardoned }, { set: flag.h_k_letters }, { add: { rep.honor: 2, counter.household: -1 } } ]
      text_after: |
        You pardon him in the great hall, and he kneels, and you keep the letters in a box in your own chamber, unread by anyone else. A pardoned man with a box of his friends' letters in your keeping is worth more than a dead one.
      next: { pool: h_b2_late, count: 1, then: h_k10_penhoet }
    - id: on
      text: "[if flag.h_k_bertrand_beaten]Leave him to the Estates.[else]Go on.[/if]"
      effects: [ { if: flag.h_k_bertrand_beaten, then: [ { set: flag.h_k_bertrand_attainted }, { if: "!holding.querec", then: [ { hold: { id: querec, name: Quérec, income: 2400 } } ] } ] } ]
      text_after: |
        [if flag.h_k_bertrand_beaten]The Estates attaint him at Candlemas, without you, and exile him over the march. His lands come to the crown. You did not have to say a word, and the West noticed that too.[else]The winter closes over the marsh.[/if]
      next: { pool: h_b2_late, count: 1, then: h_k10_penhoet }

- id: h_k10_penhoet
  chapter: book1
  title: Penhoët's Patience
  frames: [free]
  on_enter: [ { catch_up: { year: 62, season: autumn } } ]
  text: |
    [if flag.h_k_bargain]At Michaelmas Hervé de Penhoët comes to court to do you homage again, for the Armance lands he will have one day, and does it plain, without a saving, because he has nothing left to save. Your mother is not at court. She has not been at court since the Estates wrote the custom of the Armance.[elif flag.h_k_penhoet_waits]At Michaelmas Hervé de Penhoët does not come to court. He is at home, in the Armance hills, where the Armance lords dine with him one by one, all that autumn, and go home quiet. Your mother is forty-three. Hervé is fifty-seven, and has a son, and a grandson, and is a patient house.[else]At Michaelmas Hervé de Penhoët comes to court, as he always does, and sits where his rank requires, and asks after your mother's health, as he always does, in a voice that makes the question sound like a calendar.[/if] [if flag.h_k_letters]You have two letters of his in a box in your chamber.[/if]
  choices:
    - id: attaint
      visible_if: flag.h_k_letters
      text: Put his letters before the Estates.
      check: { attr: presence, skill: intrigue, difficulty: 6, audience: nobles }
      success:
        text: |
          The letters are read out in the hall, in Hervé's careful hand, and the hall goes quiet. Hervé stands, and says that a man may write to a neighbour, and sits down, and the Estates attaint him by eleven voices. Penhoët's lands are forfeit; its claim passes to the cadet, Sir Yvon of Kerlan, who was not at the Estates and is not a patient man.
        effects: [ { set: flag.h_k_penhoet_attainted }, { add: { rival.penhoet.standing: -25, rival.penhoet.temper: -6, rep.ruthlessness: 2 } } ]
        next: h_k11_law
      failure:
        text: |
          The letters are read out in the hall, and Hervé stands and says that a man may write to a neighbour, and the Estates agree with him, by four voices. He bows to you on his way out, and says, low, "Patience, Your Grace. It's a family failing."
        effects: [ { add: { rival.penhoet.temper: -4, counter.favour: -1 } } ]
        next: h_k11_law
    - id: reconcile
      text: Reconcile with Penhoët. Offer him an honour, and a seat on the council.
      effects: [ { add: { rival.penhoet.temper: 3, rival.penhoet.standing: 3, rel.mahaut_armance.affection: -1 } }, { set: flag.h_k_penhoet_council } ]
      text_after: |
        Hervé takes the seat at the end of the council table, and the honour, and thanks you in a speech nobody can fault. He is the best councillor you have, and he is waiting for your mother to die. Both are true.
      next: h_k11_law
    - id: watch
      text: Watch him, and let him wait.
      effects: [ { set: flag.h_k_penhoet_watched } ]
      text_after: |
        Your men dine at Penhoët's table, one as a falconer, one as a priest. By Christmas you know who comes to dinner. It is a long list, and it is getting longer.
      next: h_k11_law

- id: h_k11_law
  chapter: book1
  title: The Crown's Own House
  frames: [free]
  on_enter: [ { catch_up: { year: 63, season: spring } } ]
  text: |
    At Easter the court keeps the feast at Lannec: you at the high table, [if sibling.exists]{sibling.first} at your left hand, [/if]your father in his chair with arms at the side of the dais, [if flag.h_k_handed_over]your mother beside him[else]your mother's place empty[/if].

    [if flag.h_crown_hereditary]The crown is hereditary now, and whose it is after you is a question for the crown's own law: the eldest child, son or daughter, as your father wanted, or a law of your own choosing.[elif flag.h_crown_for_life]The Estates will choose after you. But they will choose from the house, as like as not, and the house's own law will say whom they are offered first.[else]The crown's law is the eldest child. The house's own law is the house's affair.[/if]

    A ship's master from Sauvemer, who brought the wine, says between cups that there is a sickness in Sarenza this spring, in the poor quarters by the harbour. "Takes the children first," he says. "Like the Mottle, but backwards." He drinks. "Nothing to do with us."
  choices:
    - id: eldest
      text: Keep the eldest child, son or daughter.
      effects: [ { house_law: eldest } ]
      text_after: |
        The chancellor writes it in the crown's book, as your father had it. Your father, at the side of the dais, raises his cup to you and does not say anything, which is the most he has said all feast.
      next: h_m01_wedding
    - id: male_pref
      text: Sons first, then daughters.
      effects: [ { house_law: male_preference }, { add: { rival.penhoet.temper: 1 } } ]
      text_after: |
        The chancellor writes it in the crown's book. [if hero.sex == female]You have just written a law that would not have made you {house.ruler}. Your mother looks at you down the table, and goes on looking.[else]Your sisters, at the end of the table, hear it, and say nothing, and will say it later.[/if]
      next: h_m01_wedding
    - id: will
      visible_if: "family.children >= 2"
      text: Name your heir by will, whatever the law says.
      effects: [ { designate: eldest } ]
      text_after: |
        You write it yourself and seal it and give it to the bishop. If the law and the will ever disagree, the Estates will be asked to choose between them, which is the one thing you were trying to avoid.
      next: h_m01_wedding

    - {"if": "alias.spouse == fiammetta_lanzi", "then": [{"if": "flag.c3_asked_nothing", "then": [], "else": [{"add": {"res.coin": 9600}}, {"if": "counter.dowry_bonus >= 1", "then": [{"add": {"res.coin": 2400}}]}]}, {"set": "flag.noble_marriage"}, {"add": {"rep.sarenza": 2, "rep.merchants": 1, "rep.church": -1}}, {"set": "flag.c3_lanzi_kin"}]}
    - {"if": "alias.spouse == clemence_vaux", "then": [{"if": "flag.c3_asked_nothing", "then": [], "else": [{"add": {"res.coin": 4800}}, {"if": "counter.dowry_bonus >= 1", "then": [{"add": {"res.coin": 1200}}]}]}, {"set": "flag.c3_sauvemer_house"}, {"set": "flag.noble_marriage"}, {"add": {"rep.valdrenne": 2, "estate.temper": 2}}]}
    - {"if": "alias.spouse == alienor_brese", "then": [{"if": "flag.c3_asked_nothing", "then": [], "else": [{"add": {"res.coin": 2400}}, {"if": "counter.dowry_bonus >= 1", "then": [{"add": {"res.coin": 600}}]}]}, {"set": "flag.noble_marriage"}, {"add": {"rep.valdrenne": 3, "estate.temper": 1}}, {"set": "flag.c3_brese_kin"}, {"set": "flag.c3_border_peace"}]}
    - {"if": "alias.spouse == philippa_ashdown", "then": [{"if": "flag.c3_asked_nothing", "then": [], "else": [{"add": {"res.coin": 2400}}, {"if": "counter.dowry_bonus >= 1", "then": [{"add": {"res.coin": 600}}]}]}, {"set": "flag.c3_holds_ashdown"}, {"set": "flag.noble_marriage"}, {"add": {"rep.crown": 2, "rep.nobles": 1}}]}
  text: |
    [if alias.spouse == mag_coker || alias.spouse == annot_dyer || alias.spouse == mariot_wood || alias.spouse == nell_laundress]You are married at the church door on a wet [if alias.spouse == mag_coker]Ashby[elif alias.spouse == annot_dyer]Wendham[elif alias.spouse == mariot_wood]Hollin[else]Ravell[/if] morning, in front of everyone you ever knew as a boy and a good many people who have walked over from the next parish to see a lord marry a [if alias.spouse == mag_coker]Coker[elif alias.spouse == annot_dyer]dyer's girl[elif alias.spouse == mariot_wood]forester's girl[else]laundry girl[/if].

    [if alias.spouse == mag_coker]Mag wears blue, and her mother's ring, and a look that dares anyone to say a word. Nobody does.[elif alias.spouse == annot_dyer]Annot has scrubbed her hands for three days, and they are still faintly blue, and she has given up and is holding them out in front of her like a prize.[elif alias.spouse == mariot_wood]Mariot has a sprig of yew in her hair from the chase, and her father in a chair carried by four of the archers, and Kit has cried since dawn.[else]Nell laughs all the way through the vows, and the priest has to stop twice, and by the end the whole church is laughing with her, even Lady Ravell, almost.[/if]

    [break]

    "Never thought I'd see it," an old woman says, close behind you, not quietly. "The [if background == reeve]reeve's[elif background == burgess]Mercer[elif background == archer]Fletcher[else]tirewoman's[/if] boy. Look at the cloak on him."[elif alias.spouse == cecily_fuller || alias.spouse == fiammetta_lanzi][if alias.spouse == cecily_fuller]You are married in Saint Mary's, Wendham, the guild church, with the whole council in their furs and Master Osbert weeping openly into a handkerchief the size of a sail. Cecily, in green, checks the priest's Latin under her breath.[else]You are married in Sauvemer cathedral, which the bishop resents, by the bishop, who resents it more. The Lanzi house pays for everything, and makes sure the town knows it: the street is hung with cloth from the harbour to the door, and there are oranges for the children.[/if]

    [break]

    At the feast an old merchant with a gold chain leans over to you and says, "Mind her accounts, my lord. She'll mind yours." Everyone at the table laughs, except the bride, who is busy minding them already.[elif alias.spouse == isabel_sayer || alias.spouse == joan_wyck || alias.spouse == maud_delisle || alias.spouse == alys_fane || alias.spouse == philippa_ashdown][if alias.spouse == philippa_ashdown]You are married in the King's chapel at Wendmere, with the King himself at the door, which is an honour, and is meant to be seen to be one. Philippa says the words clearly, looking at the altar.[elif alias.spouse == maud_delisle]You are married in the Queen's chapel at Wendmere, quickly, before anybody can change their mind. Maud says the vows as if she were signing a treaty, and then, at the door, kisses you hard enough to knock your hat off, in front of the court.[elif alias.spouse == alys_fane]You are married at Westry, in the Earl's chapel, with three hundred guests, eleven of whom you have met. The Earl gives his daughter away with a face like a man selling a good horse for a poor price. Alys, in cloth of silver, catches your eye halfway through the Mass and nearly laughs.[elif alias.spouse == isabel_sayer]You are married at Ravell, in the chapel where you used to serve Mass, with Lady Ravell in the front pew and Father Benet officiating, pleased as a cat. Isabel's six sisters fill two benches and cry in turns.[else]You are married at Wyck, in the little church by the orchard, with the cider-press going in the yard because it is the season and Joan will not stop it for anybody. Ralph Wyck does not come.[/if]

    [break]

    At the feast an old knight you do not know leans over to you and says, "New man, eh? Married well, though. That's the way. That's how my grandfather did it." He means it kindly. You decide to take it so.[elif alias.spouse == heloise_corbie || alias.spouse == clemence_vaux || alias.spouse == alienor_brese][if alias.spouse == alienor_brese]You are married on the bridge at the Pont-aux-Moines, in the middle, with the border running under your feet: your men at one end, Brésy's at the other, both with their swords left in the carts by order. Two priests, two languages, one Mass.[elif alias.spouse == heloise_corbie]You are married at Corbie, in the chapel with the roof still half-mended, under a safe-conduct and the King's grudging licence. Raoul gives his sister away with his jaw set, and then gets drunk, and makes a speech in two languages about Les Salines that nobody understands and everyone applauds.[else]You are married in the church of Saint-Nicolas in Sauvemer, which has a cannon-ball from the siege set into its wall. Half the town comes to see it, and half of them came to jeer and stayed to drink.[/if]

    [break]

    "An Adalian," an old woman says, close behind you, in Valdrennish, not quietly. "Well. At least he's a tall one."[/if]
  choices:
    - id: feast
      text: "Feast the whole manor, whatever it costs."
      tags: ["allies", "wealth"]
      text_after: |
        You roast two oxen and broach every cask in the cellar, and the manor eats and drinks and dances for two days, and at the end of it [if flag.c2_granted_marsalin]Margot of the salt-boilers[elif flag.c2_granted_kerval]Gwenaël[else]Bastien[/if] makes a speech that nobody can hear and everybody cheers. [if estate.temper <= -1]It does not buy back everything. But it buys back something.[else]For a while afterwards people smile at you in the lane.[/if]
      effects: [{"add": {"res.coin": -720, "estate.temper": 2, "rep.commons": 1, "rel.@spouse.affection": 1}}]
      next: "c3_first_year"
    - id: church
      text: "A plain wedding, and the money to the church and the poor."
      tags: ["piety"]
      text_after: |
        You keep it plain: the vows, the Mass, a dinner for the household. The money you would have spent goes to the church roof and the plague widows. [if flag.c2_granted_marsalin]Père Yves[elif flag.c2_granted_kerval]Dom Hervé[else]Père Guérin[/if] says it is the most sensible wedding he has seen in thirty years. Some of the village say you are mean. The widows do not.
      effects: [{"add": {"res.coin": -240, "estate.church": 1, "estate.temper": 1, "rep.piety": 1}}]
      next: "c3_first_year"
    - id: hers
      text: "Let her have the wedding she wants."
      tags: ["allies"]
      text_after: |
        You let her have it her way, all of it, and it costs more than you meant and is better than you would have made it. [if alias.spouse == mag_coker || alias.spouse == nell_laundress]She wants dancing, so there is dancing, all night, and she dances with every man in the parish and then with you, last, and longest.[elif alias.spouse == cecily_fuller || alias.spouse == fiammetta_lanzi]She wants it done properly, and it is: every guest placed exactly, every gift recorded. She shows you the list afterwards, in bed, and explains who will want what in return.[else]She wants musicians from the town, and there are musicians, and she makes you dance though you cannot, and laughs at you, and does not let go of your hand.[/if]
      effects: [{"add": {"res.coin": -480, "rel.@spouse.affection": 3, "suit.@spouse.regard": 1}}]
      next: "c3_first_year"

- id: c3_first_year
  chapter: ch3
  title: "Husband and Wife"
  on_enter:
    - {"advance": {"seasons": 1}}
  text: |
    The first winter you are married, you discover that you know nothing whatever about anything.

    [if alias.spouse == mag_coker || alias.spouse == annot_dyer || alias.spouse == mariot_wood || alias.spouse == nell_laundress]She is not a lady, and the county will not let either of you forget it. The wives of the neighbouring knights do not call. When you dine at [if flag.c2_granted_kerval]the Duchess's court[else]the governor's table in Sauvemer[/if], she is seated below the salt, by accident, twice. She says nothing about it at the time. On the ride home she says, "I can milk a cow, keep a garden, salt a pig and knock a man down. I can't eat an orange with a knife. Is that what they want?"[elif alias.spouse == cecily_fuller || alias.spouse == fiammetta_lanzi]She wants the books. Not some of them: all of them. The manor's rents, the salt, the debts, the lien, your own purse. [if alias.spouse == cecily_fuller]"I married you," Cecily says, "not your steward. Your steward is a thief."[else]"In Sarenza," Fiammetta says, "a wife who does not keep the books is a wife who does not know her husband is ruined until the bailiffs come."[/if] Your steward, who has been listening at the door, goes white.[elif alias.spouse == isabel_sayer || alias.spouse == joan_wyck || alias.spouse == maud_delisle || alias.spouse == alys_fane || alias.spouse == philippa_ashdown][if alias.spouse == philippa_ashdown]She is polite to you, always. She manages the household well, and her women adore her, and at night she turns her face to the wall. It is the King's marriage, not hers, and she has not forgiven anybody for it, and you are the only one in reach.[elif alias.spouse == maud_delisle]She has her own ideas of how a lord's house is run, learned at Ravell and at court, and none of them include you deciding anything. Lisle is hers, she says, and she will run it, and she would like you to stop interfering with the reeves.[else]She knows how a gentle house is run, and yours is not one. She says so, kindly, the first week, and then less kindly the third week, when nothing has changed.[/if][elif alias.spouse == heloise_corbie || alias.spouse == clemence_vaux || alias.spouse == alienor_brese]Your Adalians do not trust her. [if npc.hodge_brewster.met]Hodge Brewster's settlers call her "the Valdrennish woman" in the alehouse, and worse in the fields.[else]Your own men call her "madame" to her face and other things behind it.[/if] The village loves her, which makes it worse. When there is a quarrel between an Adalian and a local, she takes the local's side every time, in front of everybody, and you have to decide whether to back her.[/if]

    [break]

    It comes to a head at Candlemas, in the hall, in front of the household, the way these things always do.
  choices:
    - id: keys
      text: "Give her the keys and the books, and let her run the house."
      tags: ["allies", "wealth"]
      text_after: |
        You give her the keys. All of them. The household watches you do it, and then watches her, and within a week the hall is swept, the steward is accounting for every penny and sweating, [if alias.spouse == alienor_brese || alias.spouse == heloise_corbie || alias.spouse == clemence_vaux]and the village comes to the hall with its quarrels instead of to the priest[else]and the dogs are off the table[/if]. You find you have time to think. You find you do not much like what you think about, which is that you should have done it sooner.
      effects: [{"set": "flag.c3_wife_keys"}, {"add": {"rel.@spouse.affection": 2, "rel.@spouse.respect": 2, "estate.food": 1, "estate.temper": 1}}]
      next: "c3_lying_in"
    - id: stand
      text: "Stand with her in public, whatever it costs you with the neighbours."
      tags: ["allies"]
      text_after: |
        You stand with her. [if alias.spouse == mag_coker || alias.spouse == annot_dyer || alias.spouse == mariot_wood || alias.spouse == nell_laundress]The next time she is seated below the salt, you get up and go and sit beside her, and the governor's whole table watches you do it. You are not asked back. You find you do not care.[elif alias.spouse == alienor_brese || alias.spouse == heloise_corbie || alias.spouse == clemence_vaux]The next time she takes a local's side against one of your Adalians, you back her, in front of everyone, and the Adalian is fined. Your own men are slow to forgive it. The village is not.[else]You take her part in front of the household, plainly, and anybody who has a quarrel with her has a quarrel with you. Nobody has a quarrel with her after that, or not out loud.[/if]
      effects: [{"set": "flag.c3_stood_by_wife"}, {"add": {"rel.@spouse.affection": 3, "rel.@spouse.respect": 1}}, {"if": {"any": ["alias.spouse == mag_coker", "alias.spouse == annot_dyer", "alias.spouse == mariot_wood", "alias.spouse == nell_laundress"]}, "then": [{"add": {"rep.nobles": -1, "rep.commons": 1}}]}, {"if": {"any": ["alias.spouse == heloise_corbie", "alias.spouse == clemence_vaux", "alias.spouse == alienor_brese"]}, "then": [{"add": {"estate.temper": 1, "rep.valdrenne": 1}}]}]
      next: "c3_lying_in"
    - id: own
      text: "It is your manor. Keep your own counsel."
      tags: ["cunning"]
      text_after: |
        You tell her, kindly, in private, that the manor is yours and you will run it. She hears you out. She says, "Yes, my lord," in a voice you have never heard her use, and goes out. You win. It is the loneliest winter of your life, and the household, which knows everything, walks round the two of you on tiptoe until spring.
      effects: [{"set": "flag.c3_kept_counsel"}, {"add": {"rel.@spouse.affection": -2, "rel.@spouse.respect": -1}}]
      next: "c3_lying_in"

- id: c3_lying_in
  chapter: ch3
  title: "Lying-In"
  on_enter:
    - {"advance": {"seasons": 1}}
  text: |
    [if flag.c3_kept_counsel]In the spring, things thaw a little, as things do.[else]In the spring she takes your hand in the orchard[if flag.c2_granted_kerval][else], such as it is,[/if] and puts it on her belly, and waits for you to understand.[/if] She is with child. The baby will come at harvest, she thinks, or a little after.

    [break]

    The manor is delighted. Old women stop her in the lane to feel her belly and tell her it is a boy, from the way she carries, or a girl, from the way she walks. [if flag.c2_granted_marsalin]Margot[elif flag.c2_granted_kerval]Gwenaël's wife[else]Bastien's sister[/if] brings an eagle-stone to tie to her arm. The priest says a Mass.

    You are not delighted. You are frightened, all the time, in a way the war never managed. [if flag.c3_sat_with_man || flag.c3_nursed]You have seen what fever does in a closed room.[/if] Everybody knows a woman who died in childbed. Everybody knows several. [if alias.master == hamon_darrell]Sir Hamon's Alice did, eleven years before you knew him, and [if npc.hamon_darrell.alive]he still talks to her at night[else]he talked to her at night until the day he died[/if].[/if]

    [break]

    There are choices to make about who will be in the room, and you, being a man, will not be.
  choices:
    - id: physician
      text: "Send to Sauvemer for the Sarenzan physician, the best money can buy."
      tags: ["wealth", "learning"]
      requires: ["res.coin >= 480"]
      text_after: |
        Maestro Orsini comes up from Sauvemer with two boys carrying his books and a box of instruments that the midwife looks at as if they were snakes. He casts her horoscope, and bleeds her twice for balance, and is confident of everything. Your wife does not like him. Neither do the women. They do as he says anyway, because he cost two pounds.
      effects: [{"set": "flag.c3_birth_physician"}, {"add": {"res.coin": -480}}]
      next: "c3_childbed"
    - id: midwife
      text: "Get the best midwife in the country, and let her do as she thinks fit."
      tags: ["allies"]
      text_after: |
        [if flag.c2_granted_marsalin]Old Mère Fanchon from the salt-town[elif flag.c2_granted_kerval]Mère Soizic from the abbey village, who has delivered half the Armance[else]The midwife from Saint-Aubin across the marsh, a little bent woman with enormous hands[/if] comes to the manor in the last month and moves into the solar, and from that moment it is her house, not yours. She sends you out of every room you go into. She has delivered, she says, more babies than you have killed men, and lost fewer.
      effects: [{"set": "flag.c3_birth_midwife"}, {"add": {"estate.temper": 1}}]
      next: "c3_childbed"
    - id: relic
      text: "Borrow the girdle of Saint Margaret from the abbey, and trust to God."
      tags: ["piety"]
      text_after: |
        The abbey lends you the girdle of Saint Margaret, which is a strip of old red silk, brown at the edges, in a silver case and has been tied round the bellies of half the gentlewomen in the country. It costs a donation. [if flag.c2_granted_marsalin]Père Yves[elif flag.c2_granted_kerval]Dom Hervé[else]Père Guérin[/if] carries it up from the abbey himself, in procession, with candles. Whether it does anything, nobody can say. Your wife holds it in both hands every night, and sleeps better.
      effects: [{"set": "flag.c3_birth_relic"}, {"add": {"res.coin": -120, "rep.piety": 1, "rep.church": 1}}]
      next: "c3_childbed"

- id: c3_childbed
  chapter: ch3
  title: "Childbed"
  on_enter:
    - {"advance": {"seasons": 2}}
    - {"birth": "random"}
    - {"if": "flag.c3_birth_physician", "then": [{"chance": 5, "then": [{"set": "flag.c3_wife_died_childbed"}]}], "else": [{"if": "flag.c3_birth_relic", "then": [{"chance": 3, "then": [{"set": "flag.c3_wife_died_childbed"}]}], "else": [{"chance": 2, "then": [{"set": "flag.c3_wife_died_childbed"}]}]}]}
    - {"if": "flag.c3_wife_died_childbed", "then": [{"kill": "@spouse"}]}
  text: |
    It starts in the night, the way they always do, and they send you out.

    You stand in the yard. Then you walk up and down the yard. Then you sit on the mounting-block, and get up, and walk up and down again. [if npc.davy_ludd.alive]Davy brings you a cup of something and stands with you, and does not try to talk.[elif retinue >= 1]One of your men brings you a cup of something and stands with you, and does not try to talk.[else]Nobody comes. It is the middle of the night.[/if] From the solar there are sounds you have heard before, on battlefields, and did not expect to hear in your own house.

    [break]

    It goes on all night, and into the morning, and past noon. [if flag.c3_birth_physician]Twice Maestro Orsini comes down for more hot water and a different powder, looking less confident each time.[elif flag.c3_birth_midwife]Once the midwife comes to the door and looks out at you, and shakes her head, not at the baby, at you, and goes back in.[else]Twice they send down for the priest, and twice they send him away again.[/if]

    And then, in the middle of the afternoon, a thin furious wail, and the women laughing.

    [break]

    [if flag.c3_wife_died_childbed]The baby lives. A [if heirs.last == son]boy[else]girl[/if], red, angry, perfect.

    {npc.@spouse.first} does not. The bleeding will not stop. The women do everything that can be done, and it is not enough, and by the time they let you in she knows it. She is white as linen, and calm. She says your name, and something about the baby, and something else you do not catch, and then nothing, and you are holding her hand and it is only a hand.

    They bury her in the chancel. The whole manor comes. You do not remember any of it except the sound of the baby crying, somewhere at the back of the church, all the way through the Mass.[else]A [if heirs.last == son]boy[else]girl[/if]. Red, furious, perfect, with a fist like a walnut. They put it in your arms, and you hold it the way you would hold a hawk, or a lit fuse, and everyone laughs at you, and {npc.@spouse.first}, white and wrecked and grinning in the bed, laughs hardest of all.

    "Well," she says. "Go on, then. Give it a name."[/if]
  choices:
    - id: son_father
      text: "[if background == reeve]Piers[elif background == burgess]Ralf[else]Hugh[/if], for your father."
      tags: ["allies"]
      visible_if: ["heirs.last == son", "background != servant"]
      text_after: |
        [if flag.c3_wife_died_childbed]The priest writes it in the book, under her name, on the same page.[else]{heirs.lastname}, the priest writes in the book, and the date, and your name, and hers. The manor drinks the child's health for three days, and [if flag.c2_granted_marsalin]Margot[elif flag.c2_granted_kerval]Gwenaël[else]Bastien[/if] makes another speech.[/if]
      effects: [{"if": "background == reeve", "then": [{"name_heir": "Piers"}]}, {"if": "background == burgess", "then": [{"name_heir": "Ralf"}]}, {"if": "background == archer", "then": [{"name_heir": "Hugh"}]}]
      next: "c3_match_end"
    - id: son_self
      text: "{name}, for yourself."
      tags: ["cunning"]
      visible_if: ["heirs.last == son"]
      text_after: |
        [if flag.c3_wife_died_childbed]The priest writes it in the book, under her name, on the same page.[else]{heirs.lastname}, the priest writes in the book, and the date, and your name, and hers. The manor drinks the child's health for three days, and [if flag.c2_granted_marsalin]Margot[elif flag.c2_granted_kerval]Gwenaël[else]Bastien[/if] makes another speech.[/if]
      effects: [{"name_heir": "@self"}]
      next: "c3_match_end"
    - id: son_master
      text: "[if alias.master == hamon_darrell]Hamon[elif alias.master == ancel_brome]Ancel[elif alias.master == walter_pryce]Walter[else]Thurstan[/if], for your old master."
      tags: ["allies"]
      visible_if: ["heirs.last == son"]
      text_after: |
        [if flag.c3_wife_died_childbed]The priest writes it in the book, under her name, on the same page.[else]{heirs.lastname}, the priest writes in the book, and the date, and your name, and hers. The manor drinks the child's health for three days, and [if flag.c2_granted_marsalin]Margot[elif flag.c2_granted_kerval]Gwenaël[else]Bastien[/if] makes another speech.[/if]
      effects: [{"if": "alias.master == hamon_darrell", "then": [{"name_heir": "Hamon"}]}, {"if": "alias.master == ancel_brome", "then": [{"name_heir": "Ancel"}]}, {"if": "alias.master == walter_pryce", "then": [{"name_heir": "Walter"}]}, {"if": "alias.master == thurstan_ravell", "then": [{"name_heir": "Thurstan"}]}]
      next: "c3_match_end"
    - id: son_king
      text: "Aldred, for the King."
      tags: ["diplomacy"]
      visible_if: ["heirs.last == son"]
      text_after: |
        [if flag.c3_wife_died_childbed]The priest writes it in the book, under her name, on the same page.[else]{heirs.lastname}, the priest writes in the book, and the date, and your name, and hers. The manor drinks the child's health for three days, and [if flag.c2_granted_marsalin]Margot[elif flag.c2_granted_kerval]Gwenaël[else]Bastien[/if] makes another speech.[/if]
      effects: [{"name_heir": "Aldred"}, {"add": {"rep.crown": 1}}]
      next: "c3_match_end"
    - id: dau_mother
      text: "[if background == reeve]Edith[elif background == burgess]Margery[elif background == archer]Alison[else]Agnes[/if], for your mother."
      tags: ["allies"]
      visible_if: ["heirs.last == daughter"]
      text_after: |
        [if flag.c3_wife_died_childbed]The priest writes it in the book, under her name, on the same page.[else]{heirs.lastname}, the priest writes in the book, and the date, and your name, and hers. The manor drinks the child's health for three days, and [if flag.c2_granted_marsalin]Margot[elif flag.c2_granted_kerval]Gwenaël[else]Bastien[/if] makes another speech.[/if]
      effects: [{"if": "background == reeve", "then": [{"name_heir": "Edith"}]}, {"if": "background == burgess", "then": [{"name_heir": "Margery"}]}, {"if": "background == archer", "then": [{"name_heir": "Alison"}]}, {"if": "background == servant", "then": [{"name_heir": "Agnes"}]}]
      next: "c3_match_end"
    - id: dau_wife
      text: "For her mother."
      tags: ["allies"]
      visible_if: ["heirs.last == daughter"]
      text_after: |
        [if flag.c3_wife_died_childbed]The priest writes it in the book, under her name, on the same page.[else]{heirs.lastname}, the priest writes in the book, and the date, and your name, and hers. The manor drinks the child's health for three days, and [if flag.c2_granted_marsalin]Margot[elif flag.c2_granted_kerval]Gwenaël[else]Bastien[/if] makes another speech.[/if]
      effects: [{"if": "alias.spouse == mag_coker", "then": [{"name_heir": "Margaret"}]}, {"if": "alias.spouse == annot_dyer", "then": [{"name_heir": "Annot"}]}, {"if": "alias.spouse == mariot_wood", "then": [{"name_heir": "Mariot"}]}, {"if": "alias.spouse == nell_laundress", "then": [{"name_heir": "Eleanor"}]}, {"if": "alias.spouse == isabel_sayer", "then": [{"name_heir": "Isabel"}]}, {"if": "alias.spouse == maud_delisle", "then": [{"name_heir": "Maud"}]}, {"if": "alias.spouse == cecily_fuller", "then": [{"name_heir": "Cecily"}]}, {"if": "alias.spouse == joan_wyck", "then": [{"name_heir": "Joan"}]}, {"if": "alias.spouse == alys_fane", "then": [{"name_heir": "Alys"}]}, {"if": "alias.spouse == heloise_corbie", "then": [{"name_heir": "Héloïse"}]}, {"if": "alias.spouse == fiammetta_lanzi", "then": [{"name_heir": "Fiammetta"}]}, {"if": "alias.spouse == clemence_vaux", "then": [{"name_heir": "Clémence"}]}, {"if": "alias.spouse == alienor_brese", "then": [{"name_heir": "Aliénor"}]}, {"if": "alias.spouse == philippa_ashdown", "then": [{"name_heir": "Philippa"}]}, {"add": {"rel.@spouse.affection": 1}}]
      next: "c3_match_end"
    - id: saint
      text: "[if flag.c3_wife_died_childbed]Let the priest choose a saint's name.[else]Let her choose.[/if]"
      tags: ["piety"]
      text_after: |
        [if flag.c3_wife_died_childbed]The priest chooses {heirs.lastname}, for the saint, and you nod, because you cannot speak.[else]She does not even have to think. "{heirs.lastname}," she says, "for the saint who brought us through." Then she goes to sleep, in the middle of the word.[/if]
      effects: [{"if": "heirs.last == son", "then": [{"name_heir": "John"}], "else": [{"name_heir": "Margaret"}]}, {"add": {"rep.piety": 1}}]
      next: "c3_match_end"
    - id: dau_queen
      text: "Ysolde, for the Queen Mother."
      tags: ["diplomacy"]
      visible_if: ["heirs.last == daughter"]
      text_after: |
        [if flag.c3_wife_died_childbed]The priest writes it in the book, under her name, on the same page.[else]{heirs.lastname}, the priest writes in the book, and the date, and your name, and hers. The manor drinks the child's health for three days, and [if flag.c2_granted_marsalin]Margot[elif flag.c2_granted_kerval]Gwenaël[else]Bastien[/if] makes another speech.[/if]
      effects: [{"name_heir": "Ysolde"}, {"add": {"rep.crown": 1}}]
      next: "c3_match_end"

- id: c3_unwed
  chapter: ch3
  title: "No Wife Yet"
  on_enter:
    - {"advance": {"seasons": 1}}
  text: |
    You write the letters you have to write, and put the rest in the fire.

    [if suit.philippa_ashdown.status == available]The letter to the King is the hardest. You thank him for his great kindness and plead the manor, the border, the plague, your unworthiness. It is a good letter. Father Benet would have been proud of it. The King, you hear, reads it, and says nothing, and gives Lady Philippa to somebody else within the month, and does not forget.[/if] [if suit.alienor_brese.status == available]Sire Gautier's chaplain goes back across the border with a polite refusal, and next spring the Brésy men cut the hay at the Pont-aux-Moines again, and burn the barn when your people object.[/if]

    The manor does not understand. [if flag.c2_granted_marsalin]Margot[elif flag.c2_granted_kerval]Gwenaël[else]Bastien[/if] says so, to your face, in the lane. The priest says so, more politely, from the pulpit. You are a young lord with land and no heir, and every year that goes by without one is a year the manor lives on borrowed time.
  choices:
    - id: go_on
      text: "There is time yet."
      tags: ["yield"]
      text_after: |
        Perhaps. Other men have married at forty. Other men have died at thirty with nobody to come after them. You know which list is longer.
      effects: [{"set": "flag.c3_stayed_unwed"}, {"add": {"estate.temper": -1}}, {"if": "suit.philippa_ashdown.status == available", "then": [{"add": {"rep.crown": -2}}, {"set": "flag.c3_refused_king_ward"}]}, {"if": "suit.alienor_brese.status == available", "then": [{"add": {"rep.valdrenne": -1}}, {"set": "flag.c3_refused_brese"}]}]
      next: "c3_match_end"

- id: c3_match_end
  chapter: ch3
  title: "The Harvest of Year Thirty"
  text: |
    [if flag.c3_married && npc.@spouse.alive]The harvest is in. The baby sleeps in a basket by the hall fire, and the dogs, who have been put off the table, lie round it like a guard.[elif flag.c3_married]The harvest is in. The baby sleeps in a basket by the hall fire, and a wet-nurse from the village sits beside it, and you sit up late, most nights, not reading the accounts.[else]The harvest is in. The hall is quiet. The dogs are on the table again.[/if]
  choices:
    - id: on
      text: Go on.
      next: { switch: [ { if: [ flag.c2_lanzi_against_land, "!flag.c3_lanzi_kin" ], go: c3_paper } ], default: c3_rising_news }

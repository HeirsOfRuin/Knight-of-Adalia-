    - id: king
      text: "Ask for the King's word."
      tags: ["cunning"]
      visible_if: [{"any": ["alias.spouse == maud_delisle", "alias.spouse == alys_fane", "alias.spouse == heloise_corbie", "alias.spouse == clemence_vaux"]}]
      requires: ["rep.crown >= 3"]
      label: "Requires: the King's favour"
      text_after: |
        You go to the King. It is the kind of thing a man can do perhaps twice in his life, and you spend one of them now. Aldred hears you out at the end of a long day, and laughs, and says, "God's teeth. All right. But you'll owe me." The word goes out, and doors that were locked stand open.
      effects: [{"add": {"rep.crown": -2, "suit.@spouse.family": 1}}, {"set": "flag.c3_owes_king_marriage"}]
      next: "c3_contract"
    - id: herself
      text: "Let her settle it herself."
      tags: ["allies"]
      visible_if: [{"not": {"any": ["alias.spouse == alienor_brese", "alias.spouse == philippa_ashdown"]}}]
      requires: ["suit.@spouse.regard >= 7"]
      label: "Requires: that she wants you as much as you want her"
      text_after: |
        [if alias.spouse == mag_coker]Mag settles it. She tells her mother, the uncles and the whole of Ashby where to put their opinions, at the well, at the top of her voice, and then she goes in and packs.[elif alias.spouse == maud_delisle]Maud settles it. She tells the clerk of the wardrobe, in front of witnesses, that she will marry you or nobody, and that if the Crown sells her elsewhere she will say so at the church door. The clerk goes pale. The price comes down.[elif alias.spouse == alys_fane]Alys settles it. She tells her father she will marry you or take the veil, and her father, who has met her, believes her.[else]She settles it. Her people do not like it, and they say so, and she does it anyway. You find you are a little afraid of her, and you like it.[/if] Her family will remember. They will not forgive it quickly.
      effects: [{"set": "flag.c3_married_against_kin"}, {"add": {"suit.@spouse.family": -3, "suit.@spouse.regard": 1}}]
      next: "c3_contract"

- id: c3_contract
  chapter: ch3
  title: "The Contract"
  text: |
    [if alias.spouse == mag_coker || alias.spouse == annot_dyer || alias.spouse == mariot_wood || alias.spouse == nell_laundress]There is not much to put in a contract. [if alias.spouse == mag_coker]The Cokers have a cow, a bed, a chest of linen and a grudge.[elif alias.spouse == annot_dyer]The Dyers have a few pounds put by, a dye-vat's worth of credit, and opinions.[elif alias.spouse == mariot_wood]The Woods have nothing at all but the forester's bow and Mariot.[else]Nell has a box with two shifts, a comb and a little pewter cross, and that is everything.[/if] But [if flag.c2_granted_marsalin]Père Yves[elif flag.c2_granted_kerval]Dom Hervé[else]Père Guérin[/if] says it must be written down properly anyway, what she brings and what you settle on her if you die. "Lords die," he says, "and widows starve. Write it down."[elif alias.spouse == cecily_fuller || alias.spouse == fiammetta_lanzi]The contract is the longest document you have ever seen that was not a treaty. [if alias.spouse == cecily_fuller]Master Osbert has had it drawn up by a Wendham attorney, with Cecily's notes in the margin in a smaller, sharper hand: forty pounds in coin, the Fuller interest in two ships, and a clause about who keeps the books that is underlined twice.[else]The Lanzi notary has drawn it in Sarenzan and Adalian side by side: forty pounds in coin, the house in Sauvemer, and a clause about the lien on your manor's rents that you have to read three times before you see what it does.[/if] There is a space at the bottom for what you settle on her in return.[elif alias.spouse == isabel_sayer || alias.spouse == joan_wyck][if alias.spouse == isabel_sayer]Sir John Sayer can find five pounds, a horse, and his blessing, and he is ashamed that it is not more. Isabel is ashamed that he is ashamed.[else]Joan brings Wyck. Not the title, which is the Crown's to grant, but the keeping of it while she lives, and its rents, and its orchards, and its quarrels. Ralph's lawyer reads every line of the contract twice.[/if] There is the question of what you settle on her in return.[elif alias.spouse == maud_delisle || alias.spouse == alys_fane || alias.spouse == philippa_ashdown][if alias.spouse == maud_delisle]Maud brings Lisle: a manor and a half in the west of Adalia, with a castle that leaks and a lawsuit that has been running since her grandfather's time.[elif alias.spouse == alys_fane]The Earl of Westry's daughter brings sixty pounds in coin, a household of nine, and the house of Westry at your back, which is worth a great deal more, and costs a great deal more, than sixty pounds.[else]Philippa brings Ashdown: three manors in the south of Adalia, half-empty since the Mottle, and the King's goodwill, which you will be expected to earn.[/if] Her people want a jointure settled on her, and they want it generous.[elif alias.spouse == heloise_corbie || alias.spouse == clemence_vaux || alias.spouse == alienor_brese][if alias.spouse == heloise_corbie]Héloïse brings a vineyard on the Corbie hills and her name, and her brother gives both with a face like a man having a tooth drawn.[elif alias.spouse == clemence_vaux]Clémence brings her dower: the house in the Rue des Saulniers, a share of the Sauvemer customs, and twenty pounds she has kept back from everybody, including her late husband.[else]Aliénor brings ten pounds, a household of Valdrennish servants who look at your hall as if it had fleas, and peace on the border. The peace is the dowry. Everyone at the table knows it.[/if] The contract is drawn in both tongues, and the Valdrennish version is longer.[/if]
  choices:
    - id: bargain
      text: "Drive a hard bargain."
      tags: ["wealth"]
      check: {"attr": "wits", "skill": "trade", "difficulty": 3}
      success:
        text: |
          You haggle like your life depends on it, and come away with more than anyone expected, including you. [if alias.spouse == cecily_fuller]Cecily says, afterwards, that it was the most romantic afternoon of her life.[else]{npc.@spouse} watches you do it, and you cannot tell what she thinks of it.[/if]
        effects: [{"set": "flag.c3_hard_bargain"}, {"add": {"counter.dowry_bonus": 1}}]
        next: "c3_wedding"
      failure:
        text: |
          You haggle, and they haggle back, and somewhere in the middle of it you say a thing about her family's means that cannot be unsaid. The contract is signed. Nobody at the table enjoys it.
        effects: [{"add": {"suit.@spouse.family": -2, "suit.@spouse.regard": -1}}]
        next: "c3_wedding"
    - id: fair
      text: "Settle it fairly, as her people ask."
      tags: ["diplomacy"]
      text_after: |
        You settle a fair jointure on her, a third of the manor's rents if you die, which is the custom. Her people are satisfied. [if flag.c2_granted_marsalin]Père Yves[elif flag.c2_granted_kerval]Dom Hervé[else]Père Guérin[/if] writes it out in his best hand, and blots it, and says, "There. Now die whenever you like."
      effects: [{"add": {"suit.@spouse.family": 1}}]
      next: "c3_wedding"
    - id: nothing
      text: "Ask for nothing but her."
      tags: ["allies", "piety"]
      text_after: |
        You tell them to keep it. [if alias.spouse == mag_coker || alias.spouse == mariot_wood || alias.spouse == nell_laundress]There is nothing to keep, as it happens, and everybody laughs, and that is a good start to anything.[else]They look at you as if you had taken leave of your wits, and then, slowly, as if you had done something they will be telling their grandchildren about.[/if] [if alias.spouse == maud_delisle || alias.spouse == joan_wyck || alias.spouse == philippa_ashdown]The land comes with her anyway: it is hers, not theirs to give. But the coin stays with her people, and they do not forget it.[/if]
      effects: [{"set": "flag.c3_asked_nothing"}, {"add": {"suit.@spouse.regard": 2, "suit.@spouse.family": 2, "rep.honor": 1}}]
      next: "c3_wedding"


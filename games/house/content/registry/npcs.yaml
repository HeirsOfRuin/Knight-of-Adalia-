# Great figures carried over from Knight of Adalia (canon.md). Provisional.
mahaut_armance: { name: Mahaut of Armance, title: Duchess, faction: west, notes: "Jehanne's granddaughter. Queen of the West, Duchess, or a claimant, by frame." }
thibaut_brese: { name: Thibaut de Brésy, title: Messire, faction: west, notes: "The Constable's son. King of the West in one free frame." }
king_edwin: { name: Edwin, title: King, faction: adalia, notes: "King of Adalia from year 39." }
king_amaury: { name: Amaury, title: King, faction: valdrenne, notes: "Amaury VII of Valdrenne, nineteen at the War of the West." }
yann_penhoet: { name: Yann de Penhoët, title: Sire, faction: west, notes: "Old Penhoët: head of the house, about seventy and dying in year 50. Says Kerval was his grandfather's. Dies at Lady Day, year 51." }
herve_penhoet: { name: Hervé de Penhoët, title: Sire, faction: west, notes: "Yann's son and heir, about forty-five. Careful, patient, never forgets a field. The rival of the Prologue and Book I." }

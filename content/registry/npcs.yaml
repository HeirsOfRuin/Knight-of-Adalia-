gervase_holt: { name: Gervase Holt, title: Master, notes: "Steward of Ashby, for Sir Hamon Darrell." }
wat_coker: { name: Wat Coker, notes: "Rival. His family's holding was seized under Piers's enforcement.", tags: [rival] }
# Burgess's son

# Prologue, scene 1: one opening per background. Age 8, spring of year 9.
# Each sets a family relationship, a skill lean and a hidden-flag consequence.

- id: p_reeve_open
  chapter: prologue
  title: Lady Day Reckoning
  checkpoint: true
  text: |
    You are eight years old, and you have been awake since before the cock, because today the steward comes.

    Your mother has had you scrubbed at the trough with a handful of ash, ears and all, and dressed you in your brother's old tunic, the blue one, which was your brother's until the winter fever took him at four and has been waiting in the chest for you to grow into it. It is still too long in the sleeve. She turns the cuffs back twice, looks at you, turns them back again, and says you will do. Your sisters, Cis and Avice, are under orders to stay in the house and not be seen. They are at the shutter now, watching the lane.

    Ashby is thirty-one households, a church, a mill, and a manor house with a hall so cold that Sir Hamon Darrell, who holds it, spends Christmas at Ravell instead. The land belongs to Sir Hamon. The running of it belongs, as far as anyone in Ashby is concerned, to your father. Piers the reeve. He was chosen by the village at Michaelmas eleven years ago and confirmed by the lord, and he has been chosen every year since, which no reeve in living memory has managed, because a reeve is the man who takes the lord's due from his neighbours, and neighbours remember.

    Your father keeps the account on hazel tallies. You have watched him cut them all winter by the fire: one notch for a quarter of grain, a thin one for a bushel, the stick split down its length when the grain goes into the barn, so that he keeps one half and the barn keeps the other, and nobody can add a notch to one without the halves disagreeing. He showed you how when you were six. You took to it the way some boys take to stones and slings. Numbers stay where you put them. People do not.

    Lady Day. The winter stores are counted, and the steward will not sit down to eat until they are.

    Master Gervase Holt rides in at Terce on a grey cob, with a clerk on a mule behind him. He is a thin man in a good brown gown with a fur collar gone bald at the neck, and he has a cough that he carries about with him like a dog. He does not get down from the cob until your father has come out to hold its head. He looks at you over your father's shoulder.

    "This is the boy?"

    "My son, Master Gervase. The one who reckons."

    "We shall see," says the steward, and coughs.

    In the tithe barn the air is cold and sweet with old straw. The clerk, a young man called Walter who sniffs constantly and wipes his nose on his wrist, sets up a trestle and a stool and unrolls the steward's roll. It is written in the clerks' tongue, which you cannot read yet, with the numbers in the old letters that your father taught you on the hearthstone with a burnt stick. Your father lays out his halves of the tallies, notch side up, in rows: barley, oats, beans and peas, maslin. You stand at his elbow, as you have been told, and say nothing.

    They read the barley. It agrees. They read the beans. They agree. They read the oats.

    "Oats, into the grange at Michaelmas," says the clerk, through his nose. "Forty quarters."

    The steward nods and looks at the roof.

    You count the sticks under your breath, the way you always do, without meaning to. [if flag.father_skims]Forty. They say forty. But you sat by the fire in Advent while your father split two oat tallies and fed one half of each into the flames, and cut two new ones, a little shorter, and you saw his face while he did it, which was the face of a man counting coin in a bad market. Before Advent, the oat sticks said forty-two.[else]Forty-two. The sticks say forty-two. You count again. Forty-two quarters went into the barn, and the roll says forty, and Master Gervase is looking at the roof, and the two missing quarters are worth, at this year's price, more than your father is paid in a year.[/if]

    Your father does not look at you. His hands are flat on the trestle and do not move. He knows you can count. He taught you.
  choices:
    - id: speak
      text: Say what you counted, out loud, in front of the clerk.
      tags: [learning]
      text_after: |
        "Forty-two," you say. Your voice comes out higher than you meant. "The oats. There were forty-two."

        Everything in the barn stops. Walter the clerk stops sniffing.

        [if flag.father_skims]Master Gervase looks at you for the first time as if you were a person rather than a piece of your father's furniture. Then he has the woodpile searched. It takes the reeve's own men half an hour, standing in the cold, to find the charred end of a split oat tally that did not quite burn. Nobody says anything to your father in the barn. Nobody needs to.

        At the manor court on Saint Mark's day he is fined four shillings for false account, which is a great deal, and is not chosen to carry the lord's candle at Easter, which is worse. He does not beat you. He has never beaten you. He stops speaking to you, which is worse than any beating, and it lasts until Whitsun, and when it ends it does not end properly. Your mother tells you that you did right. She tells you in a whisper, in the dairy, where he cannot hear.

        Master Gervase, leaving, pats your head and says that honest boys are rare and valuable and that he will remember your name.[else]Master Gervase stops looking at the roof. For a long moment he looks at you, and then he laughs, a short dry laugh that turns into his cough. "Sharp eyes," he says. "Walter, you have miscopied. Again." Walter goes red to the ears and alters the roll.

        Nobody says anything else about it in the barn. On the ride home the steward asks your father, quietly, whether the boy spends much time around the accounts. Your father says no. That night your father sits up late with the tallies, counting them again, all of them, and you lie awake listening to the click of the sticks. In the morning he says, "Next time, tell me first." It is the closest he comes to saying that you have made an enemy, and that the enemy is not the clerk.[/if]
      effects:
        - set: flag.p_spoke_up
        - if: flag.father_skims
          then: [ { add: { rel.piers_reeve.affection: -3, rel.gervase_holt.respect: 2, rep.honor: 2 } } ]
          else: [ { add: { rel.gervase_holt.respect: 1, rel.gervase_holt.affection: -2, rep.honor: 1 } } ]
      next: p_hungry_year
    - id: quiet
      text: Keep your mouth shut and tell your father afterwards.
      tags: [allies]
      text_after: |
        You say nothing. The reckoning goes on. The steward eats your mother's best hen and drinks the ale she has been saving since Candlemas and rides away before Vespers, coughing.

        That night, when your sisters are asleep, your father sits you on the bench by the fire, where the light is, and asks you what you saw in the barn. Not whether you saw anything. What.

        You tell him.

        He nods. He keeps nodding for a long time, looking at the fire, the way he does when the weather is turning.

        [if flag.father_skims]"Two quarters," he says at last. "Two quarters, in a winter when the Cokers were put out. A man has to eat, boy. So does his son. So do his daughters." He gets up, goes to the chest, and comes back with a silver penny, which he puts in your hand and closes your fingers over. You have never held a whole penny before. You understand exactly what it is for. You keep it for a year before you can bring yourself to spend it.[else]"Two quarters," he says at last. "And the roll says forty, and Gervase Holt has signed the roll." He is quiet a while. "Then we both know, you and I. And the steward knows we know, or he will soon, because he is not a fool, whatever else he is." He puts his hand on your head, which he does not often do. "Keep that close. Close as your shirt. A thing like that is worth more kept than spent."[/if]
      effects:
        - set: flag.p_kept_quiet
        - add: { rel.piers_reeve.affection: 2, rel.piers_reeve.respect: 1 }
        - if: flag.father_skims
          then: [ { add: { res.coin: 1, rep.ruthlessness: 1 } } ]
      next: p_hungry_year
    - id: copy
      text: Say nothing. Copy the tallies onto Father Anselm's scrap of parchment that night.
      tags: [cunning, learning]
      text_after: |
        You say nothing in the barn. But the numbers will not leave you alone, and that night you go to Father Anselm.

        The priest of Ashby is a big soft man with a farmer's hands, the son of a smallholder from over the hill, who reads the gospel badly and the weather very well. He keeps bees behind the church, teaches letters to any boy who will bring him firewood, and has a habit of humming the psalms when he thinks no one is listening. He has a box of parchment scraps, cut from the margins of old service books, that he uses for his own sums.

        "A page of figures," he says, when you ask. "At this hour. For a boy of eight." He gives you one anyway, and an ink-horn, and a candle-end, and goes back to his bees.

        It takes you three candle-ends and you burn your thumb on the last. You copy every tally: barley, oats, beans and peas, maslin, each in your father's way of reckoning, with the notches drawn as little strokes. At the bottom you write the date as Father Anselm has shown you, the feast and the year of the King, so that anyone reading it will know when it was made.

        You do not know yet why you are doing it. You only know that the numbers in the barn and the numbers on the roll were not the same, and that tomorrow the sticks may be different, and that the parchment will not.

        Father Anselm reads it over your shoulder when you are done. He does not ask any questions. He folds it twice and tucks it inside the back board of his psalter, between the leather and the wood. "It will keep there," he says. "Nobody reads my psalter but me, and I only read it on Sundays."
      effects:
        - set: flag.p_kept_copy
        - item: +tally_copy
        - add: { skill.learning: 1, rel.father_anselm.affection: 1 }
        - meet: father_anselm
      next: p_hungry_year

- id: p_burgess_open
  chapter: prologue
  title: The Counting-House
  checkpoint: true
  text: |
    Wendham, the week after Easter. Fleeces stacked to the rafters, and the whole house smelling of grease and wet wool.

    A Sarenzan in a black gown comes to your father's counting-house with a clerk and a locked box. Master {npc.bertuccio_lanzi}. He bows to your mother as if she were a countess, and your father sends you out of the room before the door is shut.

    The door does not quite shut. Through the crack you hear figures you do not understand and one word you do: owed.

    In the yard, Jocelin Tanner and the tanners' boys are going down to the wharf to throw stones at the Sarenzan ship. Your father's clerk is at his desk by the stair, doing sums for nobody.
  choices:
    - id: listen
      text: Stay by the door and listen.
      tags: [cunning]
      text_after: |
        Three hundred marks, borrowed in your grandfather's time against the wool of years not yet shorn. The Lanzi bank wants the next payment by Michaelmas. Your father promises it in a voice you have not heard him use. When the Sarenzan leaves he looks straight at you on the stair and says nothing at all.
      effects:
        - set: flag.p_knows_debt
        - add: { skill.intrigue: 1, rel.ralf_mercer.respect: -1 }
      next: p_hungry_year
    - id: wharf
      text: Go to the wharf with Jocelin and the tanners' boys.
      tags: [martial]
      text_after: |
        Jocelin throws first and hits a sailor. The sailors come down the gangplank with ropes' ends. You are the slowest because your shoes are the best, and you take the beating for the lot of them. Jocelin laughs about it for a month. The other boys stop calling you the wool-boy.
      effects:
        - set: flag.p_wharf_gang
        - add: { attr.endurance: 1, rep.commons: 1, rel.jocelin_tanner.respect: 2 }
      next: p_hungry_year
    - id: clerk
      text: Sit with the clerk and learn his sums.
      tags: [learning, wealth]
      text_after: |
        He shows you the abacus and the way to reckon a sack of wool in Sarenzan money and in Adalian, and the difference between the two, which is where the profit lives. By evening you can do it faster than he can. He does not like that much.
      effects:
        - set: flag.p_counting_house
        - add: { skill.trade: 1, rel.ralf_mercer.affection: 1 }
      next: p_hungry_year

- id: p_archer_open
  chapter: prologue
  title: The Butts
  checkpoint: true
  text: |
    Sunday after Mass, at the butts behind the church. Every man between sixteen and sixty is meant to shoot. Most of them drink.

    Your father shoots alone at the far end, from one leg, because the other knee will not bear him. He still puts six in the clout from two hundred paces. Nobody watches him any more.

    A man from his old company has walked over from the next parish. {npc.will_cobb}, with a grey beard and a new shirt. He and your father drink from the same jug and do not speak of the war, until Cobb says something about "the mill at Carn Dubh" and your father puts the jug down and tells you to go and fetch arrows.
  choices:
    - id: ask
      text: Ask your father what happened at Carn Dubh.
      tags: [cunning]
      text_after: |
        Not that day. Not for a week. Then one night, drunk, he tells you. The mill was full of people when the captain ordered it fired. He was one of the archers on the door. "We were told they were fighting men," he says. "Some were." He makes you swear never to say the name to anyone. He is ashamed that you know, and glad.
      effects:
        - set: flag.p_knows_war_secret
        - add: { rel.hugh_fletcher.affection: 1, rel.hugh_fletcher.respect: -1 }
      next: p_hungry_year
    - id: shoot
      text: Fetch the arrows, then shoot until your fingers bleed.
      tags: [martial]
      text_after: |
        Your father's old bow is too heavy for you. You draw it anyway, a hand's breadth, then two. By dark the string has cut your fingers to the meat and your back is on fire. He binds your fingers with his own linen and says you will be crooked like him by twenty. He sounds pleased.
      effects:
        - set: flag.p_bloody_hands
        - add: { skill.archery: 1, rel.hugh_fletcher.affection: 2 }
      next: p_hungry_year
    - id: cobb
      text: Follow Will Cobb to the alehouse and listen to his stories.
      tags: [allies]
      text_after: |
        Cobb tells stories for anyone who buys him ale, and you have no money, so he tells them for free. Harrow Ford. The Caldmoor spears coming on like a hedge in a gale. Your father, before his knee, the best shot in the company. He tells you where the serjeants drink and which captains pay. He leaves out Carn Dubh.
      effects:
        - set: flag.p_cobb_friend
        - meet: will_cobb
        - add: { rel.will_cobb.affection: 3, skill.tactics: 1 }
      next: p_hungry_year

- id: p_servant_open
  chapter: prologue
  title: The Destrier
  checkpoint: true
  text: |
    Ravell Hall, the stable yard, a raw spring morning.

    [if role == horse_master]You have mucked out the great horses since you could carry a fork.[elif role == huntsman]You sleep in the kennels with the lymers, and you smell like them.[else]You keep the mews clean and the hawks' jesses greased.[/if] Your mother dresses Lady Ravell. You eat in the kitchen with the scullions and know more about the family than the family thinks. You know, for one thing, who the heir's real father is. You heard it through a privy wall two years ago and have told no one.

    Aymer Ravell is nine, a year older than you, and the lord's second son. He wants to sit on his father's destrier, Bayard, a stallion that has killed one groom. He wants you to saddle it. Master Ranulf is at the far end of the yard.
  choices:
    - id: saddle
      text: Saddle Bayard for him and hold the head.
      tags: [allies]
      check: { attr: agility, skill: riding, difficulty: 3 }
      success:
        text: Bayard stands like a church while Aymer sits on him for a count of fifty. Aymer slides off grinning and calls you his man. Master Ranulf sees all of it and says nothing, which is how you know he is angry.
        effects: [ { set: flag.p_saddled_destrier }, { add: { rel.aymer_ravell.affection: 3, rel.ranulf_marshal.respect: -1 } } ]
        next: p_hungry_year
      failure:
        text: Bayard throws his head and Aymer comes off backwards into the midden. He is not hurt. Your mother is called to the lady's chamber and comes back with her face set. You do not eat that night.
        effects: [ { set: flag.p_saddled_destrier }, { add: { rel.aymer_ravell.affection: -1, rel.agnes_tirewoman.affection: -2 } } ]
        next: p_hungry_year
    - id: refuse
      text: Refuse him, and fetch Master Ranulf.
      tags: [diplomacy]
      text_after: Master Ranulf leads Aymer back to the house by the ear, which only a man of forty years' service could do. Aymer does not forget it. Neither does Ranulf, who starts teaching you properly from that week.
      effects:
        - set: flag.p_told_ranulf
        - add: { rel.ranulf_marshal.respect: 2, rel.ranulf_marshal.affection: 1, rel.aymer_ravell.affection: -2 }
        - if: role == horse_master
          then: [ { add: { skill.riding: 1 } } ]
          else: [ { add: { skill.woodcraft: 1 } } ]
      next: p_hungry_year
    - id: blame
      text: Saddle him, and tell Aymer you will take the blame if you are caught.
      tags: [martial]
      text_after: You are caught. Master Ranulf beats you with a stirrup leather in front of the grooms. Aymer watches from the gate and says nothing. That night he brings you a honey cake from the high table and says he owes you. He means it, for now.
      effects:
        - set: flag.p_took_blame
        - injury: bruised_ribs
        - add: { rel.aymer_ravell.affection: 2, rel.aymer_ravell.respect: 2, rep.honor: 1 }
      next: p_hungry_year

gervase_holt: { name: Gervase Holt, title: Master, notes: "Steward of Ashby, for Sir Hamon Darrell." }
wat_coker: { name: Wat Coker, notes: "Rival. His family's holding was seized under Piers's enforcement.", tags: [rival] }
# Burgess's son
ralf_mercer: { name: Ralf Mercer, tags: [family], notes: "Father. Burgess of Wendham, wool merchant." }
osbert_fuller: { name: Osbert Fuller, title: Master, notes: "Warden of the Wendham wool guild. Patron." }
jocelin_tanner: { name: Jocelin Tanner, notes: "Rival. Son of a rival guild master.", tags: [rival] }
bertuccio_lanzi: { name: Bertuccio Lanzi, notes: "Sarenzan factor in Wendham. Knows the family's debt.", faction: sarenza }
# Archer's son
hugh_fletcher: { name: Hugh Fletcher, tags: [family], notes: "Father. Veteran archer of the last war. Bad knee." }
ancel_brome: { name: Ancel Brome, title: Sir, notes: "Knight. Owes Hugh his life from the last war. Patron.", station: knight }
gib_shawe: { name: Gib Shawe, notes: "Rival. The bailiff's nephew, after the same militia place.", tags: [rival] }
# Household servant's son
agnes_tirewoman: { name: Agnes, tags: [family], notes: "Mother. Tirewoman to Lady Ravell." }
ranulf_marshal: { name: Ranulf, title: Master, notes: "Master of horse and hunt at Ravell Hall. Patron." }
aymer_ravell: { name: Aymer Ravell, notes: "Lord Ravell's younger son. Companion and rival.", tags: [rival] }
thurstan_ravell: { name: Thurstan Ravell, title: Lord, notes: "Baron of Ravell. The household's master.", station: great_lord, faction: nobles }
# Shared
hamon_darrell: { name: Hamon Darrell, title: Sir, notes: "Knight, lord of Ashby. Owes service to Lord Ravell.", station: knight, faction: knights }
father_anselm: { name: Anselm, title: Father, notes: "Parish priest of Ashby. Teaches letters for eggs and firewood.", faction: church }
# Childhood attachments (romance slot 1, one per background)
mag_coker: { name: Mag Coker, notes: "Wat Coker's sister. Sharp-tongued, quick, poor.", tags: [romance] }
annot_dyer: { name: Annot Dyer, notes: "A dyer's daughter in Wendham. Blue hands to the wrist.", tags: [romance] }
mariot_wood: { name: Mariot Wood, notes: "The Ravell forester's daughter. Knows every path in the chase.", tags: [romance] }
nell_laundress: { name: Nell, notes: "Laundry girl at Ravell Hall. Laughs at everyone, including the family.", tags: [romance] }
# Ravell Hall
eleanor_ravell: { name: Eleanor Ravell, title: Lady, notes: "Lord Ravell's wife. Runs the household. Keeps its secret.", faction: nobles, station: great_lord }
maud_delisle: { name: Maud de Lisle, title: Lady, notes: "Lord Ravell's ward. Heiress of Lisle. Her marriage is for sale.", faction: nobles, tags: [romance] }
isabel_sayer: { name: Isabel Sayer, notes: "Lady Ravell's waiting-woman. Daughter of a poor shire knight.", tags: [romance] }
giles_marrick: { name: Giles Marrick, notes: "Squire. Son of a Carrow retainer. Hates commoners in the squires' loft.", faction: knights }
bertram_oakes: { name: Bertram Oakes, title: Sir, notes: "Old knight, master-at-arms at Ravell. Missing two fingers.", station: knight, faction: knights }
father_benet: { name: Benet, title: Father, notes: "Lord Ravell's chaplain. Clever, worldly, writes the lord's letters.", faction: church }
will_cobb: { name: Will Cobb, notes: "Serjeant of Sir Ancel's archers. Served with Hugh Fletcher in the Marcher War." }
# Wider world
walter_pryce: { name: Walter Pryce, title: Sir, notes: "Captain in the Earl of Carrow's service. Recruits for the war.", station: knight, faction: knights, tags: [rising_man] }
osmund_carrow: { name: Osmund, title: Earl, notes: "Earl of Carrow. Leads the Old Baronage.", station: great_lord, faction: nobles }
godric_thorne: { name: Godric Thorne, title: Sir, notes: "Marcher knight, Sir Ancel's neighbour and enemy.", station: knight, faction: knights }
ewan_dubh: { name: Ewan Dubh, notes: "Black Ewan of Glenhallow. Caldmoor border raider.", faction: caldmoor }
coll_glenhallow: { name: Coll, notes: "Ewan Dubh's nephew, sixteen. Taken in the raid at the Leven ford.", faction: caldmoor }
joan_wyck: { name: Joan Wyck, title: Dame, notes: "Widow of Sir Hugh Wyck. Holds Wyck manor in her own right for now.", tags: [romance] }
cecily_fuller: { name: Cecily Fuller, notes: "Master Osbert Fuller's daughter. Keeps her father's books better than he does.", tags: [romance] }
king_aldred: { name: Aldred, title: King, notes: "Aldred II of Adalia.", faction: crown, station: royal }
# ---- Chapter 2: the war ----------------------------------------------------
davy_ludd: { name: Davy Ludd, notes: "Hob Crane's grandson from the Ravell stables. Fourteen, freckled, talks too much. Your squire or page." }
roger_tallis: { name: Roger Tallis, notes: "Man-at-arms, forty-odd, ten years in the free companies. Speaks Valdrennish. Cynical, careful, a survivor." }
jankin_rooke: { name: Jankin Rooke, notes: "Archer, eighteen, from the Ravell levy. Quiet, devout, the best shot in the company." }
simkin_barre: { name: Simkin Barre, notes: "Archer, a Wendham carter's son. A joker and a thief. Braver than he lets anyone see." }
perkin_dyer: { name: Perkin Dyer, notes: "Annot Dyer's brother. Big, slow-spoken, loyal as a dog." }
dickon_laund: { name: Dickon, notes: "Nell's brother from Ravell village. Sharp, small, quick with a knife." }
jehanne_armance: { name: Jehanne, title: Duchess, faction: valdrenne, notes: "Duchess of Armance. Her husband is Amaury's prisoner; she fights on, and has called in the Adalians." }
gaucelin_brese: { name: Gaucelin de Brésy, title: Messire, faction: valdrenne, station: great_lord, notes: "Constable of Valdrenne. Despises archers." }
raoul_corbie: { name: Raoul de Corbie, title: Messire, faction: valdrenne, station: knight, notes: "A Valdrennish knight of good family. Prisoner, and worth a great deal." }
heloise_corbie: { name: Héloïse de Corbie, faction: valdrenne, tags: [romance], notes: "Raoul de Corbie's sister. Came to the Adalian camp to treat for his ransom." }
baldwin_westry: { name: Baldwin, title: Earl, faction: nobles, station: great_lord, notes: "Earl of Westry. A King's man, rich in Adalian land." }
alys_fane: { name: Alys Fane, title: Lady, faction: nobles, tags: [romance], notes: "The Earl of Westry's daughter, with the Queen's household in the King's camp." }
fiammetta_lanzi: { name: Fiammetta Lanzi, faction: sarenza, tags: [romance], notes: "Matteo Lanzi's daughter. Keeps the bank's house in Sauvemer." }
enguerrand_vaux: { name: Enguerrand de Vaux, title: Sire, faction: valdrenne, station: knight, notes: "Castellan of Sauvemer." }
clemence_vaux: { name: Clémence de Vaux, title: Dame, faction: valdrenne, tags: [romance], notes: "The castellan's wife. Runs the town's stores during the siege." }
orsino_brancale: { name: Orsino Brancale, title: Cardinal, faction: church, notes: "Papal legate, Sarenzan by birth. Brokers the truce." }
ulric_rotbart: { name: Ulric Rotbart, faction: hroswald, notes: "Captain of the Iron Company, a free company of eight hundred." }
queen_mathilde: { name: Mathilde, title: Queen, faction: crown, notes: "Aldred's queen. Comes to the camp at Sauvemer." }

# Chapter 3: the manors
guerin_ormel: { name: Guérin, title: Père, faction: church, notes: "Priest of Ormel. Seventy, deaf in the left ear, shouts. Has buried three generations." }
bastien_ormel: { name: Bastien, notes: "Headman of Ormel. The eel-man. One eye, a wry tongue, no love for Adalians." }
yves_marsalin: { name: Yves, title: Père, faction: church, notes: "Priest of Marsalin. Young, earnest, frightened, brave about it." }
margot_marsalin: { name: Margot, notes: "Forewoman of the Marsalin salt-boilers. Big-armed. Her husband drowned in the pans at Les Salines." }
herve_kerval: { name: Hervé, title: Dom, faction: church, notes: "Benedictine from the Duchess's abbey, priest at Kerval. Fat, kind, shrewd." }
gwenael_kerval: { name: Gwenaël, notes: "Reeve of Kerval. A cheerful giant who speaks Adalian badly and loudly." }
hugues_ormel: { name: Hugues d'Ormel, title: Sire, faction: valdrenne, notes: "Nephew of the dead lord of Ormel. Nineteen, pale, proud, with a Valdrennish writ and the marsh's sympathy." }
peronnelle_marsalin: { name: Péronnelle de Salines, title: Dame, faction: valdrenne, notes: "Widow of the last lord of Marsalin. Claims her dower third by law. Sixty, sharp, patient." }
yann_penhoet: { name: Yann de Penhoët, title: Messire, faction: valdrenne, notes: "Armance knight of the rival claimant's party. Claims Kerval was his grandfather's." }
thibaut_brese: { name: Thibaut de Brésy, title: Messire, faction: valdrenne, notes: "The Constable's son, taken at Les Salines, ransomed home. Rides with the march lords." }
hodge_brewster: { name: Hodge Brewster, notes: "Leader of the Adalian settlers. A Saltcombe brewer's son with big hands and bigger opinions." }
# Ch3 Act III: arranged offers
alienor_brese: { name: Aliénor de Brésy, faction: valdrenne, tags: [romance], notes: "Sire Gautier's daughter, twenty. Dark, straight-backed, watches everything. Good Adalian, which she does not admit to at first." }
gautier_brese: { name: Gautier de Brésy, title: Sire, faction: valdrenne, station: lord, notes: "The Constable's younger brother, lord of Montbrun across the march. Heavy, tired, has buried two sons. Wants the border quiet." }
philippa_ashdown: { name: Philippa Ashdown, title: Lady, faction: nobles, tags: [romance], notes: "The King's ward, nineteen, heiress of Ashdown in the south of Adalia. Her father and brothers died in the Mottle." }

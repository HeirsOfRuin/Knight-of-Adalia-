hamon_darrell: { name: Hamon Darrell, title: Sir, notes: "Knight, lord of Ashby. Owes service to Lord Ravell.", station: knight, faction: knights }
father_anselm: { name: Anselm, title: Father, notes: "Parish priest of Ashby. Teaches letters for eggs and firewood.", faction: church }
# Childhood attachments (romance slot 1, one per background)
mag_coker: { name: Mag Coker, notes: "Wat Coker's sister. Sharp-tongued, quick, poor.", tags: [romance] }
annot_dyer: { name: Annot Dyer, notes: "A dyer's daughter in Wendham. Blue hands to the wrist.", tags: [romance] }

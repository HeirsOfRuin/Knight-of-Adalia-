# Chapter 3, Act III: the Match. Summer year 29 to harvest year 30. Age 28-29.
# Candidates are evaluated in c3_second_spring (02-lord.yaml): suits kept alive become
# available, the rest are lost. Arranged offers: Aliénor de Brésy (always), Lady Philippa
# Ashdown (the King's favour). @spouse names the woman he courts. Per-candidate text
# uses [if alias.spouse == x] chains; the long lines are deliberate.

- id: c3_match
  chapter: ch3
  title: "A Wife for the Manor"
  checkpoint: true
  text: |
    [if flag.c3_match_refused]So that is that. You ride home with your answer in your mouth like a bad tooth, and the manor, which knew where you had gone and why, is kind to you for a week, and that is the worst of it.

    [break]

    There are still letters on the table.[else]"A lord wants a lady," says [if flag.c2_granted_marsalin]Margot of the salt-boilers, to your face, in front of the whole pan-yard[elif flag.c2_granted_kerval]Gwenaël the reeve, loudly, in his terrible Adalian, at the manor court[else]Bastien the eel-man, with his one eye on you, at the church door[/if]. "A hall wants a woman in it. Look at the state of it. Rushes from Martinmas. Dogs on the table." Nobody laughs, quite.

    [if flag.c2_granted_marsalin]Père Yves[elif flag.c2_granted_kerval]Dom Hervé[else]Père Guérin[/if] says it more politely, and more often. Without an heir the manor goes back to the Crown when you die, and everyone on it goes back with it, to whoever the King feels like rewarding next. They have had one new lord. They do not want another.

    [break]

    So you sit down in the empty hall one evening, with a candle and the letters, and think it through.[/if]

    [if suit.mag_coker.status == available]Mag Coker has not married. [if npc.wat_coker.follower]Wat says, when you ask, that she has turned down two men and a widower, and that he has stopped asking her why, because she throws things.[else]Your mother [if flag.c3_sent_for_kin && background == burgess]has it from Wendham[else]writes[/if] that she has turned down two men and a widower, and that nobody in Ashby asks her why any more, because she throws things.[/if] She is twenty-seven, and the reeve's girl's promise was a long time ago.[/if]

    [if suit.annot_dyer.status == available]Annot Dyer is still in Wendham, still unmarried, still blue to the wrist. Your mother [if flag.c3_sent_for_kin && background == burgess]tells you, in the tone she keeps for Wendham news,[else]writes, in a tone you can hear across the sea,[/if] that Annot's father has refused three matches on her behalf, and that "the girl seems to be waiting for something, God knows what."[/if]

    [if suit.mariot_wood.status == available]Mariot Wood is still in the forester's cottage at Hollin, nursing her father and doing his work, and has not married. Kit [if flag.c3_sent_for_kin]has it from Hollin[else]writes[/if] that she walks the chase every evening, and stops at the edge of it where the road goes south, and that everyone in Hollin knows why and nobody says.[/if]

    [if suit.nell_laundress.status == available]Nell is still in the laundry at Ravell Hall, with her arms red to the elbow, and Father Benet writes, carefully, that she has refused a carter and a groom, and laughed at both of them, and that Lady Ravell has noticed.[/if]

    [if suit.isabel_sayer.status == available]Isabel Sayer is still at Ravell, in Lady Ravell's household, the last of her father's seven daughters left unmarried. She writes at Christmas: a page of gossip, funny as ever, and one line at the bottom about you that is not funny at all.[/if]

    [if suit.maud_delisle.status == available]Lady Maud de Lisle is in the King's wardship still. Her marriage is the Crown's to sell, and the Crown is short of money, as always. Her letters come by way of the Queen's household, quick and blotted. "They are pricing me again," the last one says. "Like a horse. Do you have any money?"[/if]

    [if suit.cecily_fuller.status == available]Cecily Fuller has turned down the Sarenzan factor, to her father's despair. She writes to you about the price of wool, the Lanzi bank's latest rates, and the state of Wendham's drains, and at the end, "My father says you are a lord now. He says it as if it were my doing. Is it?"[/if]

    [if suit.joan_wyck.status == available]Dame Joan Wyck still holds Wyck, and her stepson Ralph still wants it. She writes twice a year, short practical letters about apples and lawsuits. The last one ends: "Ralph says a widow cannot hold a manor against a man. I begin to think he may be right, and it makes me angry."[/if]

    [if suit.alys_fane.status == available]Lady Alys Fane is still unmarried, which at court is beginning to be remarked on. Her father the Earl of Westry wants a rich man with a great name. Alys, in her letters, wants something else, and is careful never to write down what.[/if]

    [if suit.heloise_corbie.status == available]Héloïse de Corbie writes from her brother's lands across the truce line. Raoul's ransom is paid at last, every crown of it, and there is nothing left for her dowry but a vineyard and her name. "My brother says I must take the veil or a fool," she writes. "I have told him I have not yet decided which."[/if]

    [if suit.fiammetta_lanzi.status == available]Fiammetta Lanzi heads the house of Lanzi in Sauvemer now. Her father died in the Mottle, and her uncles in Sarenza want her married to a cousin and the house brought home. She writes to you about salt and money, in a hand like a clerk's, and once, without explanation, sends you a Sarenzan orange.[/if]

    [if suit.clemence_vaux.status == available]Dame Clémence de Vaux is in Sauvemer still, a widow in black, keeping her husband's house in a town that is Adalian now. Her own people in the south want her home. She has not gone. When you meet her in the market she says "Monseigneur," and nothing else, and you both stand there in the fish-smell much longer than the word needs.[/if]

    [if suit.alienor_brese.status == available]And from across the border comes an offer nobody expected. Sire Gautier de Brésy, the Constable's younger brother, who holds Montbrun on the other side of the march, sends his chaplain with a letter. [if flag.c3_thibaut_spared]You spared his nephew Thibaut.[elif flag.c3_raid_held]You beat his nephew Thibaut at your own gate.[else]His nephew Thibaut burned your country, and you are still here.[/if] He has a daughter, Aliénor, twenty and unmarried, and he is tired of a border that burns every spring. "Peace is a marriage," the chaplain says, "or it is nothing."[/if]

    [if suit.philippa_ashdown.status == available]And a letter comes under the King's own seal. The King has in his wardship Lady Philippa Ashdown, nineteen, the heiress of Ashdown in the south of Adalia, whose father and brothers died in the Mottle. The King is minded, the letter says, to reward a loyal servant. It does not say "refuse at your peril." It does not need to.[/if]

    [if flag.c3_match_refused][else]You are twenty-eight. Your father married at twenty. Half the men you went to war with are dead and the other half have children walking.[/if]

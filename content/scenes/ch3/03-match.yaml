- id: c3_suitor
  chapter: ch3
  title: "[if alias.spouse == alienor_brese || alias.spouse == philippa_ashdown]The Offer[else]Her People[/if]"
  on_enter:
    - {"advance": {"seasons": 1}}
  text: |
    [if alias.spouse == mag_coker]Ashby, in the rain. [if npc.piers_reeve.alive]Your father[else]Your mother[/if] meets you at the gate and does not say a word. You would rather [if npc.piers_reeve.alive]he[else]she[/if] shouted. Everyone in the village knows why you have come. The children follow you down the lane in a pack, and old women come to their doors with their arms folded.

    Mag is at the Cokers' door, with her sleeves rolled and flour to the elbow. She looks you up and down: the good cloak, the sword, the horse. "Well," she says. "Look what the war's brought home." Behind her, her mother is crying already, and you cannot tell which way.

    [if npc.wat_coker.follower && npc.wat_coker.alive]Wat, who came with you, stands in the lane and grins like a fool.[elif !npc.wat_coker.alive]Wat is not there, and will not be. His mother lays a place for him at the table anyway, and nobody moves the stool.[else]Wat Coker is not there. He is off somewhere with the men who talk about the Ordinance in alehouses, and when he hears of it, he will have something to say.[/if] The rest of the family is a widowed mother, two uncles, and the whole of Ashby. Your own people, back on the manor, will have something to say too.[if flag.c1_maud_letter_kept] And somewhere at Ravell, in Lady Ravell's chest, is a foolish note you once wrote to Lady Maud, which Lady Ravell has kept, because she keeps everything.[/if] A lord marries a lady. Everybody knows that.[elif alias.spouse == annot_dyer]Wendham, on market day. The dyers' lane runs blue into the river, the way it always did, and the smell of it takes you straight back to being eleven.

    Annot's father looks at you as if you were a bolt of cloth with a flaw in it somewhere that he has not found yet. "A lord," he says. "Of somewhere in Valdrenne. With salt, is it, or marsh?" Annot, behind him, has her blue hands on her hips. "I'm not a lady," she says, before you have said anything. "I'd be a laughing-stock. You'd be a laughing-stock. They'd laugh at us in two languages." She does not say no.[elif alias.spouse == mariot_wood]Hollin. The cottages, the butts, the edge of the chase. Mariot is splitting kindling outside the forester's cottage, and she sets the axe down when she sees you, and wipes her hands on her apron, and waits.

    The trouble is not Mariot. The trouble is that the Woods are Ravell's people, bound to the manor, and a Ravell woman may not marry off the manor without her lord's licence and the merchet paid. Lord Ravell's steward has heard who is asking. The price, he says, has gone up.[elif alias.spouse == nell_laundress]Ravell Hall, by the back way, the way you came in as a boy. Nell is in the drying-yard among the sheets, and she sees you, and laughs out loud, and does not stop.

    "Look at you," she says. "Look at the boots on you."

    Then Lady Ravell sends for you. She does not sit, and does not ask you to. Nell is her laundress, and her servant, and [if background == servant]so was your mother, God rest her, as she reminds you[else]a girl of her household[/if], and she does not care, she says, to have her household made a joke of in the shire.[elif alias.spouse == isabel_sayer]Ravell Hall, the front way this time, with your own men behind you. Isabel is waiting in Lady Ravell's solar with her hands folded and ink on her forefinger, exactly as she was, and she says, "You took your time," in a voice that is not quite steady.

    Her father, Sir John Sayer, has six other daughters married and one dowry left to find, and would give her to you with both hands and a blessing. The difficulty is Lady Ravell, who has kept Isabel for eleven years and is not used to giving things up.[if flag.c2q_isabel_waits] Sir John agreed to wait a year for you, once. It has been five.[/if][elif alias.spouse == maud_delisle]Wendmere, the King's hall by the river: clerks, petitioners, dogs, rain. Lady Maud's marriage belongs to the Crown, and the Crown has an officer for selling such things, a soft-voiced clerk of the wardrobe who has a list and a price against every name on it.

    Maud's price is high. Lisle is a good inheritance, and two greater men than you have bid. "You may of course," the clerk says, "petition the King's grace." He makes it sound like a disease.

    Maud herself you see for a quarter of an hour, in a gallery, with the Queen's women all round. She says, fast and low, "Do whatever it takes. I will not be sold to Carrow's nephew. I will go into a nunnery first, and burn it down."[elif alias.spouse == cecily_fuller]Wendham, the Fullers' counting-house. Master Osbert Fuller is fatter than ever and greets you with "Well now," which means the bargaining has started.

    Cecily sits at the end of the table with the ledger open. "My father," she says, "wants to know what you are worth. I have told him. He does not believe me." Osbert wants a lord for his girl. He has one now. What he wants next is to be sure he is not paying too much for it.[elif alias.spouse == joan_wyck]Wyck, at apple harvest. Joan is in the orchard on a ladder, with her skirts kilted up, and she comes down when she sees you and says, "If you've come about the cider, it isn't ready."

    She is a widow, and her own woman: nobody can give her or refuse her but herself. The difficulty is Ralph, her stepson, who is twenty-one now, and has a lawyer, and says that Wyck is his and that if his stepmother marries a Valdrennish adventurer he will have the law on both of them.[elif alias.spouse == alys_fane]Westry, the Earl's great house, with the river below it and a hundred servants. Lady Alys receives you in a garden that cost more than your manor.

    The Earl of Westry receives you in his closet, for the length of time it takes to drink one cup of wine. He is courteous. He wants, he says, a husband for his daughter who will add to the house of Westry, not take from it. He asks, pleasantly, what you have. You tell him. He nods, pleasantly, and says he will think about it, in a voice that has already finished thinking.[elif alias.spouse == heloise_corbie]Corbie, across the truce line, under a safe-conduct that took three months to get. The house is half ruined still, from the war and the ransom both. Raoul de Corbie meets you at the gate. [if flag.c2_giles_took_corbie]He has not forgotten that you rode with the man who took him.[else]He has not forgotten whose prisoner he was.[/if][if flag.c2_corbie_squeezed] Nor what you made his family pay.[elif flag.c2_corbie_ransom_due] Nor that the ransom went into your purse.[/if]

    "You want my sister," he says. "An Adalian. After everything." And behind him, at the window, Héloïse, who has not decided between the veil and a fool, and who looks at you as if she were deciding now.

    On the Adalian side there is the King's licence to think of, for a lord to marry a woman of the enemy's country. The King's clerks do not like the Corbie name. It is on too many of their lists.[elif alias.spouse == fiammetta_lanzi]The Lanzi house in Sauvemer: cool, dark, smelling of oranges and ink. Fiammetta receives you at the counting-table, in black, with her father's ring on her thumb.

    "My uncles want me married to my cousin Piero," she says. "Piero is a good man. He has never once in his life surprised anybody." She turns the ring. "The bishop of Sauvemer will say a Sarenzan banker's daughter is next door to a Jew. My uncles will say an Adalian lord is next door to a debtor. They are both right. What do you propose to do about it?"[elif alias.spouse == clemence_vaux]Sauvemer, the house in the Rue des Saulniers, with the shutters half-closed against the summer. Clémence de Vaux is a widow and of age, and gives herself.

    The difficulty is everyone else. Her husband's brother, Sire Aimery, writes from the south that a Vaux widow will not marry the man who besieged her. The town, which still remembers the siege, does not care for the idea either. And you are not sure, when she looks at you across her husband's table, that she does not agree with them.[elif alias.spouse == alienor_brese]Montbrun, across the border, under a flag of truce. Sire Gautier de Brésy is a heavy, tired man in his fifties who has buried two sons. He gives you good wine and plain talk.

    "The meadows at the Pont-aux-Moines," he says. "The mill on the Sèvre. My nephew burns your barns, your men burn mine. I would like to stop. My daughter would like, I think, to be asked." Aliénor is at the end of the table, dark and straight-backed, and has not taken her eyes off you since you came in. Her cousin Thibaut [if flag.c3_thibaut_spared]is at the table too, and raises his cup to you an inch[else]is not at the table, and everyone looks at his empty place[/if].[elif alias.spouse == philippa_ashdown]Wendmere, the King's hall. You are presented to Lady Philippa Ashdown in a gallery full of courtiers who have all heard what the King intends, and are watching to see how it goes.

    She is small and fair and nineteen, and in black for her father and her brothers. She gives you her hand to kiss with the expression of a girl being handed to a stranger as a reward for something she had nothing to do with. "My lord," she says. "They tell me you are brave." She says it the way you might say a horse is sound in the wind.[/if]
  choices:
    - id: speak
      text: "Make your case yourself."
      tags: ["diplomacy"]
      check: {"attr": "presence", "skill": "diplomacy", "difficulty": 2, "mods": [{"if": "alias.spouse == maud_delisle", "add": -3, "label": "the Crown's price"}, {"if": "alias.spouse == alys_fane", "add": -3, "label": "the Earl's pride"}, {"if": "alias.spouse == heloise_corbie", "add": -2, "label": "Corbie and the King's clerks"}, {"if": "alias.spouse == mariot_wood", "add": -1, "label": "the merchet"}, {"if": "alias.spouse == nell_laundress", "add": -1, "label": "Lady Ravell"}, {"if": "alias.spouse == isabel_sayer", "add": -1, "label": "Lady Ravell"}, {"if": "alias.spouse == joan_wyck", "add": -1, "label": "Ralph and his lawyer"}, {"if": "alias.spouse == fiammetta_lanzi", "add": -1, "label": "the uncles and the bishop"}, {"if": "alias.spouse == clemence_vaux", "add": -1, "label": "the siege"}, {"if": "alias.spouse == alienor_brese", "add": -1, "label": "the border"}, {"if": "alias.spouse == philippa_ashdown", "add": -1, "label": "a girl given away"}, {"if": "suit.@spouse.regard >= 7", "add": 1, "label": "she speaks for you"}, {"if": "res.renown >= 14", "add": 1, "label": "your name"}, {"if": "suit.@spouse.family >= 2", "add": 1, "label": "her family likes you"}]}
      success:
        text: |
          [if alias.spouse == mag_coker || alias.spouse == annot_dyer || alias.spouse == mariot_wood || alias.spouse == nell_laundress]You do it in the kitchen, in front of everybody, because there is no other way to do anything in a cottage. You say what you have, and what you have not, and what you mean to do. [if alias.spouse == mag_coker]Mag's mother stops crying halfway through and starts asking about the size of the hall.[elif alias.spouse == annot_dyer]Annot's father asks four questions about rents and one about salt, and then holds out his blue hand.[elif alias.spouse == mariot_wood]Ravell's steward, in the end, takes the ordinary merchet and a cup of your wine, and says he never meant anything by it.[else]Lady Ravell listens to the end, and says, "She will have to learn to sit still," which from Lady Ravell is a blessing.[/if] Then everybody is talking at once.[elif alias.spouse == cecily_fuller || alias.spouse == fiammetta_lanzi][if alias.spouse == cecily_fuller]You lay it all out on Master Osbert's own counting-table: the manor, the rents, the salt, the debts. Cecily checks your sums while you talk and finds one wrong, in your favour, and corrects it against you, and her father laughs till he wheezes. "Well now," he says. "Well now. She's met her match, or near enough."[else]You make your case to Fiammetta's uncles by letter, in your best Sarenzan, with her correcting the grammar over your shoulder. It is a merchant's case: what an Adalian lord in Sauvemer is worth to a Sarenzan house in Sauvemer. They take three months to answer. The answer is a contract with forty clauses, and Fiammetta reads it, and says, "Yes. They have given up. Look, they have spelled your name right."[/if][elif alias.spouse == isabel_sayer || alias.spouse == joan_wyck][if alias.spouse == isabel_sayer]You go down on one knee to Lady Ravell, which is not usual, and she knows it. She looks at you for a while, and then at Isabel, and then she says, "Get up, you'll ruin the hose," and you know you have won.[else]You ride over to Ralph Wyck's lawyer with your own, and put the matter so plainly, and so courteously, that the lawyer advises his client to take a settlement and be thankful. Ralph takes it. He is not thankful.[/if][elif alias.spouse == maud_delisle || alias.spouse == alys_fane][if alias.spouse == maud_delisle]It takes the whole of the summer: petitions, gifts to the right clerks, an hour on your knees in front of the King, who is amused, and remembers your name. In the end the Crown takes less than it asked, and more than you have, and gives you Maud.[else]You talk to the Earl of Westry about the salt trade, the Sauvemer customs, and the King's debts, for two hours, until he forgets to finish his wine. At the end he says, "My daughter tells me you are honest. I had hoped she was wrong. Well. She usually isn't."[/if][elif alias.spouse == heloise_corbie || alias.spouse == clemence_vaux][if alias.spouse == heloise_corbie]Raoul de Corbie hears you out in his half-ruined hall, and then says, "You were fair to me when you did not have to be." He holds out his hand. The King's clerks are harder, and slower, and in the end the licence comes, sealed and grudging, with a fine attached.[else]You go to Sire Aimery de Vaux yourself, under a safe-conduct, and stand in his hall in the south and tell him the truth about the siege, all of it. He listens with his jaw set. At the end he says, "[if flag.c2_clemence_talked]My brother's widow said you were the only Adalian who asked about the dead[else]My brother's widow says you were at the siege. So was everyone[/if]." You decide to take it as a yes.[/if][elif alias.spouse == alienor_brese || alias.spouse == philippa_ashdown][if alias.spouse == alienor_brese]You and Sire Gautier talk till the candles gutter: meadows, mill-rights, who rides where and when. At the end you have a truce on paper, and he has a son-in-law, and Aliénor, who has listened to all of it without a word, says, in good Adalian, "You drive a hard bargain, my lord. I shall remember."[else]You do not try to charm her. You tell her plainly what the manor is, and the marsh, and the plague, and what she would be to it. Somewhere in the middle she stops looking past you. At the end she says, "Nobody has told me anything for a year. They just move me." That is a beginning.[/if][/if]
        effects: [{"add": {"suit.@spouse.family": 2}}]
        next: "c3_contract"
      partial:
        text: |
          It is not pretty, and it costs you. [if alias.spouse == maud_delisle || alias.spouse == alys_fane || alias.spouse == philippa_ashdown]Gifts in the right places, a promise of service you will have to keep, and a great deal of kneeling.[else]Promises to her family you will have to keep, and a gift you cannot really afford.[/if] But in the end they say yes.
        effects: [{"add": {"res.coin": -480}}]
        next: "c3_contract"
      failure:
        text: |
          [if alias.spouse == joan_wyck || alias.spouse == clemence_vaux || alias.spouse == fiammetta_lanzi][if alias.spouse == joan_wyck]Ralph's lawyer sends a writ. Joan reads it in the orchard, and tears it in half, and says, "I am a widow and of age, and I will marry whom I please." She does. Ralph will not forgive either of you, and the shire takes sides.[elif alias.spouse == fiammetta_lanzi]Her uncles refuse, and cut her off from the house in Sarenza. Fiammetta reads the letter twice, folds it small, and says, "Well. I keep the Sauvemer books. They will find that inconvenient." She marries you anyway.[else]Sire Aimery writes that no Vaux will stand at the church door with the man who starved Sauvemer, and that his brother's widow is dead to him. Clémence reads it standing, and puts it in the fire, and says, "Then I am free of him too." She marries you anyway.[/if][elif alias.spouse == alienor_brese || alias.spouse == philippa_ashdown][if alias.spouse == alienor_brese]Gautier wants more than you can give: the meadows, the mill and the ford. You give the meadows. Aliénor watches the bargaining with a face like a shut door, and you are not sure she will forgive either of you for it.[else]You make a poor fist of it. She answers your courtesies with her own, perfect and cold. The King's mind is made up, and so is hers. The wedding goes ahead.[/if][elif alias.spouse == mag_coker || alias.spouse == annot_dyer || alias.spouse == mariot_wood || alias.spouse == nell_laundress || alias.spouse == isabel_sayer || alias.spouse == maud_delisle || alias.spouse == cecily_fuller || alias.spouse == joan_wyck || alias.spouse == alys_fane || alias.spouse == heloise_corbie || alias.spouse == fiammetta_lanzi || alias.spouse == clemence_vaux || alias.spouse == alienor_brese || alias.spouse == philippa_ashdown]It goes wrong. [if alias.spouse == mag_coker || alias.spouse == annot_dyer || alias.spouse == mariot_wood || alias.spouse == nell_laundress]The village laughs, and her people close round her like a fist. "Go back to your Valdrennish, my lord," somebody calls, and the door shuts.[elif alias.spouse == maud_delisle || alias.spouse == alys_fane]The price goes up while you are still talking, and a greater man pays it.[elif alias.spouse == heloise_corbie]The King's clerks lose the petition, find it, lose it again. By the time it is found for good, Raoul has given his sister to a cousin.[else]Her family says no, politely, finally, and with a little relief.[/if] {npc.@spouse} sends you a letter afterwards. You keep it.[/if]
        effects: [{"if": {"any": ["alias.spouse == joan_wyck", "alias.spouse == clemence_vaux", "alias.spouse == fiammetta_lanzi"]}, "then": [{"set": "flag.c3_kin_against"}, {"add": {"suit.@spouse.family": -3}}], "else": [{"if": {"any": ["alias.spouse == alienor_brese", "alias.spouse == philippa_ashdown"]}, "then": [{"set": "flag.c3_hard_terms"}, {"add": {"suit.@spouse.regard": -2}}], "else": [{"assign": {"suit.@spouse.status": "lost"}}, {"set": "flag.c3_match_refused"}]}]}]
        next: {"switch": [{"if": "flag.c3_match_refused", "go": "c3_match"}], "default": "c3_contract"}

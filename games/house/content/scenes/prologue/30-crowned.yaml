# The Prologue for the Crowned opening when the founder married Mahaut (STORY.md, "The crowned path"). The founder
# is King of the West, Mahaut his queen. Their eldest, Jehanne (born 44), is the heir under the crown's custom of the
# eldest child. At Lady Day of year 53 the old king crowns her junior queen at nine; Mahaut governs as regent, and the
# old king lives on at court until about year 64. The rival of the prologue is Quérec, who will not swear to a girl.
# A crowned life without Mahaut keeps the framework scene (h_open) for now.

- id: h_pc00_crown
  chapter: prologue
  title: The Crown of the West
  frames: [free]
  text: |
    The crown of the West is five years old, and you have worn it since the oaths at Lannec. It is heavier than it looked.
  choices:
    - id: go_on
      text: Go on.
      next: { switch: [ { if: inherited.c5_married_mahaut, go: h_pc01_court } ], default: h_open }

- id: h_pc01_court
  chapter: prologue
  title: The King at Lannec
  checkpoint: true
  frames: [free]
  text: |
    The great hall at Lannec is cold in the mornings, and so are you. You are {age_words}. The fire was lit at Prime and has not reached the dais yet, and the chamberlain stands at your elbow with the day's petitions under his arm, waiting for you to be ready.

    You were {house.origin} once. Now the hall stands when you come in, and the hall is the hall where the Estates of the West made you king, and every morning you walk past the place where you stood that day and do not look at it.

    Mahaut comes down with her women. She is thirty-one, and Queen of the West, and Duchess of Armance in her own right, which she has never once let a clerk forget. She takes the chair beside yours and moves the salt so you can reach it. Jehanne comes after her at a run, six years old, in a gown she has already torn, and climbs into your lap without asking, as she has since she could climb.[if family.children >= 2] The younger ones come behind with their nurse, in order of size.[/if]

    "Your daughter," says Mahaut, "has been in the stables again."

    "My daughter," you say, "is the heir to the crown of the West. She can be in the stables if she likes."

    "That," says Mahaut, "is what I am afraid of."
  choices:
    - id: ride
      text: Take Jehanne up on your saddle and ride out to the fields.
      effects: [ { add: { heir.bond: 1, counter.shadow: 1 } } ]
      text_after: |
        You ride out by the river gate with Jehanne in front of you on the saddle, holding the reins she thinks are steering the horse. The people on the road stop and bow and stare. "Why are they looking?" she asks. "Because you're going to be their queen." She thinks about that for a furlong. "Can I have a horse of my own, then?"
      next: h_pc02_company
    - id: rolls
      text: Go through the treasurer's rolls before the petitioners come.
      effects: [ { set: flag.h_p_books } ]
      text_after: |
        The crown's revenues in a clerk's tidy columns: the salt tithe, the customs at Sauvemer, the demesne rents, the fines of the court. The crown's costs underneath, longer. You read it twice. A king who stops reading his treasurer's rolls finds out what he missed from the Sarenzans.
      next: h_pc02_company
    - id: petitions
      text: Hear the petitions in the great hall yourself.
      effects: [ { add: { counter.household: 1 } } ]
      text_after: |
        A guild quarrel, a widow, a monastery's mill, a knight who wants his son made a page. You do it yourself, as you always have, and the hall watches the King of the West rule on a mill. "He's not grand yet," somebody says at the back, approvingly.
      next: h_pc02_company

- id: h_pc02_company
  chapter: prologue
  title: The Old Company
  frames: [free]
  text: |
    {house.companion} comes up from the guardroom after Terce, the way he has every day since there was a guardroom to come up from. He is grey now, and walks with one shoulder lower than the other, and he does not bow to the King of the West unless there is somebody watching.

    "There's fewer of us," he says, and sits without asking, and pours himself your wine. "At the Christmas feast. You've noticed."

    You have. The old company, the ones who rode with you when you had one horse and no name, fit round one table now, with room. The rest are names in the chancel, or names you say when the wine is good.

    "I'm not asking for anything," says {house.companion_first}. "I want that said first. But you're the King, and you're not young, and the little one's six." He turns the cup. "I want to know what happens to us. After."
  choices:
    - id: holding
      text: Give him a manor of the crown's, with a hearth he can die at.
      effects: [ { set: flag.h_companion_holding }, { add: { counter.household: 1 } } ]
      text_after: |
        "The crown manor at the ford," you say. "Rent of a rose at midsummer." He argues, and stops, and looks at the table for long enough that you pour him more wine so he has something to do with his hands. He goes in the spring. The palace is quieter without him, and you miss being argued with.
      next: h_pc03_heir
    - id: counsel
      text: Ask him to stand at Jehanne's shoulder when you are gone.
      effects: [ { set: flag.h_companion_counsel } ]
      text_after: |
        "Me? With a princess?" He laughs. "She'll have bishops for that." "She'll have bishops," you say. "She'll need someone who'll tell her the truth." He thinks about it, and nods once, and finishes the wine like a man signing something.
      next: h_pc03_heir
    - id: side
      text: Keep him at your side to the end. You will need someone who remembers.
      effects: [ { set: flag.h_companion_side }, { add: { counter.household: 1 } } ]
      text_after: |
        "I'm not going anywhere," you tell him, "and neither are you." He grins with the half of his mouth that still has its teeth, and goes back down to shout at the guard.
      next: h_pc03_heir

- id: h_pc03_heir
  chapter: prologue
  title: The Heir of the West
  frames: [free]
  on_enter: [ { catch_up: { year: 50, season: summer } } ]
  text: |
    Midsummer, and the court at Lannec in the long gallery out of the heat. You watch Jehanne across the gallery, [if heir.temperament == bookish]curled in a window seat with a book of hours she cannot read yet, telling herself the pictures[elif heir.temperament == bold]trying to make the Queen's greyhound jump over a stool, and getting the stool over the greyhound instead[elif heir.temperament == merry]holding court among the pages, who are laughing at something she has said about the Bishop[else]standing still beside her mother's chair, watching the lords come and go and remembering their faces[/if].

    No woman has worn the crown of the West. There has only been one crown of the West, and you are wearing it. The custom of the new crown is what you made it at your crowning: the eldest child, son or daughter, crowned after you without anyone thinking to object.

    "They will object," Mahaut says, beside you, low. "Not now. Now you are alive. When you're old, and she's a girl, and there's a man somewhere with a better beard." She watches her daughter. "My grandmother held the Armance through a war. Nobody thought a woman could. She'll need to know how."

    "Then who teaches her?"
  choices:
    - id: mahaut
      text: Give her to Mahaut and her women, to learn courts and councils.
      effects: [ { set: flag.h_heir_court }, { upbringing: { who: heir, set: court } }, { add: { heir.skill.courtesy: 1, heir.skill.diplomacy: 1, rel.mahaut_armance.affection: 1 } } ]
      text_after: |
        Mahaut takes her in hand that summer: the council chamber, the household accounts, the order of precedence at a feast, which takes a month. By Michaelmas Jehanne can tell a Kerguen from a Quérec across a hall by the way they stand, and says so, loudly, which Mahaut is working on.
      next: h_pc04_querec
    - id: armance
      text: Send her to the Armance, to be known there as its heiress.
      effects: [ { set: flag.h_heir_manor }, { upbringing: { who: heir, set: home } }, { add: { heir.skill.stewardship: 1, heir.skill.riding: 1, heir.bond: -1 } } ]
      text_after: |
        She goes at Lammas with her nurse and Mahaut's old steward to the castle above the Armance, where her great-grandmother held out. The Armance lords come to see her, and kneel to a six-year-old, and go home and tell their wives. You miss her in the palace more than you say.
      next: h_pc04_querec
    - id: king
      text: Keep her at your side, and teach her what you know.
      effects: [ { set: flag.h_heir_kept }, { upbringing: { who: heir, set: arms } }, { add: { counter.shadow: 2, heir.skill.riding: 1, heir.skill.command: 1 } } ]
      text_after: |
        "With me," you say. "Every council, every court day, every fool with a grievance." Mahaut raises an eyebrow and says nothing, which is a great deal. Jehanne sits on a stool at the foot of the dais through the summer assize and falls asleep twice, and on the third day asks the chancellor a question that makes him go red.
      next: h_pc04_querec

- id: h_pc04_querec
  chapter: prologue
  title: Quérec
  frames: [free]
  text: |
    The summer court ends with the oaths, as it does every year: the lords of the West renew their faith to the King, and this year, for the first time, you have asked them to swear to Jehanne as your heir.

    They swear, one after another, and kiss the child's small hand, and she bears it with a face like a bishop. Then {house.querec} comes forward, and stands, and does not kneel.

    [if inherited.c5r_querec_executed]He is the son of the man whose head you set on the square at Lannec. He was nineteen then. He is twenty-five now, with his father's eyes and the marsh lands you gave him back out of mercy, or policy, and he has never forgotten which.[elif inherited.c5r_querec_exiled]He is the son of the man you sent over the march in a cart, and he has come back under a safe-conduct, with his father's eyes, to say what his father would have said.[elif inherited.c5r_querec_pardoned]He is old now, the salt lord of the southern marsh, pardoned in this hall when he knelt to you the third time. He seems to have decided that three times was enough.[else]He is old now, the salt lord of the southern marsh, the last man in the West who still says what he thinks of you to your face.[/if]

    "I swore to you," {house.querec_short} says, loud enough for the hall. "I'll keep it. But no woman has ever worn this crown, because no one has ever worn this crown but you, and I'll not swear to a girl of six who'll be a woman of twenty with a husband nobody's chosen yet. Not this year. Ask me when you know who'll really rule."
  choices:
    - id: demand
      text: Tell him he will swear now, before the West, or answer for it.
      check: { attr: presence, skill: command, difficulty: 6, audience: nobles, mods: [ { if: inherited.c5r_querec_knelt, add: 1, label: he knelt to you before }, { if: counter.household >= 2, add: 1, label: the court is with you } ] }
      success:
        text: |
          The hall goes quiet. {house.querec_short} looks at you, and at your guard along the wall, and at Jehanne, who is looking straight back at him. Then he kneels, slowly, and kisses her hand, and says the words. On his way out he says to her, quite gently, "You'll do, I expect," and she says, "I know," and half the hall laughs.
        effects: [ { set: flag.h_c_querec_swore }, { add: { counter.household: 1 } } ]
        next: h_pc05_exchequer
      failure:
        text: |
          He hears you out, and bows, which is not kneeling, and walks the length of the hall and out of the door, and nobody stops him. He rides south that night, to the marsh. In a month the whole West knows that a lord refused to swear to the King's daughter, and lived.
        effects: [ { set: flag.h_c_querec_defiant }, { add: { counter.household: -1 } } ]
        next: h_pc05_exchequer
    - id: buy
      text: Buy his oath with the salt tithe of the southern marsh. (£40)
      requires: "res.coin >= 9600"
      effects: [ { set: flag.h_c_querec_bought }, { add: { res.coin: -9600 } } ]
      text_after: |
        A private word after Vespers, and the crown's share of the marsh salt for ten years. He takes it, and swears at Michaelmas in a small chapel with three witnesses, and everyone who matters hears what it cost. It is an oath. You will find out what kind.
      next: h_pc05_exchequer
    - id: watch
      text: Let it lie, and have him watched.
      effects: [ { set: flag.h_c_querec_watched }, { set: flag.h_c_querec_defiant } ]
      text_after: |
        "Next year, then," you say, pleasantly, and turn to the next man. {house.querec_short} goes home to the marsh. Your men go after him, quietly, one as a salt carter, one as a friar. By Michaelmas you know who comes to dinner at Quérec, and it is a longer list than you would like.
      next: h_pc05_exchequer

- id: h_pc05_exchequer
  chapter: prologue
  title: The Exchequer
  frames: [free]
  on_enter: [ { catch_up: { year: 50, season: autumn } } ]
  text: |
    Michaelmas, and the crown's reckoning. The treasurer sets up his chequered cloth in the lower hall, and the sheriffs of the West come in one by one to account for their shires, with their tallies and their excuses, and the clerks move the counters on the squares like a game nobody wins.

    You sit through all of it, as you always have. The salt tithe is in. The Sauvemer customs are short, again. The castles on the march want mending, the fleet wants paying, and the Sarenzans want their interest, politely, by letter, in a hand you have learned to dread.

    "We can do what you want this year, Your Grace," says the treasurer. "We can't do all of it."

    "We never could."

    "No, Your Grace. But you used to be younger about it."
  choices:
    - id: pay
      text: Pay the household and the guard well, and let them know it was you. (£10)
      requires: "res.coin >= 2400"
      effects: [ { add: { res.coin: -2400, counter.household: 1 } } ]
      text_after: |
        You pay every man his wage and a shilling over, and hand the captains theirs yourself. In the guardroom they drink your health and Jehanne's, in that order, and then the other way round, to be safe.
      next: h_pc06_embassy
    - id: save
      text: Put coin by, against whatever comes after you.
      effects: [ { set: flag.h_p_saved } ]
      text_after: |
        Two hundred pounds into the strongroom under the chapel, and the key to Mahaut. "Against what?" asks the treasurer. "Against a regency," says Mahaut, and the treasurer writes it down.
      next: h_pc06_embassy
    - id: largesse
      text: Remit the salt towns' arrears, and let the Estates hear of it.
      effects: [ { add: { res.coin: -4800, counter.favour: 2 } }, { set: flag.h_c_largesse } ]
      text_after: |
        The arrears of six salt towns, forgiven at a stroke. The bells ring in Sauvemer on Sunday, and the guildmasters, who will sit in the Estates, remember it in their prayers, and in their votes.
      next: h_pc06_embassy

- id: h_pc06_embassy
  chapter: prologue
  title: The Embassy
  frames: [free]
  on_enter: [ { catch_up: { year: 50, season: winter } } ]
  text: |
    At Martinmas an embassy comes over the hills from Cordelle with forty horses and a bishop, to ask for the heir of the West.

    King Amaury VII offers his brother, Prince Lothaire, twenty, for Jehanne. A betrothal now, a marriage when she is fourteen, and peace on the march for as long as it lasts. The bishop puts it beautifully. The Valdrennish lords stand behind him and look at the hall as if pricing it.

    Mahaut listens to all of it without moving. When they have gone to their lodgings she says, "Amaury tried to marry me to that boy when he was eleven. Now he wants my daughter for him." She turns her rings. "My grandmother let me choose. I chose you."

    [if inherited.c5r_peace_marriage]There is a peace already, made with a marriage. Amaury wants a second.[elif inherited.c5r_no_peace]The march has burned every summer since the war. Amaury is offering it to stop.[else]The peace with Valdrenne is a paper and a habit. Amaury is offering to make it a family.[/if]
  choices:
    - id: valdrenne
      text: Betroth Jehanne to Prince Lothaire, and buy the march a peace.
      effects: [ { set: flag.h_c_betrothed_valdrenne }, { add: { rel.mahaut_armance.affection: -2, counter.favour: 1 } } ]
      text_after: |
        The contracts take a month. Jehanne meets her betrothed once, across the great hall, and asks him why his nose is so long, and he laughs, which is the best anyone can say of him. Mahaut signs as Duchess of Armance in a hand like a blade, and does not speak to you for a week.
      next: { pool: h_prologue, count: 1, then: h_pc08_estates }
    - id: free
      text: Send them home. She will choose, as her mother did.
      effects: [ { set: flag.h_c_jehanne_free }, { add: { rel.mahaut_armance.affection: 2 } } ]
      text_after: |
        You send them home with gifts and a refusal so courteous that it takes the bishop a day's ride to understand it. On the march that summer the raiders are bolder. Mahaut, at supper, puts her hand over yours on the table, and leaves it there.
      next: { pool: h_prologue, count: 1, then: h_pc08_estates }
    - id: delay
      text: Answer that the heir of the West is too young to be promised.
      effects: [ { set: flag.h_c_embassy_delayed } ]
      text_after: |
        "In seven years," you tell the bishop, "ask again." The embassy goes home neither refused nor accepted, which is what embassies are for. Amaury, you hear, laughs when he is told, and says the old king is learning.
      next: { pool: h_prologue, count: 1, then: h_pc08_estates }

- id: h_pc08_estates
  chapter: prologue
  title: The Estates at Whitsun
  frames: [free]
  on_enter: [ { catch_up: { year: 52, season: spring } } ]
  text: |
    You call the Estates of the West to Lannec at Whitsun in the year 52, and they come: the lords on their benches, the bishops in their stalls, the burgesses of the salt towns at the back in their good wool, all of them in the hall where they made you king ten years ago.

    You have called them for one thing. You want them to swear, as a body, to Jehanne as your heir, so that when you are dead nobody can say the West never agreed.

    [if flag.h_c_querec_defiant]{house.querec_start} is in the hall, which nobody expected, with a dozen marsh lords at his back. He has come to say no in public.[elif flag.h_c_querec_bought]{house.querec_start} is in the hall, in a new cloak, and avoids your eye.[else]{house.querec_start} is in the hall, and nods to you, and nods to Jehanne.[/if] Hervé de Penhoët sits on the Armance bench among the Queen's own lords, saying nothing, and taking notes.

    Jehanne is eight, and sits beside her mother in a gown that does not fit her yet, and swings her feet.
  choices:
    - id: swear
      text: Ask the Estates to swear to Jehanne, as your heir, now.
      check: { attr: presence, skill: diplomacy, difficulty: 6, audience: nobles, mods: [ { if: flag.h_c_querec_swore, add: 1, label: Quérec has sworn }, { if: flag.h_c_querec_bought, add: 1, label: Quérec has been paid }, { if: flag.h_c_largesse, add: 1, label: the salt towns remember }, { if: flag.h_c_querec_defiant, add: -1, label: Quérec's marsh lords } ] }
      success:
        text: |
          You speak for a quarter of an hour, which is long for you, about the war and the Estates and the hall you are standing in, and then you sit down. The bishops stand first. Then the burgesses, then the Armance, then the rest. They swear to Jehanne as the heir of the West, as a body, with their hands raised, and the clerk writes it in the roll of the Estates in letters an inch high. Jehanne stands on her chair to see, and Mahaut does not stop her.
        effects: [ { set: flag.h_c_estates_swore }, { add: { counter.favour: 1 } } ]
        next: h_pc09_illness
      failure:
        text: |
          You speak, and it goes well enough, and then {house.querec_short}'s marsh lords stand and talk about custom and Valdrenne and a girl, and the hall begins to argue among itself. In the end the Estates swear, but only to "the King's heir, as the law shall be", and the clerk writes that in the roll instead. Everyone knows what it means.
        effects: [ { set: flag.h_c_estates_divided } ]
        next: h_pc09_illness
    - id: law
      text: "Ask them to write it into law: the eldest child, son or daughter, for ever."
      check: { attr: presence, skill: diplomacy, difficulty: 8, audience: nobles, mods: [ { if: flag.h_c_querec_swore, add: 1, label: Quérec has sworn }, { if: flag.h_c_largesse, add: 1, label: the salt towns remember }, { if: rel.mahaut_armance.affection >= 2, add: 1, label: the Armance votes with its duchess } ] }
      success:
        text: |
          It takes three days. On the third day the Estates of the West write it: the crown to pass to the eldest child of the last wearer, son or daughter. Hervé de Penhoët votes against, quietly, and asks for his vote to be recorded. It is. You have just settled a question for a hundred years, or started one.
        effects: [ { set: flag.h_c_law_written }, { set: flag.h_c_estates_swore }, { add: { counter.penhoet: -1 } } ]
        next: h_pc09_illness
      failure:
        text: |
          The Estates will not write a law for a hundred years at the end of a long day for a King who is plainly tired. They swear to "the King's heir, as the law shall be", and adjourn. Hervé de Penhoët, on his way out, says to the Armance bench, "As the law shall be," as if tasting it.
        effects: [ { set: flag.h_c_estates_divided }, { add: { counter.penhoet: 1 } } ]
        next: h_pc09_illness
    - id: no
      text: Ask them nothing. A crowned king crowns his heir.
      effects: [ { set: flag.h_c_no_estates } ]
      text_after: |
        You thank them for coming, and feast them, and send them home, and ask them for nothing at all. The bishops are puzzled. The burgesses are relieved. {house.querec_short} goes home to the marsh, smiling, because a question nobody asks is a question somebody else will.
      next: h_pc09_illness

- id: h_pc09_illness
  chapter: prologue
  title: The Illness
  frames: [free]
  on_enter: [ { catch_up: { year: 52, season: winter } } ]
  text: |
    It comes at Christmas, with the great hall full and the boar's head on the table. A shaking first, that you put down to the cold. Then a heat, and a weight on your chest like a man kneeling on it.

    You wake in your own bed with no memory of getting there. Mahaut is sitting beside it in her furs with a book of accounts on her knee, and turns a page, and looks up when you move, and you see on her face what you look like. Jehanne is asleep at the foot of the bed in a nest of cloaks, with her shoes on.

    The fever goes in a week. The weakness does not. You cannot get up the stairs without stopping. You cannot sit a horse.

    "Well," says {house.companion_first}, from the door. "You look like a thing the dogs dug up."

    "There is a Sarenzan physician in the town," says Mahaut, "who cured a bishop. There is the relic of Saint Gildas at the abbey. And there is lying still and doing what you're told." She closes the book. "I would choose the third. You won't."
  choices:
    - id: physician
      text: Send for the Sarenzan. (£10)
      requires: "res.coin >= 2400"
      check: { attr: endurance, difficulty: 3 }
      success:
        text: |
          The Sarenzan comes with a box of glass and a face like a heron, and bleeds you, and purges you, and charges you ten pounds. By Lady Day you can walk the length of the gallery. Whether it was him, nobody can say.
        effects: [ { add: { res.coin: -2400, attr.strength: -1 } } ]
        next: h_pc10_crowning
      failure:
        text: |
          The Sarenzan bleeds you and purges you and charges you ten pounds, and you are weaker after him than before. He says it is the disease leaving. Mahaut says it is ten pounds leaving.
        effects: [ { add: { res.coin: -2400, attr.strength: -1, attr.endurance: -1 } } ]
        next: h_pc10_crowning
    - id: relic
      text: Have the saint's finger brought from the abbey.
      check: { attr: endurance, difficulty: 3, mods: [ { if: counter.household >= 2, add: 1, label: the whole palace prays for you } ] }
      success:
        text: |
          The prior brings it himself, in a silver box the size of a pear, and the whole household kneels in your chamber. You feel nothing. A week later the weight lifts. The prior says it was the saint.
        effects: [ { add: { attr.strength: -1 } } ]
        next: h_pc10_crowning
      failure:
        text: |
          The prior lays the saint's finger on your chest, and the household prays, and nothing happens, which is what usually happens. You send the abbey a cask of wine anyway.
        effects: [ { add: { attr.strength: -1, attr.endurance: -1 } } ]
        next: h_pc10_crowning
    - id: rest
      text: Lie still and do as Mahaut says, for once.
      effects: [ { add: { counter.household: 1, attr.strength: -1, attr.endurance: -1, rel.mahaut_armance.affection: 1 } } ]
      text_after: |
        You lie still. Mahaut runs the kingdom from a chair beside your bed for the whole of Lent, and runs it well, and tells you about it every evening whether you want to hear or not. It is the first winter in thirty years you have not ridden out. The West, you notice, does not fall down.
      next: h_pc10_crowning

- id: h_pc10_crowning
  chapter: prologue
  title: The Crowning
  frames: [free]
  on_enter: [ { catch_up: { year: 53, season: spring } } ]
  text: |
    Lady Day, the new year. You sit in the gallery in a chair with a fur over your knees, and you know.

    You will live. The physicians say so, and you believe them, and you can feel it: you will sit in the sun for years yet. But you will not ride to the march again, or sit a whole day's assize, or hold a great council by the force of standing up in it. The kingdom cannot wait for you to get better. It can only wait for Jehanne to grow up.

    The kings of Valdrenne used to do it this way, in the old days, when they were afraid: crown the heir while the father lived, so that there was never a day without a crowned head. Jehanne is nine. [if family.children >= 2]Her brothers and sisters are younger.[/if] Mahaut would govern for her. You would be there, behind the throne, for as long as you last.

    [if flag.h_c_estates_swore]The Estates have sworn to her. That will help.[elif flag.h_c_estates_divided]The Estates swore to "the King's heir, as the law shall be". That will not help.[else]Nobody has asked the Estates anything. That may help, or not.[/if] Bishop Évrard of Saint-Lys, who crowned you, is a hundred and one, and has sent word that he would like to crown one more, if it is soon.
  choices:
    - id: cathedral
      text: Crown her at Saint-Lys, before the Estates and all the West.
      effects: [ { set: flag.h_c_crowned_cathedral }, { set: flag.h_c_junior }, { add: { counter.favour: 2, counter.household: 1 } }, { step_down: junior_crown } ]
      text_after: |
        They carry you into the cathedral in a chair, and you stand for the crowning, because you will not sit for it. Old Évrard sets a small crown on Jehanne's head with hands that shake so badly two canons have to steady them, and the oldest man in the West crowns the youngest, and the nave roars. Jehanne does not cry, and does not smile, and does not drop the sceptre, which is heavier than she is. Afterwards, in the sacristy, she is sick into a basin, and then asks for her dinner.
      next: h_pc11_council
    - id: chapel
      text: Crown her quietly in the palace chapel, and tell the West after.
      effects: [ { set: flag.h_c_crowned_chapel }, { set: flag.h_c_junior }, { add: { counter.household: 1, counter.favour: -1 } }, { step_down: junior_crown } ]
      text_after: |
        Évrard comes to the palace in a litter and crowns her in the chapel with the household packed in to the door and the guard outside it. Fewer people see it. Fewer people can object. A great many people, by midsummer, are saying that a crown given in a cupboard can be taken back in one.
      next: h_pc11_council
    - id: council
      text: Crown her, and name her council in the same hour, so no one else can.
      effects: [ { set: flag.h_c_crowned_council }, { set: flag.h_c_junior }, { set: flag.h_will_conditions }, { add: { counter.household: 2, rel.mahaut_armance.affection: -1 } }, { step_down: junior_crown } ]
      text_after: |
        At Saint-Lys, with the crown still settling on Jehanne's head, the chancellor reads out the council of her minority, by your order: the Queen as regent, and beside her your own men, four of the old company's sons, two bishops, and nobody from Quérec. Mahaut hears her own name first and the rest after, and her face does not move at all.
      next: h_pc11_council

# ---- the second half: Jehanne, the junior queen (years 53-55) ----

- id: h_pc11_council
  chapter: prologue
  title: The Council
  checkpoint: true
  card: { title: The Heir, epigraph: "Woe to the land whose king is a child, said the preacher. He had not met this one." }
  frames: [free]
  on_enter: [ { catch_up: { year: 53, season: summer } } ]
  text: |
    You are nine years old, and Queen of the West, and the chair in the council chamber was made for your father. Your feet do not reach the floor. Somebody has put a footstool under them, tactfully, and you would like to kick it across the room.

    Your mother sits at the other end of the table, and governs. She is the regent. That is a word you have learned this spring, along with "minority", "the Great Seal", and "Your Grace", which is what the chancellor calls you now, every time, as if checking it still works.

    Your father is in his rooms along the gallery. He is better. He sits in the sun in the mornings, and you go and see him after council, and he asks you what they said, and laughs.

    Today the council is talking about Quérec. [if flag.h_c_querec_defiant]He has not sworn to you, and has not come to your crowning, and is building a wall round his house in the marsh.[else]He swore to you, and kissed your hand, and has sent a letter congratulating your mother on her regency. The council thinks that is worse.[/if] They talk across you, the way grown men talk across a child at dinner. Nobody asks you anything.
  choices:
    - id: speak
      text: Ask a question, out loud, in the middle of it.
      check: { attr: presence, skill: courtesy, difficulty: 2, mods: [ { if: flag.h_heir_court, add: 1, label: your mother's lessons }, { if: flag.h_heir_kept, add: 1, label: you sat through your father's assizes } ] }
      success:
        text: |
          "What does Quérec want?" you say. It comes out loud. The council stops. The chancellor opens his mouth and shuts it. Your mother looks at you for a long moment, and then says, "That is the question, my lords. Answer the Queen." They try. None of them knows. You see your mother see that.
        effects: [ { add: { counter.shadow: -1, rel.mahaut_armance.respect: 1 } }, { set: flag.h_c_spoke_council } ]
        next: h_pc12_regency
      failure:
        text: |
          "What does Quérec want?" you say, and it comes out as a squeak, and the old lord of Coatmen laughs before he can stop himself. "A great deal, Your Grace," says the chancellor kindly, and goes on. Your face is hot for the rest of the council. Your mother does not look at you, which is a kindness, and you hate it.
        effects: [ { add: { counter.shadow: 1 } } ]
        next: h_pc12_regency
    - id: count
      text: Say nothing, and count who agrees with whom.
      effects: [ { set: flag.h_counted } ]
      text_after: |
        You sit on your hands and listen. By the end of council you know that the chancellor agrees with your mother when she is looking, that the Bishop of Saint-Lys agrees with whoever spoke last, and that old Coatmen agrees with nobody and is the only one who has been to the marsh. You tell your father, after. He laughs until he coughs. "Good," he says. "Again tomorrow."
      next: h_pc12_regency
    - id: father
      text: Go to your father after, and ask him what to say.
      effects: [ { add: { counter.shadow: 2, heir.bond: 1 } } ]
      text_after: |
        He tells you. He tells you for an hour, in the sun, everything he knows about Quérec and his father and the marsh and the salt. It is wonderful, and you remember all of it, and the council hears it from you the next day and knows exactly whose words they are.
      next: h_pc12_regency

- id: h_pc12_regency
  chapter: prologue
  title: The Regency
  frames: [free]
  on_enter: [ { catch_up: { year: 53, season: autumn } } ]
  text: |
    After Michaelmas your mother sends for you to her own chamber, with only her old nurse present, the way she once sent for your father when they were deciding something nobody could know yet.

    "The council," she says, "is your father's men, and my men, and they hate each other quietly, which is the best kind of council. I want to change it." She puts a list in front of you. Half the names on it are Armance: her people, her cousins, her grandmother's old captains. "These men held the Armance for a woman through a war. Your father's men put a crown on a man. I think you need the first kind more."

    [if flag.h_c_crowned_council]Your father named the council himself, at your crowning, so that nobody could change it. Your mother has read his list. She has crossed out four names.[/if]

    "Why are you asking me?" you say.

    "Because you are the Queen," she says, "and one day you will remember who I asked."
  choices:
    - id: armance
      text: Give her the Armance council she wants.
      effects: [ { set: flag.h_c_council_armance }, { add: { rel.mahaut_armance.affection: 2, counter.household: -1, counter.shadow: -1 } } ]
      text_after: |
        You sign it with the small seal they have made for you, which you still have to press with both hands. Within a month the council is half Armance. Your father hears of it, and says nothing, and the next morning in the sun he asks you why. You tell him. He nods, slowly. "She's right," he says. "Don't tell her I said so."
      next: h_pc13_rising
    - id: father
      text: Keep your father's men. They made the crown.
      effects: [ { set: flag.h_c_council_old }, { add: { counter.household: 1, counter.shadow: 1, rel.mahaut_armance.affection: -2 } } ]
      text_after: |
        "My father's men," you say. Your mother looks at you as if you were someone she has just met. "Very well," she says, and takes the list back, and puts it in the fire. She is perfectly kind to you for the rest of the year, and you never again find her alone in her chamber when you knock.
      next: h_pc13_rising
    - id: both
      text: Take half her names, and keep half his.
      check: { attr: presence, skill: diplomacy, difficulty: 2, mods: [ { if: flag.h_counted, add: 1, label: you know who agrees with whom }, { if: flag.h_heir_court, add: 1, label: your mother taught you this } ] }
      success:
        text: |
          You go through the list with her, name by name, and keep the ones who have been to the march and the marsh, and lose the ones who only talk. She argues. You argue back. At the end she sits back and looks at you and says, "Your father would have kept all his," and you cannot tell whether she is pleased.
        effects: [ { set: flag.h_c_council_mixed }, { add: { rel.mahaut_armance.respect: 2, counter.shadow: -1 } } ]
        next: h_pc13_rising
      failure:
        text: |
          You try to keep half of each, and keep the wrong half of both. Within a season the Armance men and your father's men have stopped speaking to each other in council, and speak instead to you, separately, in corridors.
        effects: [ { set: flag.h_c_council_mixed }, { add: { counter.household: -1 } } ]
        next: h_pc13_rising

- id: h_pc13_rising
  chapter: prologue
  title: The Marsh
  frames: [free]
  on_enter: [ { catch_up: { year: 53, season: winter } } ]
  text: |
    [if flag.h_c_querec_defiant]At Candlemas {house.querec} rises. He takes the crown's salt-works at the edge of the marsh, and the toll bridge, and hangs a banner from the bridge-tower with a message on it in letters a yard high: NO WOMAN'S CROWN.[elif flag.h_c_querec_bought]At Candlemas the oath {house.querec_short} sold you turns out to have been the kind you buy.[else]At Candlemas the oath {house.querec_short} swore in the great hall, with your guard along the wall, turns out to have been worth what such oaths are worth. He takes the crown's salt-works at the edge of the marsh, and the toll bridge, and says in a letter to every lord in the West that he swore to a King, not to a child and her mother.[/if]

    Forty marsh lords are with him, and two hundred men, and a ship from Valdrenne has been seen off the salt flats, though nobody can say whose.

    The council meets for three days. The constable wants to march at once, in the frost. The chancellor wants to treat. Your mother listens to both and says nothing, which you have learned means she has decided and is waiting to see if anyone agrees.

    On the third day she turns to you. "It is your crown he has hung on that bridge," she says. "What do you want?"
  choices:
    - id: march
      text: March, and ride with the host yourself, under your own banner.
      check: { attr: presence, skill: riding, difficulty: 3, audience: knights, mods: [ { if: flag.h_heir_kept, add: 1, label: you rode with your father }, { if: flag.h_heir_manor, add: 1, label: the Armance knows you } ] }
      success:
        text: |
          They put you on a grey pony in a cloak of the royal colours, in the middle of six hundred men, and the constable does the rest. At the toll bridge the marsh men see the child queen's banner coming over the causeway in the frost and lose their nerve, half of them, before anyone has drawn. {house.querec_short} holds the tower for two days, and then asks for terms. Your mother gives him the terms, in your name, and makes you watch her do it.
        effects: [ { set: flag.h_c_rising_crushed }, { add: { counter.household: 2, counter.shadow: -1 } } ]
        next: h_pc14_question
      failure:
        text: |
          You ride out, and on the third day in the frost you take a fever, and they carry you back to Lannec in a litter, and the host goes on without you. The constable takes the bridge in a week, and {house.querec_short} gets away into the marsh with the best of his men. People say the Queen came home in a litter. They say it kindly, mostly.
        effects: [ { set: flag.h_c_rising_open }, { add: { counter.shadow: 1 } } ]
        next: h_pc14_question
    - id: treat
      text: Treat with him. Offer a pardon for the bridge.
      effects: [ { set: flag.h_c_rising_treated }, { add: { counter.household: -1, counter.favour: 1 } } ]
      text_after: |
        The chancellor goes to the marsh with a pardon in your name and comes back with an answer in {house.querec_short}'s: he will give back the bridge and the salt-works, and keep his men, and not kneel. The council takes it. The banner comes down from the tower. Everyone remembers what it said.
      next: h_pc14_question
    - id: wait
      text: Wait for spring, and let him freeze in his marsh.
      effects: [ { set: flag.h_c_rising_open } ]
      text_after: |
        You wait. He does not freeze. By Lady Day the marsh is his, the salt goes to Valdrenne by sea, and three more lords have quietly stopped paying the crown's tithe. The constable says, in council, that a king would have marched. He says "a king" and looks at the ceiling.
      next: h_pc14_question

- id: h_pc14_question
  chapter: prologue
  title: The King's Question
  frames: [free]
  on_enter: [ { catch_up: { year: 54, season: spring } } ]
  text: |
    In the spring your father is well enough to sit in the garden at the foot of the palace wall, in the sun, with a blanket and a cup of wine he is not supposed to have.

    You sit with him most mornings, after council. Today he talks. He has not talked like this in your life. About where he came from: {house.origin}, with nothing, in a year nobody remembers. About your mother, the garden at Lannec, the hawk on her fist that she did not need. About the war, and the bridge, and the Estates, and the morning they made him king and he stood in the hall and could not feel his own feet.

    Then he stops, and looks at you, and you can see him decide to say it.

    "You're ten," he says. "You've had a year of it. Bridges and councils and your mother." He takes your hand. His is dry and light. "Tell me. Are you going to be me?"
  choices:
    - id: be_him
      text: "\"I'll try to be.\""
      effects: [ { set: flag.h_answer_you }, { add: { counter.shadow: 3 } } ]
      text_after: |
        He smiles, and you cannot tell whether it is because he is pleased or because he is sorry for you. "Don't try too hard," he says. "I wasn't much good at it either. Ask your mother."
      next: h_pc15_bishop
    - id: be_myself
      text: "\"No. I'm going to be me.\""
      effects: [ { set: flag.h_answer_self }, { add: { counter.shadow: -2 } } ]
      text_after: |
        [if head.bond >= 1]He laughs, which hurts him, and grips your hand. "Good," he says. "Good. One of me was plenty."[else]He looks at you for a long moment. "Well," he says at last. "We'll see." Then he closes his eyes in the sun, and you cannot tell whether that was a blessing.[/if]
      next: h_pc15_bishop
    - id: silent
      text: Say nothing, and hold his hand.
      effects: [ { set: flag.h_answer_silent } ]
      text_after: |
        You hold on. After a while he says, "Yes. That's an answer too," and closes his eyes in the sun, and you sit with him until the bell goes for Sext.
      next: h_pc15_bishop

- id: h_pc15_bishop
  chapter: prologue
  title: The Bishop of Saint-Lys
  frames: [free]
  on_enter: [ { catch_up: { year: 54, season: summer } } ]
  text: |
    Bishop Évrard of Saint-Lys dies at midsummer, at a hundred and two, in the middle of the Office, between one psalm and the next. He crowned your father. He crowned you. The whole West comes to bury him, and you stand at the front of the nave in black with your mother, and try not to look at the place where he set the crown on your head.

    Then the chapter of Saint-Lys must choose a new bishop, and the crown has a voice in the choosing, and so, everyone knows, does Cordelle, and so does Wendmere.

    There are three names. Your mother's confessor, a quiet Armance canon who has never once disagreed with her. Your father's old chancellor-clerk, Master Anselm, who wrote the patent of the crown and knows where everything is buried. And the Valdrennish candidate, a nephew of the Archbishop of Cordelle with a beautiful voice, who comes with a letter from King Amaury and a promise.
  choices:
    - id: armance
      text: Speak for your mother's confessor.
      effects: [ { set: flag.h_c_bishop_armance }, { add: { rel.mahaut_armance.affection: 1 } } ]
      text_after: |
        The chapter chooses him, with your voice and your mother's behind him. He is a good man, and gentle, and will bless whatever law the Estates write, so long as your mother wants it written.
      next: h_pc16_acclamation
    - id: anselm
      text: Speak for Master Anselm, who knows where everything is.
      effects: [ { set: flag.h_c_bishop_anselm }, { add: { counter.shadow: 1, counter.household: 1 } } ]
      text_after: |
        Master Anselm becomes Bishop of Saint-Lys, the first born in the West, and comes to see your father in the garden the day after, and they laugh together for an hour about things neither will tell you. He will bless what the crown wants. He will also remember what the crown owes him.
      next: h_pc16_acclamation
    - id: valdrenne
      text: Let the Valdrennish candidate have it, and take Amaury's promise.
      effects: [ { set: flag.h_c_bishop_valdrenne }, { add: { counter.favour: -1, rel.mahaut_armance.affection: -1 } } ]
      text_after: |
        The chapter chooses the beautiful voice. Amaury's promise is peace on the march for five years, and it comes, more or less. The new bishop sings Mass at Saint-Lys better than anyone ever has, and writes to Cordelle every week.
      next: h_pc16_acclamation

- id: h_pc16_acclamation
  chapter: prologue
  title: The Acclamation
  frames: [free]
  on_enter: [ { catch_up: { year: 55, season: spring } } ]
  text: |
    Lady Day, year 55. You are eleven. The Estates of the West meet at Lannec to acclaim you, in person, as their Queen: not as a child with a crown on, but as the Queen they will obey.

    The hall is full. Your father sits at the side of the dais in a chair with arms, where everyone can see him and nobody can say he is ruling. Your mother stands behind your chair, which is the old King's chair, with the footstool gone, because you have grown. [if flag.h_c_rising_open]There are empty places on the marsh lords' bench, and everyone looks at them.[elif flag.h_c_rising_crushed]{house.querec_short} is on the marsh lords' bench, under guard, and will kneel today whether he likes it or not.[else]{house.querec_short} is on the marsh lords' bench, with his men, and has not decided what he will do.[/if]

    The chancellor has written you a speech. It is good, and long, and in Latin at the end. Your mother has read it and said nothing, which means she does not like it. Your father has read it and said, "Say what you like. They'll remember that."

    The hall goes quiet. It is your turn.
  choices:
    - id: written
      text: Say the speech the chancellor wrote, every word.
      effects: [ { set: flag.h_oath_plain }, { add: { counter.favour: 1 } } ]
      text_after: |
        You say it, every word, the Latin too. It takes a quarter of an hour. The Estates acclaim you, and mean it, and some of the bishops weep. Afterwards an old lord says to his neighbour, loud enough, "Well, she can learn a speech," and you decide to take it as kindly meant.
      next: h_bc01_homage
    - id: own
      text: Put the speech down, and say something of your own.
      check: { attr: presence, skill: courtesy, difficulty: 3, audience: nobles, mods: [ { if: flag.h_c_spoke_council, add: 1, label: you have spoken out before }, { if: flag.h_c_rising_crushed, add: 1, label: they saw you at the bridge } ] }
      success:
        text: |
          "I am eleven," you say. "My father was nobody, and my mother's grandmother held the Armance against a king. I don't know which of them I'll be. You'll find out when I do." There is a silence like a held breath. Then your father laughs out loud from his chair, and the hall laughs with him, and then it roars. Your mother puts her hand on your shoulder from behind, and leaves it there.
        effects: [ { set: flag.h_oath_reserved }, { add: { counter.favour: 2, counter.shadow: -1 } } ]
        next: h_bc01_homage
      failure:
        text: |
          You put the speech down, and say, "I am eleven," and then cannot think what comes next, and the silence goes on, and on. Your mother says, quietly, "Long live the Queen," and the hall takes it up, and it is over, and you are acclaimed. Your face burns until Vespers.
        effects: [ { set: flag.h_oath_reserved }, { add: { counter.shadow: 1 } } ]
        next: h_bc01_homage
    - id: mother
      text: Let your mother speak for you.
      effects: [ { set: flag.h_oath_bought }, { add: { rel.mahaut_armance.affection: 1, counter.shadow: 1 } } ]
      text_after: |
        You stand, and your mother speaks, in the voice she used at the Estates when she chose your father, and the hall acclaims the Queen, and some of them, you notice, are looking at your mother when they do it.
      next: h_bc01_homage

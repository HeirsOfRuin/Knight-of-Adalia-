# Chapter 2, part 2: the Lisonne and the defeat at Grisolles (battle 1).
# High summer to autumn, year 21. Age 20.
# Vervais does not rise. The army turns back for the Armance and is caught
# crossing the Aube at Grisolles. Grisolles is always a defeat; his choices
# decide what he saves from it.

- id: c2_looms
  chapter: ch2
  title: The Lisonne
  text: |
    The army reaches the Lisonne at Lammas, three weeks out of Port-Haudry, footsore and rich and hungry, and looks across the river at Vervais.

    Nobody is waiting for it. The far bank is meadow, and a road, and on the road, where it comes down to the ferry, a row of gibbets. There are eleven men hanging on them. The crows have been at them a while.

    [break]

    The news comes over with a ferryman that evening, and goes through the camp faster than the flux. The guild masters of the weaving towns swore to rise for King Aldred. Their Duke, Lothaire of Vervais, learned of it. King Amaury has remitted the salt tithe on Vervais for ten years and promised the Duke's son a royal bride, and the Duke has hanged the guild masters to show he can be trusted. The looms of Vervais will wait for their wool a while longer.

    The Margrave of the Ostmark, who took Sarenzan money to march on Valdrenne from the east, has not marched.

    The Constable of Valdrenne, Gaucelin de Brésy, has twenty thousand men a day's march to the south, between the army and the Armance.

    [if npc.roger_tallis.follower]"One out of three," says Roger Tallis. "I said so. Nobody listens to a man who's been right before."[/if]
  choices:
    - id: council
      text: Go with your master to the edge of the King's council, and listen.
      tags: [diplomacy]
      check: { attr: presence, skill: courtesy, difficulty: 3, audience: nobles }
      success:
        text: |
          You hold a horse outside the King's pavilion for three hours, close enough to hear. The Earl of Carrow wants to cross into Vervais anyway and take the towns by force. The Marshal wants to go back to the Armance while there is an army left to take. The King lets them shout until they run out of breath. Then he asks how many days of bread there are. Somebody tells him. "Then we go back," he says. "By the Aube. Quickly."

          You know the road before the army does. That will matter.
        effects: [ { set: flag.c2_heard_council }, { add: { skill.tactics: 1 } } ]
        next: c2_grisolles_eve
      failure:
        text: A household knight with a white staff moves you back out of earshot, and then further. You learn what the council decided the next morning, with everyone else, when the army turns round.
        next: c2_grisolles_eve
    - id: gibbets
      text: Take the ferry across, and cut the hanged men down.
      tags: [piety]
      text_after: |
        The ferryman takes you over for a penny and waits. It is a long afternoon's work with a borrowed ladder and Davy's knife. A woman comes down the road from the nearest village while you are at it and stands watching, and then fetches a cart and a priest. She does not speak to you. The priest asks, in Valdrennish, whose man you are.

        [if flag.c2_vaudrey_held || flag.c2_breval_ransomed]You tell him. He nods slowly, as if he had heard the name before.[else]You tell him. He writes it down.[/if]
      effects: [ { set: flag.c2_cut_down_weavers }, { add: { rep.piety: 1, rep.valdrenne: 1, rep.commons: 1 } } ]
      next: c2_grisolles_eve
    - id: men
      text: Tell your men the truth. The road back will be harder than the road here.
      tags: [allies]
      text_after: |
        They take it better than you expect. [if npc.simkin_barre.follower]Simkin Barre says he never thought much of Vervais anyway. [/if][if npc.jankin_rooke.follower]Rooke asks how far it is to the sea. You tell him. He nods and goes to see to his feet.[/if] By the time the army turns west, your men have their boots mended, their loot sewn into their jacks, and three days of bread each that you made them carry. Other companies laugh at the weight.
      effects: [ { set: flag.c2_men_warned }, { add: { rel.davy_ludd.loyalty: 1, rel.jankin_rooke.loyalty: 1, rel.simkin_barre.loyalty: 1, rel.roger_tallis.respect: 1, rel.wat_coker.loyalty: 1, rel.perkin_dyer.loyalty: 1, rel.gib_shawe.loyalty: 1, rel.dickon_laund.loyalty: 1 } } ]
      next: c2_grisolles_eve

- id: c2_grisolles_eve
  chapter: ch2
  title: The Aube
  text: |
    It takes the army nine days to march back the way it came, through country it has already eaten bare, with the Constable's horsemen on every hill. On the ninth evening it reaches the river Aube at Grisolles.

    The Aube is not wide, but it is deep and fast and runs between marshes, and at Grisolles there is one stone bridge, eight arches long and wide enough for a single cart. Below it, the villagers say, there is a ford for men on foot, when the river is low. The river is not low.

    [break]

    The King's orders are to cross at first light: the van, then the King, then the baggage, then the rearguard. [if alias.master == walter_pryce]The Earl of Carrow's company has the rearguard.[else]The rearguard is the Earl of Carrow's men and Lord Ravell's.[/if] So you will be among the last across, with the Constable behind you somewhere in the dark.

    "Rearguard," says an old man-at-arms by your fire, spitting into it. "Last over the bridge. Last to eat, last to sleep, first to get it in the arse. Always the same."

    There is a mist coming up off the marshes. By midnight you cannot see the river from the road.
  choices:
    - id: sleep
      text: Sleep, if you can.
      text_after: You lie in the wet grass by the horses and do not sleep. Nobody near you sleeps. [if npc.davy_ludd.follower]Davy talks until you tell him to stop, and then lies awake in silence, sniffing, pretending he has a cold.[/if] Somewhere out in the mist, far off, a horse whinnies, and is answered.
      next: c2_grisolles
    - id: men
      text: Go round your men and see they are ready to move in the dark.
      tags: [allies]
      text_after: It is a small thing. Every man in your following eats, packs, and lies down in his boots with his gear on, knowing that you checked it. In the morning yours are the first in the rearguard on their feet.
      effects: [ { set: flag.c2_grisolles_ready }, { add: { rel.jankin_rooke.loyalty: 1, rel.simkin_barre.loyalty: 1, rel.roger_tallis.loyalty: 1, rel.davy_ludd.loyalty: 1, rel.wat_coker.loyalty: 1, rel.perkin_dyer.loyalty: 1, rel.gib_shawe.loyalty: 1, rel.dickon_laund.loyalty: 1 } } ]
      next: c2_grisolles
    - id: scout
      text: Go down the river in the dark and find the ford for yourself.
      tags: [cunning]
      check:
        attr: wits
        skill: woodcraft
        difficulty: 3
        mods: [ { if: flag.c2_knows_country, add: 1, label: you know this country } ]
      success:
        text: Half a mile down, where the marsh gives way to gravel, there are posts in the water marking a way across. Chest-deep, in this flood. Fast. But it is there. You wade it to the middle and back to be sure, and come back soaked and shaking and certain.
        effects: [ { set: flag.c2_found_ford }, { add: { skill.woodcraft: 1 } } ]
        next: c2_grisolles
      failure:
        text: You find a great deal of marsh, and a ditch that you fall into, and no ford. You come back soaked to the neck and no wiser.
        next: c2_grisolles

- id: c2_grisolles
  chapter: ch2
  title: The Mist at Grisolles
  checkpoint: true
  on_enter: [ { meet: gaucelin_brese } ]
  text: |
    By Terce the van and the King are across. By Sext the baggage is on the bridge, one cart at a time, with the drivers screaming at the oxen. The rearguard stands on the near bank in the mist, waiting its turn.

    Then the mist lifts, the way a curtain lifts, all at once.

    [break]

    "Christ," says the man next to you, quite softly. "Christ, look."

    They are three hundred paces away, and they are on foot. That is the first thing anyone notices, because nobody has ever seen the Valdrennish chivalry on foot. Thousands of men-at-arms in plate, in a block as deep as a church is long, coming on at a walk. In front of them, Sarenzan crossbowmen behind great painted shields as tall as a man, set down and lifted and set down again.

    Away on the right, along the river, their horse is going at a canter for the bridge and the baggage.

    The archers start shooting. You hear the arrows hit the painted shields like hail on a roof. The block does not stop.
  choices:
    - id: front
      text: Take your place in the line of men-at-arms and meet them.
      tags: [martial]
      lethal: true
      warn: Plate against mail, and they outnumber the rearguard four to one. Without armour, or carrying a wound, you will not live through the first shock.
      check:
        attr: strength
        skill: arms
        difficulty: 5
        mods:
          - { if: armour >= 2, add: 2, label: your harness }
          - { if: armour == 1, add: 1, label: your jack }
          - { if: trait.veteran, add: 1, label: you have stood in a fight before }
          - { if: flag.c2_grisolles_ready, add: 1, label: your men were ready }
          - { if: retinue >= 4, add: 1, label: your following at your shoulder }
          - { if: flag.c1_passed_test, add: 1, label: you passed Sir Bertram's test in harness }
          - { if: item.holy_ampulla, add: 1, label: "Saint Ebba's water, or your faith in it" }
      success:
        text: |
          They hit the line like a falling wall. You do not remember most of it: the weight of them, the noise, a face behind a visor close enough to smell. You remember that the bit of line you are standing in does not break, not for a long stretch of the worst morning of your life, while the bits on either side of it give ground. Long enough for half the carts to get over the bridge.

          It is not a victory. Nothing at Grisolles is. But the Earl of Carrow, who saw it from his horse, asks your name afterwards.
        effects: [ { set: flag.c2_grisolles_held }, { add: { res.renown: 2, rep.knights: 1 } }, { trait: +veteran } ]
        next: c2_grisolles_rout
      partial:
        text: The line holds where you are, for a while. A poleaxe glances off your shoulder and opens it to the bone, and the man to your left goes down and does not get up.
        effects: [ { set: flag.c2_grisolles_held }, { add: { res.renown: 1 } }, { injury: arrow_wound }, { casualties: { men: 1, named: 1, spare: [ davy_ludd ] } }, { trait: +veteran } ]
        next: c2_grisolles_rout
      failure:
        text: "[if armour >= 1 && !injured]The block hits you and goes over you. You are on your back in the mud with a man standing on your chest, and then he is gone, past you, and your men are dragging you backward by the arms.[else]The block hits you and goes over you, and you are under their feet in the mud at Grisolles, and nobody stops.[/if]"
        effects:
          - if: [ armour >= 1, "!injured" ]
            then: [ { injury: crushed_ribs }, { casualties: { men: 1, named: 1, spare: [ davy_ludd ] } } ]
            else: [ { die: "Trampled under the Valdrennish foot in the rearguard at Grisolles, aged {age}." } ]
        next: c2_grisolles_rout
    - id: archers
      text: Get your archers shooting over the shields, at the crossbowmen as they wind.
      tags: [martial, allies]
      check:
        attr: presence
        skill: command
        difficulty: 4
        mods:
          - { if: npc.jankin_rooke.follower, add: 1, label: Rooke does not miss }
          - { if: npc.will_cobb.friend, add: 1, label: Cobb's archers beside you }
          - { if: background == archer, add: 1, label: you were raised on this }
      success:
        text: High, so they drop. The crossbowmen have to stand up from behind their shields to wind, and when they stand up, your archers are waiting. For as long as the arrows last, the crossbows on your front go quiet. It buys the line a little time. It costs the archers every arrow they have.
        effects: [ { add: { res.renown: 1, rep.commons: 1 } }, { trait: +veteran } ]
        next: c2_grisolles_rout
      failure:
        text: The crossbowmen know this trick better than you do. They wind behind the shields and come up shooting, and your archers lose three men in the first flight and the rest fall back to the river.
        effects: [ { casualties: { men: 1, named: 0 } } ]
        next: c2_grisolles_rout
    - id: baggage
      text: Mount up and ride for the bridge, where their horse is going for the baggage.
      tags: [martial]
      check:
        attr: agility
        skill: riding
        difficulty: 4
        mods:
          - { if: res.horses >= 2, add: 1, label: a good horse }
          - { if: background == servant, add: 1, label: you were raised in a stable }
          - { if: flag.c1_rode_quintain, add: 1, label: Sir Bertram's quintain }
      success:
        text: |
          You get there with a handful of others as the Valdrennish riders reach the carts. It is a scramble of horses and oxen and screaming drivers in a lane between ditches. You hold the head of the bridge long enough for a dozen carts to get over, among them [if alias.master == walter_pryce]Sir Walter's[else]your master's[/if] and your own.

          The rest of the baggage is lost: the King's plate, the King's tents, and the iron-bound chest that holds the army's pay.
        effects: [ { set: flag.c2_saved_baggage }, { add: { res.renown: 1, rel.@master.respect: 2, res.supplies: 1 } } ]
        next: c2_grisolles_rout
      failure:
        text: You are too late, and too few. The Valdrennish horse are among the carts before you reach them. You lose your own baggage, and nearly your horse.
        effects: [ { add: { res.supplies: -1, res.coin: -60 } } ]
        next: c2_grisolles_rout
    - id: master
      text: Stay at your master's side, wherever he goes.
      tags: [allies]
      text_after: |
        [if alias.master == hamon_darrell]Sir Hamon is too old for this, and knows it, and goes into the line anyway. You stand in front of him as much as he will let you.[elif alias.master == ancel_brome]Sir Ancel goes into the line like a man walking into his own hall, and you go in beside him. He does not speak once. Neither of you is hurt, for now.[elif alias.master == thurstan_ravell]Lord Ravell sits his horse behind the line with his banner, giving orders nobody can hear. You hold his bridle, and the noise comes closer.[else]Sir Walter Pryce looks once at the block coming on, says something filthy, and starts quietly moving his own men toward the bridge before anyone has given the order. You go with him.[/if]
      effects: [ { add: { rel.@master.affection: 2 } }, { set: flag.c2_grisolles_with_master }, { trait: +veteran } ]
      next: c2_grisolles_rout

- id: c2_grisolles_rout
  chapter: ch2
  title: The Bridge
  text: |
    The rearguard begins to break from the ends inward, the way a rope frays.

    Word comes down the line, shouted from man to man: the King's engineers are at the bridge with picks and a barrel of pitch. When the last of the baggage is over, or when the Valdrennish get too close, whichever is first, they will break the middle arch. Anyone on the near bank after that is on the near bank for good.

    [break]

    [if npc.aymer_ravell.friend]You see Aymer Ravell,[if flag.c1_aymer_pie] who shared a stolen pie with you on your first night at Ravell,[/if] on foot, his horse gone, in a knot of his father's men who are fighting back to back by a burning cart.[elif npc.will_cobb.friend]You see Will Cobb and the last of his archers out on the right, cut off by the river, with Valdrennish horse between them and the bridge.[/if]

    [if alias.master != walter_pryce][if flag.c2_grisolles_with_master]Your master is beside you, and the bridge is four hundred paces behind.[else]You cannot see your master's banner. The last you saw of it, it was going down into the press.[/if][/if]
  choices:
    - id: men
      text: Keep your own men together and get them over the bridge in order.
      tags: [allies]
      check:
        attr: presence
        skill: command
        difficulty: 4
        mods:
          - { if: flag.c2_grisolles_ready, add: 1, label: they were ready }
          - { if: retinue >= 4, add: 1, label: enough of them to hold a shape }
          - { if: npc.roger_tallis.follower, add: 1, label: Tallis has done this before }
          - { if: flag.c1_drilled_men, add: 1, label: you have drilled men before }
      success:
        text: You walk them back. You do not let them run, because men who run get ridden down. Step, turn, step, shields to the enemy, with the archers in the middle. It takes forever. You are on the bridge when the engineers start swinging their picks, and across it, every one of you, when the arch goes into the Aube with a noise like a church bell falling.
        effects: [ { set: flag.c2_men_brought_out }, { add: { res.renown: 1, rel.davy_ludd.loyalty: 2, rel.jankin_rooke.loyalty: 2, rel.simkin_barre.loyalty: 2, rel.roger_tallis.loyalty: 2, rel.wat_coker.loyalty: 2, rel.perkin_dyer.loyalty: 2, rel.gib_shawe.loyalty: 2, rel.dickon_laund.loyalty: 2 } } ]
        next: c2_grisolles_after
      partial:
        text: You keep them together most of the way. The last hundred paces they run, because everyone is running, and not all of them reach the bridge before the arch goes down.
        effects: [ { set: flag.c2_men_brought_out }, { casualties: { men: 1, named: 1, spare: [ davy_ludd ] } } ]
        next: c2_grisolles_after
      failure:
        text: It is no good. The rearguard breaks all round you, and your men break with it, and you reach the bridge in a crowd of strangers. When you count afterwards, you count twice.
        effects: [ { casualties: { men: 2, named: 1, spare: [ davy_ludd ] } } ]
        next: c2_grisolles_after
    - id: ford
      text: Lead your men down the river to the ford.
      tags: [cunning, allies]
      visible_if: [ flag.c2_found_ford ]
      text_after: |
        Half a mile through the marsh, with the noise of the bridge behind you. The posts are where you left them. The water is up to your chest and pulling at your legs, and you go across in a chain, every man holding the belt of the man in front. [if npc.perkin_dyer.follower]Perkin Dyer carries Davy over on his shoulders.[/if] You lose two bows and a horse to the Aube, and nobody else.

        Other men see you go, and follow. By evening, the villagers' ford has brought three hundred men out of Grisolles who would otherwise be dead or captive.
      effects: [ { set: flag.c2_men_brought_out }, { set: flag.c2_ford_saved }, { add: { res.renown: 2, rep.commons: 2, res.horses: -1 } } ]
      next: c2_grisolles_after
    - id: master
      text: Go back into the press for your master.
      tags: [allies, martial]
      visible_if: [ alias.master != walter_pryce, "!flag.c2_grisolles_with_master" ]
      lethal: true
      warn: You will be going the wrong way, into the enemy, alone or nearly. Without armour, or carrying a wound, you will not come out.
      check:
        attr: strength
        skill: arms
        difficulty: 5
        mods:
          - { if: armour >= 2, add: 2, label: your harness }
          - { if: armour == 1, add: 1, label: your jack }
          - { if: npc.roger_tallis.follower, add: 1, label: "Tallis comes with you, cursing" }
          - { if: rel.@master.affection >= 5 || flag.c1_master_confided, add: 1, label: you know where he will be }
      success:
        text: |
          [if alias.master == hamon_darrell]Sir Hamon is on his knees by a dead horse with his sword still up, and three men around him deciding whether he is worth more alive. You come through them.[elif alias.master == thurstan_ravell]Lord Ravell's banner is down and he is under it, unhorsed, with a Valdrennish knight reaching for his helm to see his face. You come through them.[else]Your master is fighting with his back to a cart, and his left arm hanging. You come through to him.[/if] You do not remember the way back. You remember the bridge, and the engineers' faces as you came over it, and the arch going down behind your heels.

          He does not thank you. Men do not, for this. He looks at you differently for the rest of his life.
        effects: [ { set: flag.c2_saved_master }, { add: { res.renown: 2, rel.@master.affection: 3, rel.@master.respect: 3, rep.honor: 1 } } ]
        next: c2_grisolles_after
      partial:
        text: You get him out. Something gets you across the face on the way, a mace or a spur or a splinter of cart, and you come over the bridge half blind with your own blood, on his arm instead of the other way round.
        effects: [ { set: flag.c2_saved_master }, { injury: cut_brow }, { add: { res.renown: 1, rel.@master.affection: 3, rel.@master.respect: 2 } } ]
        next: c2_grisolles_after
      failure:
        text: "[if armour >= 1 && !injured]You never reach him. Someone hits you from behind and you wake on the far bank, across someone's horse, with the bridge broken behind you and your master on the other side of it.[else]You never reach him. You go down in the press at Grisolles, the wrong way from safety, and nobody sees you fall.[/if]"
        effects:
          - if: [ armour >= 1, "!injured" ]
            then: [ { injury: cracked_skull } ]
            else: [ { die: "Killed at Grisolles going back into the rout for his master, aged {age}." } ]
        next: c2_grisolles_after
    - id: friend
      text: "[if npc.aymer_ravell.friend]Go for Aymer.[else]Go for Cobb.[/if]"
      tags: [allies, martial]
      visible_if: [ { any: [ npc.aymer_ravell.friend, npc.will_cobb.friend ] } ]
      lethal: true
      warn: You will be out of your own line and alone for a while. Without armour, or carrying a wound, a while is too long.
      check:
        attr: strength
        skill: arms
        difficulty: 4
        mods:
          - { if: armour >= 2, add: 2, label: your harness }
          - { if: armour == 1, add: 1, label: your jack }
          - { if: npc.roger_tallis.follower, add: 1, label: Tallis comes with you }
      success:
        text: "[if npc.aymer_ravell.friend]You reach the burning cart as the knot round Aymer breaks. He is laughing like a lunatic. 'Took your time!' he yells. You have never seen anyone so frightened. You get him over the bridge with his arm round your neck and his father's banner, which he would not leave, dragging in the mud behind him. He will never mention this. He will never forget it either.[else]You and your men cut a way to the river, and Cobb's archers come along it to you, and you all go back to the bridge together at a run. Cobb curses you for a fool the whole way. On the far bank he sits down in the mud and shakes, and swears quietly at the mud, until the shaking stops.[/if]"
        effects:
          - add: { res.renown: 1, rep.honor: 1 }
          - if: npc.aymer_ravell.friend
            then: [ { add: { rel.aymer_ravell.affection: 3, rel.aymer_ravell.respect: 3 } }, { set: flag.c2_saved_aymer } ]
            else: [ { add: { rel.will_cobb.affection: 3, rel.will_cobb.respect: 2 } }, { set: flag.c2_saved_cobb } ]
        next: c2_grisolles_after
      partial:
        text: "[if npc.aymer_ravell.friend]You get Aymer out. A crossbow bolt gets you on the way.[else]You get Cobb out. A horseman's mace takes you on the shoulder on the way back.[/if] Not all of your own men come back with you."
        effects:
          - injury: arrow_wound
          - casualties: { men: 1, named: 0 }
          - if: npc.aymer_ravell.friend
            then: [ { add: { rel.aymer_ravell.affection: 3, rel.aymer_ravell.respect: 2 } }, { set: flag.c2_saved_aymer } ]
            else: [ { add: { rel.will_cobb.affection: 3 } }, { set: flag.c2_saved_cobb } ]
        next: c2_grisolles_after
      failure:
        text: "[if armour >= 1 && !injured]You are too late. You go down yourself on the way back, and your men carry you over the bridge. [if npc.aymer_ravell.friend]Aymer Ravell does not come back from Grisolles.[else]Will Cobb does not come back from Grisolles.[/if][else]You are too late, and alone, and out of the line, and that is how you die at Grisolles.[/if]"
        effects:
          - if: [ armour >= 1, "!injured" ]
            then:
              - injury: crushed_ribs
              - if: npc.aymer_ravell.friend
                then: [ { kill: aymer_ravell } ]
                else: [ { kill: will_cobb } ]
            else: [ { die: "Killed at Grisolles going back for a friend, aged {age}." } ]
        next: c2_grisolles_after
    - id: run
      text: Get yourself over the bridge. Your men can follow or not.
      tags: [yield]
      text_after: You run, with everyone else. You get over the bridge. Most of your men get over it too, in the end, in ones and twos, and they do not look at you while they count who did not.
      effects: [ { casualties: { men: 1, named: 1, spare: [ davy_ludd ] } }, { add: { rel.davy_ludd.loyalty: -1, rel.jankin_rooke.loyalty: -1, rel.simkin_barre.loyalty: -1, rel.roger_tallis.loyalty: -1, rel.wat_coker.loyalty: -1, rel.perkin_dyer.loyalty: -1, rel.gib_shawe.loyalty: -1, rel.dickon_laund.loyalty: -1 } } ]
      next: c2_grisolles_after

- id: c2_grisolles_after
  chapter: ch2
  title: The Far Bank
  on_enter:
    - if: [ "!flag.c2_saved_master", { any: [ alias.master == hamon_darrell, alias.master == thurstan_ravell ] } ]
      then: [ { set: flag.c2_master_taken } ]
    - if: { not: [ alias.master == thurstan_ravell, flag.c2_saved_master ] }
      then: [ { set: flag.c2_ravell_taken } ]
    - if: [ station != knight, { any: [ flag.c2_grisolles_held, flag.c2_saved_master ] }, res.renown >= 10 ]
      then: [ { station: knight }, { set: flag.c2_knighted_grisolles } ]
  text: |
    The Constable does not try to cross. He does not need to. He has the near bank, the baggage, a thousand prisoners, and the day.

    The Adalian army camps in the rain a mile west of the broken bridge with no tents, because the tents were in the baggage, and counts itself. Eighteen hundred men dead, drowned or taken, nearly all from the rearguard. Six hundred horses. The King's plate. The pay chest. [if flag.c2_ravell_taken]Lord Ravell, taken alive under his own banner, and half his household knights with him.[/if] [if flag.c2_master_taken && alias.master == hamon_darrell]Sir Hamon Darrell, taken alive, if the heralds have it right.[/if]

    The Valdrennish dead, the heralds think, are fewer than three hundred.

    [break]

    [if flag.c2_knighted_grisolles]The Earl of Carrow comes along the line of fires at dusk, still in his harness, looking for the men who held the rearguard. He finds you. He has no ceremony and no time. He draws his sword in the rain and taps you on the shoulder with it and says, "Sir. You'll be needed." A knight made in a defeat, by a man in a foul temper. It counts the same.[/if]

    "Eighteen hundred," someone says, by your fire, flatly, as if it were a price. "Eighteen hundred, and the plate." "Bugger the plate," says someone else, and that is the end of the talking.

    Nobody sings anything that night. The King walks among the fires bareheaded, and stops at some of them, and says nothing much, and goes on.
  choices:
    - id: count
      text: Count your men, and name the missing.
      tags: [allies]
      text_after: You go round them in the dark, twice. [if flag.c1_shared_the_ford]You remember the winter after the Leven, and who sat up with you, and you sit up with them now.[/if] [if retinue >= 3]You know the faces that are here. It is the faces that are not that you keep seeing.[else]There are not many to count.[/if] [if flag.c2_knew_men]You know whose mothers to write to. You learned that by a fire on the first night ashore, without knowing what you were learning.[/if] [if npc.davy_ludd.follower]Davy sits beside you afterwards with his knees drawn up and asks whether it is always like this. You say no. You do not know if that is true.[/if]
      effects: [ { add: { rel.davy_ludd.loyalty: 1, rel.jankin_rooke.loyalty: 1, rel.simkin_barre.loyalty: 1, rel.roger_tallis.loyalty: 1, rel.wat_coker.loyalty: 1, rel.perkin_dyer.loyalty: 1, rel.gib_shawe.loyalty: 1, rel.dickon_laund.loyalty: 1 } } ]
      next: c2_retreat
    - id: list
      text: Go to the heralds and help them make the list of the taken.
      tags: [learning, diplomacy]
      text_after: The heralds work by firelight under a cart, with a scrap of canvas over the roll. Men come all night to give names. You write, or you hold the light. By morning there are four hundred names of men known to be prisoners, and every one of them is a ransom some family in Adalia will have to find. [if flag.c2_ravell_taken]Lord Ravell's ransom will be set at eight thousand marks. Everybody who has ever eaten at his table will feel it.[/if]
      effects: [ { set: flag.c2_made_list }, { add: { rep.knights: 1, rel.@master.respect: 1 } } ]
      next: c2_retreat
    - id: drink
      text: Find somebody with drink, and drink it.
      text_after: There is always somebody. It is a Sarenzan sutler with a cart of sour wine he got over the bridge before it went. He charges what he likes. Nobody argues. You wake up wet through, with a headache and the same memories.
      effects: [ { add: { res.coin: -6 } } ]
      next: c2_retreat

- id: c2_retreat
  chapter: ch2
  title: The Road to the Sea
  on_enter: [ { advance: { seasons: 1 } } ]
  text: |
    It is two hundred miles to the Armance, and it rains for most of them.

    There is no baggage, so there is no bread except what men carry, and no tents, and no pay. [if flag.c2_men_warned]Your men have three days of bread each, because you made them carry it, and the laughter of the other companies has stopped.[/if] The country on either side of the road was burned by the army on its way east. Now the army has to walk back through what it did.

    [break]

    Behind it and on its flanks ride the Iron Company, eight hundred Hroswald horse in Valdrennish pay, under a captain called Ulric Rotbart. They do not attack the column. They wait for men to fall behind it.

    "How far now?" "Ask me again and I'll drown you in that ditch." "How far now?" "...Far."

    Every morning there are fewer men in the column than there were the night before. Some of them were caught. Some of them are walking home on their own. Some of them are lying in ditches with their boots off, too tired to get up.
  choices:
    - id: carry
      text: Carry your wounded with you, all of them, whatever it costs in pace.
      tags: [allies, piety]
      check:
        attr: endurance
        skill: command
        difficulty: 4
        mods:
          - { if: flag.c2_men_warned, add: 1, label: they have bread }
          - { if: flag.c2_saved_baggage, add: 1, label: you saved a cart }
      success:
        text: You make litters of spears and cloaks. Your company falls back through the column, day by day, until it is the last company in it, with the Hroswald riders watching from the hills. They never come down. You bring every man you had into the Armance, and you nearly do not bring yourself.
        effects: [ { set: flag.c2_carried_wounded }, { add: { rep.honor: 1, rep.commons: 1, rel.davy_ludd.loyalty: 2, rel.jankin_rooke.loyalty: 2, rel.simkin_barre.loyalty: 1, rel.roger_tallis.loyalty: 1, rel.wat_coker.loyalty: 2, rel.perkin_dyer.loyalty: 2, rel.gib_shawe.loyalty: 2, rel.dickon_laund.loyalty: 2 } } ]
        next: c2_lannec_winter
      partial:
        text: You bring them all in, every one. The cost is the fever you pick up in the second week, sleeping wet, which does not leave you for a month.
        effects: [ { set: flag.c2_carried_wounded }, { injury: fever_weak }, { add: { rep.honor: 1, rel.davy_ludd.loyalty: 2, rel.jankin_rooke.loyalty: 2, rel.wat_coker.loyalty: 2, rel.perkin_dyer.loyalty: 2, rel.gib_shawe.loyalty: 2, rel.dickon_laund.loyalty: 2 } } ]
        next: c2_lannec_winter
      failure:
        text: You try. On the eighth day the Hroswald riders come down on the tail of the column in a sleet storm, and you lose two litters and the men carrying them before you can turn.
        effects: [ { casualties: { men: 1, named: 1, spare: [ davy_ludd ] } } ]
        next: c2_lannec_winter
    - id: ambush
      text: Lay an ambush at a stream crossing for the Hroswald riders who follow the column.
      tags: [cunning, martial]
      check:
        attr: wits
        skill: tactics
        difficulty: 4
        mods:
          - { if: npc.jankin_rooke.follower || npc.simkin_barre.follower, add: 1, label: your archers }
          - { if: flag.c2_heard_council, add: 1, label: you know the road ahead }
          - { if: flag.c1_master_taught && alias.master == ancel_brome, add: 1, label: Sir Ancel taught you to read ground }
          - { if: npc.roger_tallis.follower, add: 1, label: Tallis knows how they ride }
      success:
        text: Archers in the alders, a felled tree on the far bank, your men-at-arms behind it. Twenty Hroswald riders come down to the water at dusk, and only a few of them ride back up. You take six horses and a prisoner who tells you, cheerfully, that the Iron Company has been promised Valdrennish pay through the winter, and does not believe it either.
        effects: [ { set: flag.c2_ambushed_iron }, { add: { res.renown: 1, res.horses: 2 } } ]
        next: c2_lannec_winter
      failure:
        text: They have seen ambushes before. They ride round yours, and wait for you to come out of the alders, and you lose a man before you get back to the column.
        effects: [ { casualties: { men: 1, named: 0 } } ]
        next: c2_lannec_winter
    - id: take
      text: Take what you need from the villages along the road. Your men come first.
      tags: [cunning, wealth]
      text_after: The villages along the road have little left. You take it. Your men eat every night of the march. Behind you, people who were burned out in the summer go into the winter with nothing at all, and you do not look back to see it.
      effects: [ { set: flag.c2_stripped_road }, { add: { rep.ruthlessness: 2, rep.valdrenne: -2, rel.simkin_barre.loyalty: 1, rel.roger_tallis.loyalty: 1 } } ]
      next: c2_lannec_winter
    - id: march
      text: Keep your head down and keep marching.
      tags: [yield]
      text_after: You march. You eat what there is. Some days there is nothing. By the time the walls of Lannec come up out of the rain, [if retinue >= 3]you have lost one man to the ditches, and you cannot remember the last day you saw him.[else]you have lost a stone in weight and most of your opinions.[/if]
      effects: [ { casualties: { men: 1, named: 0 } } ]
      next: c2_lannec_winter

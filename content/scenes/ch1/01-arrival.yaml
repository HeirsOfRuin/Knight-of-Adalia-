# Chapter 1, Act I: arrival at Ravell Hall. Age 15-16.
# Squire-track boys are made squires here. Lower-track men start service.

- id: c1_arrival
  chapter: ch1
  title: Ravell Hall
  checkpoint: true
  on_enter:
    - if: alias.master != hamon_darrell
      then: [ { meet: will_cobb } ]
  text: |
    [if background == servant]You have lived at Ravell Hall all your life without ever once coming in by the front.

    You know every stone of it from the back. Which drain floods. Which door of the buttery sticks. Where the kitchen cats have their kittens. Which of the grooms will cover for you and which will not. You know the castle the way a mouse knows a house.

    Now you cross the outer ward with your bundle on your shoulder, past the stables where you slept last night, and nobody stops you, and that is the strange part. Hob Crane, the head groom, sees you go by and raises a hand, then lowers it, as if he is not sure he is still allowed to. A laundress you have known since you could walk looks at you twice, the second time as if you were somebody else.

    The house has not changed. You are on the other side of it now, and from this side it looks different. It is bigger, and colder, and full of people you have served at table who have never once looked at your face.

    [else]You have never seen so many people in one place who were not at a fair.

    You see Ravell Hall first from the ridge road, a mile off, across the water meadows: a square grey keep with a timber hall built against its flank like a barn leaning on a church, a curtain wall, a gatehouse, a moat that catches the light. Smoke from a dozen chimneys. Around the walls, outside them, the village: the mill, the smithy, the church of Saint Ebba with its squat tower, the alehouse with a bush over the door. Strip fields running down to the river. Sheep everywhere.

    Up close it smells. The moat is green and takes the castle's slops, and in spring it ripens. The gate passage is dark and wet and full of carts. And then you are through, into the outer ward, and it is like being dropped into a hive.

    Grooms leading horses two at a time. A cartload of firewood being unloaded by men who swear at it. Laundresses carrying baskets the size of coffins. A falconer with a hooded bird on his fist, walking slowly so as not to unsettle it. Two boys in good cloth fighting with wooden swords while a grey old knight, missing two fingers on his left hand, tells them both they are dead. Hounds. Chickens. A priest. A man in a fur-trimmed gown shouting at a man in a plain one about candles. Nobody looks at you, because everyone here is going somewhere and you are not yet anyone.

    [/if]

    [break]

    Lord Thurstan Ravell holds this castle and eleven manors from the King. He holds four knights' fees under him: four knights who owe him forty days' service a year, mounted and armed, in return for their land. Sir Hamon Darrell of Ashby and Sir Ancel Brome of Brome Tower are two of those four. Their households live under his roof for half the year, eat his bread, and fight his quarrels. Yours will too.

    [if alias.master == hamon_darrell]Sir Hamon meets you at the foot of the hall steps with a cup of ale in his hand, his belt let out a notch, and two of his hounds leaning against his legs. He is a big man going soft, with a broad red face, white hair cut short, and the kind of smile that has never once in his life been calculated. "There he is," he says, to nobody in particular, and then to you, "You'll have eaten? No. Of course not. [if background == servant]Nobody feeds the grooms properly in this house.[else]Nobody feeds anybody on the road.[/if]" He shouts for bread. It comes. He watches you eat it as if he had made it himself.[else]Sir Ancel meets you in the yard without getting down from his horse. He is lean as a hayrake, burned dark by the March wind, with half his left ear gone to a Caldmoor sword at Harrow Ford and grey coming into his beard. He looks you up and down like a horse he has been sold. "You're late," he says. You are not late; you came the day you were told. You do not say so. Something in his face eases, slightly, at your not saying so. "Stables," he says. "Then find Cobb. Then find me."[/if]

    [break]

    [if track == squire_track]You will sleep in the squires' loft over the great chamber, with four others, on straw pallets under a roof that drips in one corner. The loft has its own rules, and nobody tells them to you; you learn them by breaking them.

    The eldest of the four is Giles Marrick, nineteen, the second son of a Carrow knight, with good teeth and a better sword and a way of smiling at the side of your head instead of your face. He looks at your boots, which are your father's, then your hands, which are not a gentleman's, then your face, and decides something. You watch him decide it.

    Aymer Ravell is there too: the lord's younger son, sixteen, fair, quick, restless, already bored with you and everyone else. [if background == servant]He knew you when you were both small enough to hide in the hay. He looks at you now the way a man looks at an old coat he forgot he owned. "Well, look who's come up in the world," he says, and grins, and it is not quite friendly and not quite not.[else]He asks where you are from, and when you tell him he says "Ah," as if that explained something, and goes back to his dice.[/if][elif track == household]You will sleep in the stable loft with the grooms: six men and two boys on straw above forty horses, warm in winter from the animals' breath, foul in summer. The head groom, a bent old man called Hob Crane, shows you your place by the ladder, where you will be trodden on first.

    In the mornings the squires come through the stables on the way to the pell. They do not see you. One of them, a tall dark youth with good teeth, Giles Marrick, sees you once, on the second day, and looks at you the way a man looks at a stain.[else]You will sleep in the long barn with Sir Ancel's archers when the company is at Ravell, which is half the year, and in a ditch on the March when it is not. Will Cobb, the serjeant, a grey-bearded man with a voice like a millrace and hands like roots, gives you a blanket and the worst place by the door, where the wind comes under. "Everyone starts by the door," he says. "Some of 'em die there." He means it as a joke. [if background == archer]Then he looks at you again, longer. "Hugh Fletcher's boy. God's teeth. You've his shoulders." He gives you a second blanket and does not explain.[/if][/if]
  choices:
    - id: kneel
      text: Kneel to your master in the yard, properly, as if you had been doing it all your life.
      tags: [diplomacy]
      check: { attr: presence, skill: courtesy, difficulty: 3, audience: knights }
      success:
        text: |
          You have practised this in your head for a month. Right knee, never the left; head bowed, but not so low that you look like a beggar; hands together; the words your [if background == servant]mother[else]father[/if] got from somebody who got them from somebody who had actually done it. "My lord, I am come to your service, to do it faithfully, by God's help."

          It is a little too formal for a yard full of horse dung. It is also correct. Your master looks down at you for a moment with an expression you cannot read.

          [if alias.master == hamon_darrell]"Well," says Sir Hamon, "well, well," and pulls you up by the arm himself, and claps you on the back hard enough to knock the wind out of you, and tells the whole yard that his new boy has better manners than his old one.[else]"Get up," says Sir Ancel. You get up. Later, from the stable, you hear him tell Sir Bertram Oakes that the Fletcher boy, or the reeve's boy, or whatever he is, at least knows how to kneel. Sir Bertram says that is more than can be said for most of them. Sir Ancel says, "Hm."[/if]
        effects: [ { add: { rel.@master.respect: 1 } } ]
        next: c1_first_night
      failure:
        text: |
          You go down on one knee in the yard, and the knee goes straight into a puddle that is not entirely water. The words come out in the wrong order. You say "faithfully" twice.

          Somebody in the squires' window above laughs, a high, delighted laugh. You do not look up. You know already whose it will be.

          [if alias.master == hamon_darrell]Sir Hamon tells you to get up, and is kind about it, which makes it worse: he pats your shoulder and says that he knelt in a cowpat on the day he was knighted and it never did him any harm.[else]Sir Ancel says nothing at all, not even "get up", which is his way of being kind. You find out later that this is the kindest thing he does.[/if] You spend the evening scrubbing your hose.
        effects: [ { add: { rel.giles_marrick.respect: -1 } }, { meet: giles_marrick } ]
        next: c1_first_night
    - id: work
      text: Go straight to the stables and make yourself useful before anyone tells you to.
      tags: [martial]
      text_after: |
        Nobody has told you what to do, so you do the first thing that needs doing, which is the stables, because there is always something in a stable.

        By Vespers you have mucked out three stalls, carried water for twelve horses, found the farrier, held a kicking cob while he shod it, and learned which of your master's horses bites. (The grey. Always the grey.) You have also learned the name of Master Ranulf, the marshal of Ravell, a narrow grey-whiskered man in a leather apron who has run these stables for thirty years and who watches you all afternoon without speaking.

        At Compline he stops beside you, looks at the stall you have just cleaned, and kicks the straw to see what is underneath. There is nothing underneath. He nods once and walks away.

        Your master hears about it at supper. [if alias.master == hamon_darrell]Sir Hamon is delighted: a boy who works without being told is worth two who wait. He says so, twice, to people who were not listening the first time.[else]Sir Ancel says nothing. But the next morning, when the horses are brought out, he hands you the grey's bridle without a word, and you understand that you have passed something.[/if]
      effects:
        - add: { rel.@master.affection: 1, rel.ranulf_marshal.respect: 1 }
        - meet: ranulf_marshal
      next: c1_first_night
    - id: ask
      text: Find someone in the hall who might tell you how things are done here.
      tags: [allies]
      text_after: |
        Everybody is too busy. You try the steward's clerk, who tells you to ask the steward. You try the steward, who looks through you. You try a cook, who throws a turnip at you, not hard.

        Then you try the young woman in the good grey gown who is crossing the inner ward with a basket of thread, because she is the only person in the castle walking slowly.

        She stops. She has a narrow, clever face, dark hair under a linen cap, ink on her right forefinger, and an expression that suggests she has been waiting all day for something interesting to happen and is prepared to accept you as a poor substitute.

        "You're new," she says. "You have the look. Everyone has it the first week. Like a calf at a fair." She tells you, in about the time it takes to say a paternoster, where to wash, where to eat, which of the stewards to avoid (the fat one), which of the cooks will give you bread if you ask nicely (the one who threw the turnip), how to tell the lord's chamber from the lady's in the dark, and that Lady Ravell can hear through walls and likely through floors.

        "I am Isabel Sayer," she says. "I wait on Lady Ravell. My father is a knight with a hundred acres in Hollesby and seven daughters, and I am the fourth, so I am as poor as you are, only better dressed. Don't tell anyone I talk to grooms."

        You are not a groom. You do not say so. She sees you not say so, and smiles for the first time, and goes off with her basket. You stand in the inner ward for some time after.
      effects:
        - meet: isabel_sayer
        - assign: { suit.isabel_sayer.status: known }
        - add: { suit.isabel_sayer.regard: 1 }
      next: c1_first_night

- id: c1_duties
  chapter: ch1
  title: "[if track == squire_track]The High Table[elif track == household]The Stables[else]The Butts at Brome[/if]"
  on_enter: [ { advance: { seasons: 1 } } ]
  text: |
    By Midsummer you have learned the first lesson of service, which is that nobody will tell you anything twice, and the second, which is that nobody will tell you anything once.

    [break]

    [if track == squire_track]Midsummer feast. The Earl of Carrow's captain, Sir Walter Pryce, is at the high table with Lord Ravell, and your master is to serve the lord's own dish. That means you are.

    A swan, roasted and then dressed again in its own skin and feathers, with a gilded beak. It must be carved in its proper joints, laid on trenchers in the proper order, and presented with the proper words, while forty people watch and the Earl of Carrow's man judges Lord Ravell's household by how it is done. Giles Marrick has done it before. He has offered to help you, which means he will not.[elif track == household]Midsummer. Lord Ravell's guests have brought forty horses, and the stables are full to the rafters, and you have not sat down since Prime.

    One of the horses belongs to Sir Walter Pryce, the Earl of Carrow's captain: a bay courser with a white blaze, the best horse you have ever seen, worth more than your father will earn in his life. It is standing in the end stall with its head low and its flanks going like a bellows. It is sick, and its owner does not know yet, and when he finds out, someone in this stable will be blamed.[else]Midsummer on the March. Sir Ancel's company practises at the butts below Brome Tower every morning, in the wind off the hills, and Will Cobb walks up and down behind the line and watches who shoots and who talks.

    Today Sir Ancel is watching too, with a stranger: Sir Walter Pryce, the Earl of Carrow's captain, in a red surcoat with a black boar, who is buying archers for somebody's war and says so openly. Cobb says the best man today shoots for the Earl's money. Cobb does not say whether that is a reward or a punishment.[/if]

    [if flag.p_met_pryce]You knew the name before you heard it. A knight on a lame horse in the wet year, and a penny, and four things a man needs. He does not look at you. Why would he.[/if]
  choices:
    - id: careful
      text: "[if track == squire_track]Serve slowly and correctly, every joint in its place.[elif track == household]Nurse Sir Walter's horse yourself, all night if you have to.[else]Shoot slow and steady and say nothing.[/if]"
      tags: [diplomacy]
      check:
        attr: wits
        skill: courtesy
        difficulty: 3
        audience: nobles
        mods:
          - { if: track == household, add: 2, label: horses before lords }
          - { if: track == levy, add: 3, label: archers before lords }
      success:
        text: "[if track == squire_track]The swan comes apart as if it wanted to. Lord Ravell eats without noticing, which is the highest praise. Your master notices. Sir Walter Pryce notices too, and asks whose boy that is.[elif track == household]The horse is on its feet by dawn. Sir Walter Pryce gives you a silver penny and asks your name.[else]Eleven in twelve. Will Cobb nods once. Sir Walter Pryce asks Sir Ancel what he wants for you, as a joke, and Sir Ancel does not laugh.[/if]"
        effects:
          - add: { rel.@master.respect: 1, rel.walter_pryce.respect: 1 }
          - meet: walter_pryce
          - set: flag.c1_duties_well
          - if: track == squire_track
            then: [ { station: squire }, { add: { rel.@master.respect: 1 } } ]
          - if: track == household
            then: [ { add: { res.coin: 1 } } ]
        next: c1_squires
      failure:
        text: "[if track == squire_track]The swan's leg comes off in your hand and goes into Sir Walter's lap. The hall laughs. Giles Marrick laughs loudest. Your master says nothing until the hall is empty, and then a great deal.[elif track == household]The horse dies at Lauds. Nobody blames you aloud.[else]Your hand shakes in front of the stranger. Cobb moves you to the end of the line.[/if]"
        effects:
          - add: { rel.@master.respect: -1 }
          - if: track == squire_track
            then: [ { station: squire }, { add: { rel.giles_marrick.affection: -1 } }, { meet: giles_marrick } ]
        next: c1_squires
    - id: plain
      text: "[if track == squire_track]Serve it fast and plain, the way a hungry man wants to be served.[elif track == household]Tell the marshal straight that the horse needs a farrier, not a groom.[else]Shoot fast. The Caldmoor men will not wait for you to aim.[/if]"
      tags: [martial]
      check: { attr: presence, skill: arms, difficulty: 3 }
      success:
        text: "[if track == squire_track]It is not how the swan is meant to be carved. Sir Walter Pryce, who is a soldier, says it is how a swan should be carved, and laughs, and Lord Ravell laughs because Sir Walter did.[elif track == household]The marshal listens. The farrier is fetched. You are told you are forward. You are also right.[else]Six in the time other men loose four, and five of them in the target. Sir Walter Pryce raises an eyebrow.[/if]"
        effects:
          - add: { rel.walter_pryce.affection: 1, rel.@master.affection: 1 }
          - meet: walter_pryce
          - if: track == squire_track
            then: [ { station: squire } ]
        next: c1_squires
      failure:
        text: Fast and plain turns out to be fast and wrong. You are told so, in front of people.
        effects:
          - add: { rel.@master.respect: -1 }
          - if: track == squire_track
            then: [ { station: squire } ]
        next: c1_squires
    - id: copy
      text: Watch the others closely and do exactly what the best of them does.
      tags: [cunning]
      check: { attr: wits, skill: intrigue, difficulty: 2 }
      success:
        text: "[if track == squire_track]You copy Aymer Ravell, not Giles, because Aymer was taught by his mother's carver and Giles was taught by Giles. It works.[else]You find the man everyone else watches, and watch him. By evening you are doing it his way, and nobody has noticed you learning.[/if]"
        effects:
          - add: { skill.courtesy: 1 }
          - if: track == squire_track
            then: [ { station: squire } ]
        next: c1_squires
      failure:
        text: You copy the wrong man. Giles Marrick, who wanted you to copy him, is delighted.
        effects:
          - meet: giles_marrick
          - if: track == squire_track
            then: [ { station: squire } ]
        next: c1_squires

- id: c1_squires
  chapter: ch1
  title: Giles Marrick
  on_enter: [ { advance: { seasons: 1 } }, { meet: giles_marrick } ]
  text: |
    [if station == squire]At Michaelmas your master names you his squire before the household, in the hall, after Mass, with his hand on your shoulder. It means you are fed at the second table, carry his harness, sleep across his door when he travels, and are beaten by him rather than by grooms. It means more than that, and less, and you will spend years finding out which.[else]By Michaelmas you know every job in your corner of the household, and which of them nobody else will do, and that those are now yours.[/if]

    [break]

    Giles Marrick is seventeen, the second son of a Carrow knight, tall, with good teeth and a better sword, and he has decided you are a churl in a borrowed coat. He does not shout about it. He smiles at the side of your head.

    [if track == squire_track]He calls you the {origin} in front of the other squires, as if it were your name, and they have started to use it too. Last week your master's best harness went into the moat, and Giles told the marshal you had been careless with it, and the marshal believed him, because Giles is a gentleman.[else]He calls you the {origin} whenever he passes. Yesterday he had you whipped for insolence, in the yard, because you did not step out of the mud fast enough when he rode by, and the man who whipped you apologised afterwards, quietly, which was worse.[/if]

    The other squires watch to see what you do. [if rel.aymer_ravell.affection >= 3]Aymer Ravell catches your eye and shrugs: your quarrel, not mine, unless you ask.[/if] [if flag.c1_first_night_friend && alias.master == ancel_brome]Will Cobb says only, "There's always one."[/if]
  choices:
    - id: fight
      text: Challenge him at the pell, in front of Sir Bertram Oakes.
      tags: [martial]
      check:
        attr: strength
        skill: arms
        difficulty: 4
        mods:
          - { if: flag.p_trained_arms, add: 1, label: your years at the pell }
          - { if: injury.burned_hands, add: -1, label: your hands }
      success:
        text: Wasters, not swords, but a waster breaks fingers. You break two of his. Sir Bertram Oakes stops it and says, to the yard in general, that birth is a fine thing and so is keeping your guard up. Giles does not speak to you for a month. When he does, it is with care.
        effects:
          - set: flag.c1_beat_giles
          - set: flag.c1_giles_enemy
          - add: { res.renown: 1, rel.giles_marrick.respect: 2, rel.giles_marrick.affection: -4, rel.bertram_oakes.respect: 2, rep.knights: 1 }
          - meet: bertram_oakes
        next: { pool: c1_hall, count: 1, then: c1_winter }
      failure:
        text: He has had a sword master since he was six. You have not. He puts you on your back in the mud four times, and the fourth time he takes his time getting off. Sir Bertram says nothing, but he watches you get up.
        effects:
          - set: flag.c1_giles_enemy
          - injury: bruised_ribs
          - add: { rel.bertram_oakes.respect: 1, rel.giles_marrick.respect: -1 }
          - meet: bertram_oakes
        next: { pool: c1_hall, count: 1, then: c1_winter }
    - id: scheme
      text: Arrange for Giles to be found where he should not be.
      tags: [cunning]
      check:
        attr: wits
        skill: intrigue
        difficulty: 4
        mods: [ { if: background == servant, add: 2, label: you know this house from below } ]
      success:
        text: Giles is found by Lady Ravell's steward in the buttery with a jug of the lord's Gascon wine and no memory of how he got there. He is sent home to his father for a season. Nobody can prove anything. Giles does not need proof.
        effects:
          - set: flag.c1_giles_disgraced
          - set: flag.c1_giles_enemy
          - add: { rel.giles_marrick.affection: -5, rep.ruthlessness: 1, skill.intrigue: 1 }
        next: { pool: c1_hall, count: 1, then: c1_winter }
      failure:
        text: The wine is found in the right place. So is the groom you paid, who tells the steward everything for another penny. Your master has to apologise to Lord Ravell on your behalf. He does not enjoy it.
        effects:
          - set: flag.c1_schemer
          - set: flag.c1_giles_enemy
          - add: { rel.@master.respect: -2, rel.@master.affection: -1, rel.giles_marrick.affection: -3 }
        next: { pool: c1_hall, count: 1, then: c1_winter }
    - id: allies
      text: Win over the other squires, one at a time, until Giles is the one who stands alone.
      tags: [diplomacy, allies]
      check:
        attr: presence
        skill: diplomacy
        difficulty: 3
        audience: knights
        mods:
          - { if: rel.aymer_ravell.affection >= 3, add: 2, label: Aymer is with you }
          - { if: flag.p_rival_peace, add: 1, label: you have made peace before }
      success:
        text: It takes all autumn. You lend, you listen, you take the blame once for a boy who will remember it. By Martinmas, when Giles makes his jokes, nobody laughs. He notices. He stops making them, mostly.
        effects:
          - { train: { diplomacy: 1, quiet: 1 } }
          - set: flag.c1_squires_friends
          - add: { rel.aymer_ravell.affection: 1, rel.giles_marrick.respect: 1, rep.knights: 1 }
        next: { pool: c1_hall, count: 1, then: c1_winter }
      failure:
        text: The others like you well enough. They like not being Giles's target more. Nobody wants to be next.
        effects:
          - set: flag.c1_giles_enemy
        next: { pool: c1_hall, count: 1, then: c1_winter }
    - id: wine
      text: Stand the whole loft a cask of Gascon wine on Saint Michael's night.
      tags: [wealth]
      requires: [ res.coin >= 60 ]
      text_after: Five shillings, and worth it. The loft drinks your health and then sings about you, not all of it kindly. By morning they have stopped calling you the {origin}. Giles calls you the tradesman instead, but he says it to fewer people.
      effects:
        - set: flag.c1_bought_friends
        - add: { res.coin: -60, rep.knights: 1 }
        - if: background == burgess
          then: [ { add: { rel.giles_marrick.affection: -2 } } ]
      next: { pool: c1_hall, count: 1, then: c1_winter }
    - id: endure
      text: Take it. Do your duties better than he does his, and let that be your answer.
      tags: [yield]
      text_after: It is a long autumn. Your master's harness is fished out of the moat and cleaned by you, twice. But your master sees whose harness shines and whose does not, and Sir Bertram Oakes says that patience is a knightly virtue, though he does not say it to Giles.
      effects:
        - set: flag.c1_giles_enemy
        - add: { rel.@master.respect: 1, rep.honor: 1, rel.giles_marrick.respect: -1 }
      next: { pool: c1_hall, count: 1, then: c1_winter }

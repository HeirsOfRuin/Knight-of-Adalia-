literate_vernacular: { label: Reads Adalian, description: "Can read and write his own tongue, slowly." }
literate_latin: { label: Reads the clerks' tongue, description: "Can read charters and Church letters." }
scarred_face: { label: Scarred face, description: "A scar across the face. Soldiers trust it; ladies look away.", mods: {} }
hot_tempered: { label: Hot-tempered, description: "Quick to strike. Others know it.", mods: { skill.diplomacy: -1 } }
marked_by_saint: { label: Carries a saint's token, description: "He believes it helps. Others may think him gullible or blessed." }

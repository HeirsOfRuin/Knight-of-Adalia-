# Prologue, scene 1: one opening per background. Age 8, spring of year 9.
# Each sets a family relationship, a skill lean and a hidden-flag consequence.

- id: p_reeve_open
  chapter: prologue
  title: Lady Day Reckoning
  checkpoint: true
  text: |
    "Stand still. Stand STILL, or I'll scrub the other ear as well."

    Your mother has had you at the trough since before the cock, with a handful of wood-ash and no mercy, and now she is wrestling you into your brother's old tunic: the blue one, which was his until the winter fever took him at four, and has waited in the chest ever since for you to grow into it. You have not grown into it. She turns the cuffs back twice, looks at you, turns them back again.

    "You'll do," she says, which from Edith the reeve's wife is nearly a blessing.

    Cis and Avice are at the shutter, under orders to stay out of sight, and are failing. "He looks like a sack of meal," Cis tells the lane, loudly. Avice, who is four, laughs because Cis laughed.

    You are eight, and you have never been so important in your life. Today the steward comes.

    [break]

    Ashby is thirty-one households, a church, a mill, and a cold manor house its lord, Sir Hamon Darrell, avoids whenever he can. The land is Sir Hamon's. The running of it is your father's. Piers the reeve, chosen by the village eleven years running, which no reeve in memory has managed, because a reeve takes the lord's due from his neighbours, and neighbours remember.

    Your father keeps the account on hazel tallies: a notch for every quarter of grain, the stick split down its length, one half for him and one for the barn, so nobody can cut a notch without the halves disagreeing. He showed you how when you were six. You took to it the way other boys take to slings. Numbers stay where you put them. People do not.

    [break]

    Master Gervase Holt rides in at Terce on a grey cob, with a clerk on a mule behind him. He is a thin man in a good brown gown with a fur collar gone bald at the neck, and a cough he carries about with him like a dog. He does not get down until your father has come out to hold the cob's head.

    He looks at you over your father's shoulder. "This is the boy?"

    "My son, Master Gervase. The one who reckons."

    "We shall see," says the steward, and coughs.

    Behind the hedge, somebody snorts. Half the village has found a reason to be in the lane this morning.

    [break]

    The tithe barn is cold and smells sweetly of old straw. The clerk, a young man called Walter who sniffs like a wet dog and wipes his nose on his wrist, sets up a trestle and unrolls the steward's roll. It is written in the clerks' tongue, which you cannot read yet, with the numbers in the old letters your father taught you on the hearthstone with a burnt stick. Your father lays out his halves of the tallies, notch side up, in rows: barley, oats, beans and peas, maslin. You stand at his elbow and say nothing, as you were told, with your heart going like a hammer in a smithy.

    They read the barley. It agrees. They read the beans. They agree.

    "Oats," Walter says, through his nose. "Into the grange at Michaelmas, forty quarters."

    The steward nods and looks at the roof.

    You count the sticks under your breath. You cannot help it; you never can. [if flag.father_skims]Forty. They say forty. But you sat by the fire in Advent while your father split two oat tallies and fed one half of each into the flames, and cut two new ones a little shorter, and you saw his face while he did it, a face like a man counting coin in a bad market. Before Advent the oat sticks said forty-two.[else]Forty-two. The sticks say forty-two. You count again, and your face goes hot. Forty-two quarters went into that barn, and the roll says forty, and Master Gervase is looking at the roof, and two quarters of oats at this year's price is more than your father is paid in a year.[/if]

    Your father does not look at you. His hands are flat on the trestle and very still. He knows you can count. He taught you.
  choices:
    - id: speak
      text: Say what you counted, out loud, in front of the clerk.
      tags: [learning]
      text_after: |
        "Forty-two," you say. It comes out higher than you meant, like a girl's. "The oats. There were forty-two."

        The barn goes quiet. Walter stops sniffing.

        [if flag.father_skims]Master Gervase looks at you properly for the first time, the way you'd look at a dog that has started to talk. "Is that so," he says softly, and has the woodpile searched. It takes the reeve's own men half the morning, standing about in the cold not looking at your father, to find the charred end of a split oat tally that did not quite burn.

        At the manor court on Saint Mark's day your father is fined four shillings for false account, and is not chosen to carry the lord's candle at Easter, which is worse. He does not beat you. He has never beaten you. He stops speaking to you, and that lasts until Whitsun, and when it ends it does not end properly.

        "You did right," your mother tells you, in the dairy, in a whisper, where he cannot hear. "God help us, you did right."

        Master Gervase, leaving, pats your head with a dry hand. "Honest boys are rare," he says, "and valuable." He coughs. "I'll remember your name."[else]Master Gervase stops looking at the roof. He looks at you a long moment, and then he laughs, a short dry bark that turns into his cough. "Sharp eyes," he says. "Walter. You've miscopied. Again."

        Walter goes red to the ears and scratches at the roll.

        Nobody says anything else about it in the barn. On the ride home the steward asks your father, quite casually, whether the boy spends much time around the accounts. "No, master," says your father. That night he sits up late with every tally in the house, counting, and you lie awake listening to the click of the sticks. In the morning he says, "Next time, tell me first."

        It is the closest he comes to telling you that you have made an enemy, and that it is not the clerk.[/if]
      effects:
        - set: flag.p_spoke_up
        - if: flag.father_skims
          then: [ { add: { rel.piers_reeve.affection: -3, rel.gervase_holt.respect: 2, rep.honor: 2 } } ]
          else: [ { add: { rel.gervase_holt.respect: 1, rel.gervase_holt.affection: -2, rep.honor: 1 } } ]
      next: p_reeve_home
    - id: quiet
      text: Keep your mouth shut and tell your father afterwards.
      tags: [allies]
      text_after: |
        You keep your mouth shut. It nearly kills you.

        The reckoning goes on. The steward eats your mother's best hen, drinks the ale she has been saving since Candlemas, and rides off before Vespers, coughing. "Good riddance to his collar," Cis says, and gets her ear clipped.

        That night, when your sisters are asleep, your father sits you on the bench by the fire where the light is. "What did you see in the barn?" Not whether. What.

        You tell him.

        He nods, and keeps nodding, looking at the fire, the way he does when the weather is turning.

        [if flag.father_skims]"Two quarters," he says at last. "Two quarters, the winter the Cokers were put out. A man has to eat, boy. So does his son. So do his daughters." He gets up, goes to the chest, and comes back with a silver penny, which he puts in your palm and closes your fingers over. You have never held a whole penny before. You know exactly what it is for. You keep it a year before you can bring yourself to spend it.[else]"Two quarters," he says at last. "And the roll says forty, and Gervase Holt has signed the roll." He rubs his face. "Well. Now we both know, you and I. And the steward knows we know, or he will soon, because whatever else he is, he's no fool." He puts his hand on your head, which he hardly ever does. "Keep it close, son. Close as your shirt. A thing like that's worth more kept than spent."[/if]
      effects:
        - set: flag.p_kept_quiet
        - add: { rel.piers_reeve.affection: 2, rel.piers_reeve.respect: 1 }
        - if: flag.father_skims
          then: [ { add: { res.coin: 1, rep.ruthlessness: 1 } } ]
      next: p_reeve_home
    - id: copy
      text: Say nothing. Copy the tallies onto Father Anselm's scrap of parchment that night.
      tags: [cunning, learning]
      text_after: |
        You say nothing in the barn. But the numbers will not leave you alone, and that night you go to Father Anselm.

        The priest of Ashby is a big soft farmer's son from over the hill, who reads the gospel badly and the weather well. He keeps bees behind the church, teaches letters to any boy who brings him firewood, and hums psalms when he thinks nobody is listening. He has a box of parchment scraps, cut from the margins of old service books, for his own sums.

        "A page of figures," he says, when you ask, peering at you over the candle. "At this hour. For a boy of eight." He sighs like a bellows. "Go on, then. Mind the ink, it's dear."

        It takes three candle-ends, and you burn your thumb on the last. You copy every tally: barley, oats, beans and peas, maslin, the notches as little strokes, the way your father reckons. At the bottom you write the date as Father Anselm showed you, the feast and the year of the King.

        You do not know yet why you are doing it. You only know the numbers in the barn and the numbers on the roll were not the same, and tomorrow the sticks might be different, and the parchment will not.

        Father Anselm reads it over your shoulder, humming. He asks no questions. He folds it twice and slips it inside the back board of his psalter, between the leather and the wood. "It'll keep there," he says. "Nobody reads my psalter but me, and God knows I only manage it on Sundays."
      effects:
        - set: flag.p_kept_copy
        - item: +tally_copy
        - add: { skill.learning: 1, rel.father_anselm.affection: 1 }
        - meet: father_anselm
      next: p_reeve_home

- id: p_burgess_open
  chapter: prologue
  title: The Counting-House
  checkpoint: true
  text: |
    Easter week in Wendham, and the whole house stinks of wet sheep.

    The fleeces came down from the hill farms before the feast, and now they are everywhere: stacked to the rafters of the wool loft, heaped in the passage, laid out in rows on the counting-house floor for grading, so you have to hop over them to reach the stair. "That," your father says, breathing it in, "is the smell of money." Your mother keeps dried lavender on every sill. It does not help.

    Ralf Mercer is a tidy man in a tidy house: three storeys on Sheep Street, a hall with glass in one window, a counting-house at the front where he can see who comes to the door. He sits on the town council. He writes everything down. When he talks to you he uses the voice he uses for customers, patient and pleasant and careful, as if you might yet take your custom elsewhere.

    [break]

    On the Wednesday a man in a black gown comes to the counting-house door with a clerk and a locked box.

    The Sarenzan factor, Master {npc.bertuccio_lanzi}. You have seen him at Mass, kneeling bolt upright in the merchants' pew and never singing. Close to he is younger than you thought, with clever eyes and gloves so fine you could see through them. He bows to your mother as if she were a countess. Then, to your astonishment, he bows to you.

    "The son," he says, in careful Adalian. "Good. A house needs a son."

    "Out," says your father, pleasantly, and shuts the door on you.

    [break]

    The door does not quite shut. It never has; the wool damp swells the frame. Through the crack come your father's voice and the Sarenzan's, and figures, a great many figures, and one word you understand completely, because your father says it the way other men swear.

    Owed.

    In the yard, Jocelin Tanner is hanging off the gate with the tanners' boys, stones in their fists, on their way to the wharf to pelt the Sarenzan ship. "Oi! Wool-boy!" He jerks his head. "Coming, or are you scared you'll muss your hose?"

    And in the passage, old Thomas Penny, your father's clerk, sits at his desk by the stair clicking the abacus, doing sums for nobody, the way he does whenever the door is shut and he has been told to be elsewhere.
  choices:
    - id: listen
      text: Stay by the door and listen.
      tags: [cunning]
      text_after: |
        You put your eye to the crack and your ear to the jamb and stop breathing.

        Three hundred marks. Borrowed in your grandfather's time against the wool of years not yet shorn. The Lanzi bank wants the next payment by Michaelmas. "It will be paid," your father says, in a voice you have never heard out of him: the voice of a man asking.

        The latch lifts. You are halfway up the stair before the Sarenzan's gloves are out of the door, and not far enough. Your father comes into the passage and finds you on the fourth step, and looks at you, and you feel the heat climb right up your neck to your ears.

        He says nothing at all. At supper he is pleasant to everyone. You lie awake afterwards understanding that you learned two things today, and that the second was what your father's face looks like when he is afraid.
      effects:
        - set: flag.p_knows_debt
        - add: { skill.intrigue: 1, rel.ralf_mercer.respect: -1 }
      next: p_burgess_home
    - id: wharf
      text: Go to the wharf with Jocelin and the tanners' boys.
      tags: [martial]
      text_after: |
        "Coming!" And you are over the gate before you have thought about it.

        The Sarenzan ship is a tall, fat thing with a painted eye on her bow, and the sailors on deck are mending sail and ignoring boys. Jocelin throws first. It takes a sailor clean on the ear.

        "Porco Dio!"

        The sailors come down the gangplank with ropes' ends, and everybody runs, and you are the slowest, because your shoes are the best. They catch you on the wet planks of the wharf and give you the beating meant for all of you, while Jocelin howls with laughter from behind a bale.

        You limp home with a split lip and a torn sleeve and a feeling in your chest you cannot name. Jocelin laughs about it for a month. But the tanners' boys stop calling you wool-boy, and when the alley plays at war, you are allowed on a side.
      effects:
        - set: flag.p_wharf_gang
        - add: { attr.endurance: 1, rep.commons: 1, rel.jocelin_tanner.respect: 2 }
      next: p_burgess_home
    - id: clerk
      text: Sit with old Thomas and learn his sums.
      tags: [learning, wealth]
      text_after: |
        "Sit, then, if you're sitting," old Thomas says. "And don't breathe on the beads."

        He shows you the abacus, and how to reckon a sack of wool in Sarenzan money and in Adalian, and the difference between the two, which is where the profit lives. "Every coin's two coins," he says, tapping his nose. "What it is, and what the other fellow thinks it is."

        By evening you can do it faster than he can, and he does not like that one bit. But he tells your father, grumbling. Your father comes and stands in the doorway with his arms folded and watches your fingers on the beads, and says nothing, and goes away again. You catch his face as he turns, and it is pride, and you have not seen it pointed at you before.
      effects:
        - set: flag.p_counting_house
        - add: { skill.trade: 1, rel.ralf_mercer.affection: 1 }
      next: p_burgess_home

- id: p_archer_open
  chapter: prologue
  title: The Butts
  checkpoint: true
  text: |
    "Arrows, boy! Are you deaf, or just slow?"

    Sunday after Mass, at the butts behind the church at Hollin, where the parish ends and the Ravell chase begins. By the King's law every man between sixteen and sixty is meant to shoot on Sundays. Most of them drink, and shoot between drinks, and miss. Boys like you run up and down the long meadow between the two turf banks all afternoon, fetching arrows at a farthing a dozen and dodging the ones that come in late.

    "Watch yourself, Fletcher's lad! Tom's had three jugs, he couldn't hit a barn from inside it!"

    [break]

    Your father shoots alone, at the far end, from one leg. The other knee will not bear him; a Caldmoor spear saw to that at Harrow Ford, before you were born. He leans on his stick, sets it aside, draws, looses, and has the stick back in his hand before the arrow lands. Six in the clout from two hundred paces. Nobody watches him any more. You watch him every week, and every week your chest goes tight with it.

    This Sunday a man from his old company has walked over from the next parish: {npc.will_cobb}. Grey beard, new shirt, a voice like a millrace and hands like the roots of an oak. He thumps your father on the back hard enough to knock a smaller man over, and the two of them sit on the bank with a jug between them, and do not talk about the war. They do it carefully, for an hour, like men walking round a bog.

    [break]

    Then Cobb, deep in the jug, laughs at something and says, clear as a bell, "...like the mill at Carn Dubh."

    Your father sets the jug down. He does not look at Cobb. He looks at you, and says, quite gently, "Fetch the arrows, son."

    There are no arrows to fetch. You both know it.
  choices:
    - id: ask
      text: Ask your father what happened at Carn Dubh.
      tags: [cunning]
      text_after: |
        "What happened at Carn Dubh?"

        Cobb goes red and finds something interesting in the bottom of the jug. Your father does not answer, and does not shout, and that frightens you more than shouting would.

        Not that day. Not that week. Then one night, when the jug is empty and your mother and little Kit are asleep, he tells you, staring at the embers. A mill in Caldmoor, at the end of the war, full of people. The captain said they were fighting men and ordered it fired. Your father was one of the archers on the door.

        "Some were fighting men," he says. His voice cracks. "Some were."

        He makes you swear on your mother's cross never to say the name to a living soul, and you swear, with your hand shaking. In the firelight you can see two things on his face at once: shame that you know, and relief that somebody finally does.
      effects:
        - set: flag.p_knows_war_secret
        - add: { rel.hugh_fletcher.affection: 1, rel.hugh_fletcher.respect: -1 }
      next: p_archer_home
    - id: shoot
      text: Fetch the arrows, then shoot until your fingers bleed.
      tags: [martial]
      text_after: |
        You fetch the arrows. Then you pick up your father's old war bow, which is taller than you and twice as stubborn, and try to draw it.

        "Ha! Look at him!" Cobb crows. "Hugh, he's got your daft face on him and all."

        A hand's breadth. Two. Your arms shake like a wet dog. You loose, and the arrow goes six feet and buries itself in a cowpat, and the drunks on the bank cheer you like a champion.

        You keep at it until dark. The string cuts your fingers to the meat and your back burns from your neck to your belt. Your father binds your fingers with linen torn from his own shirt. "You'll be crooked as me by twenty," he says. "One shoulder up by your ear and arms like a smith." He tries to sound stern. He sounds pleased as a dog with two tails.

        On the walk home Cobb leans down and mutters, "I've seen grown men quit sooner, lad," and you carry that home warmer than the linen.
      effects:
        - set: flag.p_bloody_hands
        - add: { skill.archery: 1, rel.hugh_fletcher.affection: 2 }
      next: p_archer_home
    - id: cobb
      text: Follow Will Cobb to the alehouse and listen to his stories.
      tags: [allies]
      text_after: |
        "No ale money? Ah, you're a hard bargain." Cobb ruffles your hair with a hand like a shovel. "Go on, then. One story, gratis, and don't tell a soul I'm going soft."

        It is not one story. It is all of them, at the alehouse table, until the alewife throws you both out.

        Harrow Ford: the Caldmoor spears coming on "like a hedge in a gale, lad, a whole hedge walking," and the arrows going into them like hail into a pond. Your father, before his knee, the best shot in the company, who once put an arrow through a Caldmoor chief's mouth while he was shouting. "Clean through. Never finished his sentence." Where the serjeants drink. Which captains pay. Which lords keep faith with archers and which don't, by name, with spitting.

        He leaves out Carn Dubh. You notice the gap in the stories, the way you'd notice a missing tooth.
      effects:
        - set: flag.p_cobb_friend
        - meet: will_cobb
        - add: { rel.will_cobb.affection: 3, skill.tactics: 1 }
      next: p_archer_home

- id: p_servant_open
  chapter: prologue
  title: The Destrier
  checkpoint: true
  text: |
    Ravell Hall, the stable yard, a raw spring morning, with mist lying in the moat and the jackdaws squabbling up and down the keep.

    [if role == horse_master]You have mucked out the great horses since you could carry a fork, and you know each of them by the sound of its feet on the cobbles.[elif role == huntsman]You sleep in the kennels with the lymers, curled against the warm one with the torn ear, and you smell like them, and do not care who knows it.[else]You keep the mews clean and the hawks' jesses greased, and you can tell a hawk's temper from across the yard by how she holds her feathers.[/if]

    Your mother, Agnes, dresses Lady Ravell. You eat in the kitchen at the end of the long table nearest the draught, and you know more about the family than the family thinks. You know, for one thing, who the heir's real father is. You heard it through a privy wall two winters ago, in Lady Ravell's own voice, and you have told no one, not even your mother, and some nights it sits on your chest like a cat.

    [break]

    "Psst. You. Horse-boy."

    Aymer Ravell is nine, a year older than you, the lord's second son: fair, quick, and bored out of his wits. He is leaning in the stable door with his hands behind his back, which means he wants something.

    "I want to sit on Bayard," he says.

    Bayard is his father's destrier, a grey stallion seventeen hands high who has killed one groom and crippled another. He is standing in the end stall with his ears pinned back, listening to every word.

    "Just sit. That's all. Nobody'll know." Aymer gives you the smile that gets him anything he wants from anyone in the hall except his father. "Go on. You're not scared of him. Not you."

    Master Ranulf, the marshal, is at the far end of the yard with his back to you, roaring at the farrier.
  choices:
    - id: saddle
      text: Saddle Bayard for him and hold the head.
      tags: [allies]
      check: { attr: agility, skill: riding, difficulty: 3 }
      success:
        text: |
          You talk to Bayard the whole time, low, the way Master Ranulf does, and he lets you. Then he stands like a church while Aymer sits on him, white-faced and grinning, for a count of fifty.

          Aymer slides off and punches your arm and calls you his man, as if he had been granting you a manor. Master Ranulf has turned round. He has seen all of it, and says nothing, which is how you know exactly how angry he is.
        effects: [ { set: flag.p_saddled_destrier }, { add: { rel.aymer_ravell.affection: 3, rel.ranulf_marshal.respect: -1 } } ]
        next: p_servant_home
      failure:
        text: |
          Bayard throws his head at the first touch of the girth and Aymer, who has climbed onto the mounting block to wait, goes over backwards into the midden.

          He is not hurt. He is filthy, and furious, and by noon his mother has heard. Your own mother is called to Lady Ravell's chamber and comes back with her face set like a door. You do not eat that night, and she does not speak to you until Sunday.
        effects: [ { set: flag.p_saddled_destrier }, { add: { rel.aymer_ravell.affection: -1, rel.agnes_tirewoman.affection: -2 } } ]
        next: p_servant_home
    - id: refuse
      text: Refuse him, and fetch Master Ranulf.
      tags: [diplomacy]
      text_after: |
        "No."

        Aymer's smile falls off his face like a dropped plate. "What did you say?"

        "Master Ranulf!" you yell, before you can lose your nerve. "Master RANULF!"

        Ranulf leads Aymer back to the house by the ear, which only a man of thirty years' service could do to a lord's son and keep his place. Aymer kicks and swears the whole way, and does not speak to you for a month.

        Ranulf does not forget it either. From that week he starts teaching you properly, the way he never bothered with the other boys: how to read a horse's eye, where the heat sits in a bad hoof, why you never stand where a frightened animal can see you and not reach you. "You've got sense," he says, gruff as a dog's bark. "Don't waste it."
      effects:
        - set: flag.p_told_ranulf
        - add: { rel.ranulf_marshal.respect: 2, rel.ranulf_marshal.affection: 1, rel.aymer_ravell.affection: -2 }
        - if: role == horse_master
          then: [ { add: { skill.riding: 1 } } ]
          else: [ { add: { skill.woodcraft: 1 } } ]
      next: p_servant_home
    - id: blame
      text: Saddle him, and tell Aymer you will take the blame if you are caught.
      tags: [martial]
      text_after: |
        You are caught, before Aymer is even off the horse. Master Ranulf beats you with a stirrup leather in front of the grooms, ten strokes, not hard by his standards.

        Aymer watches from the gate and says nothing. That night he comes down to the kitchen, where he is never seen, with a honey cake from the high table wrapped in a napkin, and gives it to you in front of the scullions, and says he owes you. He means it. For now.
      effects:
        - set: flag.p_took_blame
        - injury: bruised_ribs
        - add: { rel.aymer_ravell.affection: 2, rel.aymer_ravell.respect: 2, rep.honor: 1 }
      next: p_servant_home

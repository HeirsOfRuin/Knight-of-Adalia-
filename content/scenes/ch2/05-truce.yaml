# Chapter 2, part 5: the truce of Saint-Lys, the Sauvemer garrison, home, and the grants.
# Spring year 24 to spring year 26. Ages 23-25.
# Adalia won the war it could afford, not the one it set out to fight. The
# banks made both kings stop; Les Salines decided who stopped with what.

- id: c2_truce
  chapter: ch2
  title: The Truce of Saint-Lys
  checkpoint: true
  on_enter: [ { advance: { seasons: 1 } }, { meet: orsino_brancale } ]
  text: |
    King Aldred would fight on, if he could pay for it. He cannot. Nor can King Amaury, who has lost an army on the salt pans and needs ten years and a great deal of borrowed money to raise another.

    In Lent, the Lanzi house tells King Aldred that it will lend him nothing more until he treats. In the same week, the Varesco house tells King Amaury the same thing, in almost the same words. The Signory of Sarenza has lent too much to both to let either one fight to the end.

    [break]

    The Pontiff's legate, Cardinal Orsino Brancale, a soft-spoken Sarenzan with a merchant's eyes, rides between the two courts with the bankers' letters in his saddlebag. At Saint-Lys, at Lady Day, he gets his truce: three years, and the terms are the terms of the side that won at Les Salines.

    Sauvemer and all its march are Adalian, held of no one. The Duke of Armance comes home, exchanged for Thibaut de Brésy and the duke taken on the salt, and the Armance is to be left in peace. The prisoners of Grisolles are released at rates the bankers fix, which nobody likes. And the wool goes back to Vervais, as the Moot was promised.

    It is not the crown of Valdrenne. Nobody in the army ever really thought it would be, after the Lisonne. It is a port, a march, an ally kept, and a King of Valdrenne who has learned what it costs to fight one. Men argue in the taverns of Sauvemer for months about whether that was worth Grisolles. Most decide it was. The ones who were in the rearguard are not so sure.

    [if flag.c2_salines_decisive]The legate does not say so, but everyone at Saint-Lys knows why the terms lean Adalian: the host that drowned in the pans was the only army Amaury had. Men who were on the dyke walk a little taller in Sauvemer that spring.[elif flag.c2_salines_pyrrhic]The legate does not say so, but everyone at Saint-Lys knows the King could not have fought another summer. Les Salines bled both armies white, and the terms are what two exhausted men could agree.[/if]

    [if flag.c2_jehanne_message]You never did get the chance to give the King the Duchess's message. Someone did. Her husband rides into Lannec at Whitsun, thin and grey and blinking, and she meets him at the gate.[/if]

    [break]

    Half the army goes home. The rest stays, to garrison Sauvemer and its march, and to be paid even more slowly than before.
  choices:
    - id: garrison
      text: Stay with the garrison in Sauvemer. That is where the King's grants will be given, when they are given.
      tags: [cunning]
      text_after: "[if flag.c2_took_house]You keep the merchant's house in the Rue des Tanneurs, with its yard and its well and the last of its wine.[else]You take a house in the Rue des Tanneurs with your men: two rooms, a yard, a well, and neighbours who will not look you in the eye.[/if] Sauvemer is the King's now, and in a sense yours. It does not feel like it."
      effects: [ { add: { counter.fame_sauvemer: 1, counter.fame_diff: 1, rep.crown: 1 } }, { set: flag.c2_garrison } ]
      next: { pool: c2_camp, count: 2, then: c2_garrison_life }
    - id: march
      text: Go with the companies the King lends the Armance, to hold its castles through the truce.
      tags: [martial, piety]
      text_after: The Armance castles are small, cold and short of everything, and the people round them are the first Valdrennish you have met who are glad to see an Adalian. The Duke is home and ill and sees nobody. The Duchess runs everything, and remembers you, or says she does.
      effects: [ { set: flag.c2_armance_castles }, { add: { rel.jehanne_armance.respect: 1, rep.valdrenne: 1 } } ]
      next: { pool: c2_camp, count: 2, then: c2_garrison_life }
    - id: pryce
      text: Take service with Sir Walter Pryce, who is keeping a company in the field through the truce, for pay.
      tags: [wealth]
      text_after: |
        [if flag.c1_pryce_knows]Sir Walter mentions, pleasantly, the night you burned a page of the commissioners' roll. He does not mention it again. He does not have to.[/if] [if flag.c2_took_thibaut]Sir Walter does not mention Thibaut de Brésy either, whose ransom went to you and not to him.[elif flag.c2_pryce_took_thibaut]Sir Walter is rich now, on Thibaut de Brésy's ransom, and has used the money the way he uses everything: to make more.[/if] A truce is only a truce for kings. Sir Walter's company rides the border country all through it, collecting protection money from villages that cannot say no. The pay is good. The work is not work you will tell anyone about.
      effects: [ { set: flag.c2_pryce_company }, { add: { res.coin: 360, rep.ruthlessness: 2, rel.walter_pryce.affection: 2 } } ]
      next: { pool: c2_camp, count: 2, then: c2_garrison_life }

- id: c2_garrison_life
  chapter: ch2
  title: The Garrison
  on_enter: [ { advance: { seasons: 1 } } ]
  text: |
    A truce is a strange thing to live in. You are a conqueror in a conquered country, which sounds grand. In fact it is boredom, cold, short pay, and the feeling of being watched.

    The Sauvemer people have not forgiven the siege and will not, in your lifetime. [if flag.c2_terms_carried]They have not forgotten the terms either, or who carried them across the ditch.[/if] The Adalian garrison drinks, gambles, marries local girls who would rather not, quarrels with the townsmen, and sometimes kills one. The townsmen sometimes kill one back. Every month there is a hanging.

    [break]

    Your following has changed since Saltcombe. [if retinue >= 4]It is bigger: men drift to a captain who pays.[elif retinue <= 1]It is smaller: the war and the flux have seen to that.[else]Some faces are new. Some are gone.[/if] Davy Ludd is seventeen and taller than you. [if npc.roger_tallis.follower]Tallis has found a Valdrennish widow in the Rue des Tanneurs and is talking about staying for good.[/if]

    "Boring," says Davy, sitting on the well-head, kicking his heels. "I never thought I'd say it. I'd give a month's pay for a Valdrennish army to come over the hill." "You haven't had a month's pay since Lent," says somebody. "That's why I can afford to give it."

    You have time, for the first time in years, to choose what to do with it.
  choices:
    - id: train
      text: Train your men properly, every day, as if the war will start again tomorrow.
      tags: [martial]
      text_after: It will start again. Everyone knows the truce will end. When it does, your men will be the best-drilled company in Sauvemer, and they will know it, and so will the men who give out grants.
      effects: [ { set: flag.c2_drilled }, { add: { skill.command: 1, skill.tactics: 1, rel.@master.respect: 1 } } ]
      next: c2_buy_sauvemer
    - id: town
      text: Learn the town. The language, the people, who owes whom.
      tags: [diplomacy, learning]
      text_after: It is slow. They do not want to be learned. But by spring you can bargain in Valdrennish, you know which of the burghers is a Valdrennish spy and which is an Adalian one, and the baker on the corner has started giving you yesterday's bread for nothing.
      effects: [ { set: flag.c2_learned_town }, { add: { rep.valdrenne: 2, skill.diplomacy: 1, skill.intrigue: 1 } } ]
      next: c2_buy_sauvemer
    - id: court
      text: Spend your evenings where the women of rank are.
      tags: [diplomacy]
      text_after: |
        In a garrison town there are not many such places, and you know them all by Candlemas.
        [if suit.clemence_vaux.status >= known]Dame Clémence keeps her husband's house and her own counsel, and receives you twice, with her household present, and once without.[/if] [if suit.fiammetta_lanzi.status >= known]Fiammetta Lanzi keeps the bank's house and asks you to dine whenever she needs someone to argue with.[/if] [if suit.heloise_corbie.status >= known]Héloïse de Corbie writes from her brother's lands, now that the ransom is half paid. Her letters are long and do not say much, and you read them several times.[/if]
      effects:
        - if: suit.clemence_vaux.status >= known
          then: [ { add: { suit.clemence_vaux.regard: 2 } }, { assign: { suit.clemence_vaux.status: courted } } ]
        - if: suit.fiammetta_lanzi.status >= known
          then: [ { add: { suit.fiammetta_lanzi.regard: 2 } }, { assign: { suit.fiammetta_lanzi.status: courted } } ]
        - if: suit.heloise_corbie.status >= known
          then: [ { add: { suit.heloise_corbie.regard: 2 } } ]
      next: c2_buy_sauvemer
    - id: trade
      text: "Put your money to work. Cloth, wine, ransoms: there is money to be made in a garrison town by a man who can count."
      tags: [wealth]
      check: { attr: wits, skill: trade, difficulty: 3, mods: [ { if: npc.fiammetta_lanzi.met, add: 1, label: the Lanzi house advises you } ] }
      success:
        text: Valdrennish wine bought cheap from people who need coin, sold dear to an Adalian garrison that needs drink. By spring you have doubled what you put in. You are not proud of it. You are richer.
        effects: [ { add: { res.coin: 480, rep.merchants: 1 } } ]
        next: c2_buy_sauvemer
      failure:
        text: The wine is sour by the time it arrives. You learn something. It is expensive.
        effects: [ { add: { res.coin: -60 } } ]
        next: c2_buy_sauvemer

- id: c2_iron_company
  chapter: ch2
  title: The Iron Company
  on_enter: [ { advance: { seasons: 2 } }, { meet: ulric_rotbart } ]
  text: |
    In the first winter of the truce the Iron Company comes west: eight hundred Hroswald mercenaries under Ulric Rotbart, who rode behind the army all the way back from Grisolles and stood on the heights at Les Salines, and whom King Amaury has stopped paying now that he has no war to pay them for.

    A free company without a war is a plague with a banner. It takes a village a week and a town a month. The Valdrennish crown will not fight it, because it might be useful later. The Adalian garrison will not fight it, because there is a truce.

    [break]

    It comes into the march country behind Sauvemer, and the villages there, which were stripped once by the siege, are stripped again by them. A delegation of their headmen comes to the garrison to ask the Adalians for protection, since the Adalians are now their lords. The garrison captain laughs at them.

    Their spokesman is an old salt-boiler with burned forearms and no front teeth. "You took our town," he says, through a Valdrennish priest who translates as if every word hurt him. "So you're our lords now. Fine. Then lord."

    They come to you next.
  choices:
    - id: fight
      text: Take your men and whoever will follow you, and fight the Iron Company off.
      tags: [martial]
      lethal: true
      warn: Hroswald mercenaries are professionals. Without armour, or carrying a wound, you could die for a village that hates you.
      check:
        attr: presence
        skill: command
        difficulty: 5
        mods:
          - { if: flag.c2_drilled, add: 2, label: your men are drilled }
          - { if: retinue >= 4, add: 1, label: your following }
          - { if: rep.valdrenne >= 2, add: 1, label: the villages fight beside you }
          - { if: armour >= 2, add: 1, label: your harness }
      success:
        text: Not a battle. A week of ambushes in the marsh, where the Hroswald horsemen cannot ride and the village men know every path. At the end of it Rotbart decides the march country is not worth the trouble and moves on. The headmen do not thank you. They send a cart of eels and a ham, and they stop spitting when you pass.
        effects: [ { set: flag.c2_fought_iron }, { add: { res.renown: 2, rep.valdrenne: 3, rep.commons: 1 } } ]
        next: c2_home_choice
      partial:
        text: Rotbart moves on. It costs you men.
        effects: [ { set: flag.c2_fought_iron }, { add: { res.renown: 1, rep.valdrenne: 2 } }, { casualties: { men: 1, named: 1, spare: [ davy_ludd ] } } ]
        next: c2_home_choice
      failure:
        text: "[if armour >= 1 && !injured]The Iron Company knows its business better than you know yours. You are carried back to Sauvemer on a hurdle.[else]The Iron Company knows its business better than you know yours. You die in a marsh behind Sauvemer, for people who never wanted you there.[/if]"
        effects:
          - if: [ armour >= 1, "!injured" ]
            then: [ { injury: crushed_ribs }, { casualties: { men: 1, named: 1, spare: [ davy_ludd ] } } ]
            else: [ { die: "Killed fighting the Iron Company in the marshes behind Sauvemer, aged {age}." } ]
        next: c2_home_choice
    - id: bargain
      text: Ride out to Ulric Rotbart and buy him off.
      tags: [wealth, diplomacy]
      check:
        attr: presence
        skill: trade
        difficulty: 4
        mods: [ { if: npc.roger_tallis.follower, add: 2, label: Tallis rode with Rotbart once } ]
      success:
        text: Rotbart is a big, courteous, tired man, who would rather be paid than fight and says so. [if npc.roger_tallis.follower]He and Tallis embrace like brothers and then argue about money for an hour.[/if] Forty pounds, half from the villages and half from you, and the Iron Company goes east. The villages pay their half. They remember who paid the other.
        effects: [ { set: flag.c2_bought_iron }, { add: { res.coin: -240, rep.valdrenne: 2, rel.ulric_rotbart.respect: 2 } } ]
        next: c2_home_choice
      failure:
        text: Rotbart takes your money and stays a month anyway.
        effects: [ { add: { res.coin: -120 } } ]
        next: c2_home_choice
    - id: warn
      text: You cannot stop them. But you can warn the villages in their path, and get the people out.
      tags: [piety, cunning]
      text_after: Not enough. Something. Four villages are empty when the Iron Company comes. The people come back afterwards to ashes, but they come back.
      effects: [ { add: { rep.valdrenne: 1, rep.honor: 1 } } ]
      next: c2_home_choice
    - id: refuse
      text: Send them away. There is a truce, and it is not your affair.
      tags: [yield]
      text_after: They go. The Iron Company stays a month. When it leaves, the march country behind Sauvemer is empty of everything, including people who might have been your tenants one day.
      effects: [ { set: flag.c2_refused_villages }, { add: { rep.valdrenne: -2 } } ]
      next: c2_home_choice

- id: c2_home_choice
  chapter: ch2
  title: A Ship for Saltcombe
  on_enter: [ { advance: { seasons: 1 } } ]
  text: |
    In the spring of the second year of the truce, a ship sails from Sauvemer for Saltcombe with the garrison's letters, and a few places for men on leave.

    You have been away for four years. You have letters from home that are a year old. [if retinue >= 3]Your men will keep, if [if npc.roger_tallis.follower && npc.roger_tallis.alive]Tallis or [/if]someone you trust is in charge.[/if] The passage costs a pound. The journey home and back will take the whole summer.

    The King's grants for the conquered lands are to be decided at Michaelmas, in Sauvemer. A man who is away when grants are decided is easy to forget.
  choices:
    - id: go
      text: Go home, for the summer.
      tags: [allies]
      requires: [ res.coin >= 240 ]
      text_after: You are on the ship with the letters three days later. The Narrow Sea is calm this time. You stand at the rail all the way, watching for the white cliffs that are not white at all, close to, but grey and streaked with green.
      effects: [ { add: { res.coin: -240 } }, { set: flag.c2_went_home } ]
      next: c2_home
    - id: stay
      text: Stay. Grants are given to men who are there.
      tags: [cunning]
      text_after: You send letters instead. They will be three months on the road, and the answers three months more. You stand on the quay and watch the ship go.
      effects: [ { set: flag.c2_stayed_for_grants }, { add: { rel.@master.respect: 1 } } ]
      next: { pool: c2_camp, count: 1, then: c2_grants }

- id: c2_home
  chapter: ch2
  title: Home
  text: |
    Everything at home is smaller than you remember it.

    [if background == reeve]Ashby is the same thirty-one households, the same church, the same mill. [if flag.c1_father_exposed]Your father is not reeve any more. He lives with your mother in the end cottage by the common, the one that used to be the Cokers'.[else]Your father is greyer and slower and still reeve. He stands in the lane when you ride in and does not move until you have dismounted, and then he holds you by both shoulders and looks you over, as if counting the pieces.[/if] [if suit.mag_coker.status != lost]Mag Coker is still at the well. She is not married.[/if][elif background == burgess]Wendham is quieter and shabbier: the staple was shut for three years, and the wool sat in the barns waiting for Vervais. It is moving again now, and the town is drunk with relief. Your father has an old gown and a new seat on the council, because half the old council went bankrupt. He introduces you to everyone as "my son the soldier", and you discover that you do not mind. [if suit.annot_dyer.status != lost]Annot Dyer is still at the vats.[/if][elif background == archer]Your father's cottage has a new roof, and he will not say how he paid for it, which means [if npc.ancel_brome.alive]Sir Ancel did[else]his old company passed the hat[/if]. He is thinner. He can barely walk to the butts now. He goes anyway, every Sunday, and makes you shoot with him. [if suit.mariot_wood.status != lost]Mariot Wood comes to watch.[/if][else]Ravell Hall is the same, and the faces are not. Hob Crane is bent double, and still in the stables before anyone else. Master Ranulf is half blind. [if flag.p_mother_dismissed]Your mother is in Wendham, in a room you are paying for.[else]Your mother is still Lady Ravell's tirewoman, and still straightens your collar.[/if] [if suit.nell_laundress.status != lost]Nell is in the dairy now, and has a child that is not yours, and is not married.[/if][/if]

    [break]

    The March is quiet now, the way a burned field is quiet. Everyone at home talks about Harlow Moss, where the King broke the Caldmoor host in the snow. In the March they talk about the winter before it, when the towers held and everything outside them burned.

    [if flag.c1_coll_hanged]Black Ewan rode ahead of the Caldmoor host that winter. He burned four steadings in the March and asked, at every one, for a man with your name.[/if]
  choices:
    - id: family
      text: Spend the summer with your family.
      tags: [allies]
      text_after: It is a quiet summer, and the best one you have had in years. [if flag.c1_harvest_family]It is like the harvest leave, long ago, when you were a boy in a new coat, except that this time you are the one who notices how they have aged.[/if] You mend things. You eat too much. At the end of it your family stand in the lane and watch you go, and this time you look back.
      effects:
        - if: background == reeve
          then: [ { add: { rel.piers_reeve.affection: 3 } } ]
        - if: background == burgess
          then: [ { add: { rel.ralf_mercer.affection: 3 } } ]
        - if: background == archer
          then: [ { add: { rel.hugh_fletcher.affection: 3 } } ]
        - if: background == servant
          then: [ { add: { rel.agnes_tirewoman.affection: 3 } } ]
      next: c2_home_ravell
    - id: girl
      text: "Find [if background == reeve]Mag[elif background == burgess]Annot[elif background == archer]Mariot[else]Nell[/if]."
      tags: [diplomacy]
      visible_if: [ { any: [ [ background == reeve, suit.mag_coker.status != lost ], [ background == burgess, suit.annot_dyer.status != lost ], [ background == archer, suit.mariot_wood.status != lost ], [ background == servant, suit.nell_laundress.status != lost ] ] } ]
      text_after: |
        [if flag.c1_harvest_girl]"Next year, then," she said, the last time. It has been six years. She does not mention it. Neither do you.[/if] [if flag.p_promised_girl]You told her once that you would come back. She reminds you of it, the first evening, as if it were a debt you had paid.[/if] She has waited, or she has not waited and has not married either, which comes to the same thing. You walk out together on the long evenings. Nobody in the village thinks it will come to anything, because you are what you are now and she is what she is. She knows that better than they do. She walks out with you anyway.
      effects:
        - if: background == reeve
          then: [ { add: { suit.mag_coker.regard: 3 } }, { assign: { suit.mag_coker.status: courted } } ]
        - if: background == burgess
          then: [ { add: { suit.annot_dyer.regard: 3 } }, { assign: { suit.annot_dyer.status: courted } } ]
        - if: background == archer
          then: [ { add: { suit.mariot_wood.regard: 3 } }, { assign: { suit.mariot_wood.status: courted } } ]
        - if: background == servant
          then: [ { add: { suit.nell_laundress.regard: 3 } }, { assign: { suit.nell_laundress.status: courted } } ]
      next: c2_home_ravell
    - id: ewan
      text: Ride north to the March, and see what Black Ewan has done.
      tags: [martial]
      visible_if: [ flag.c1_coll_hanged ]
      text_after: The steadings are rebuilt, mostly. The people in them look at you the way people look at the reason for something. At Brome Tower an old woman spits at your horse. You ride back south knowing that one day you will have to settle this, and that it will not be settled by anyone but you.
      effects: [ { set: flag.c2_saw_ewan_work }, { add: { rep.commons: -1 } } ]
      next: c2_home_ravell

- id: c2_home_ravell
  chapter: ch2
  title: Ravell, in Passing
  text: |
    On the way back to Saltcombe you stop at Ravell, because everyone stops at Ravell.

    [if flag.c2_ravell_taken]Lord Ravell came home at Lady Day, after nearly three years in a Valdrennish castle. The ransom has stripped the household to the walls: the plate, the best horses, two manors mortgaged to the Lanzi, half the hangings in the hall. He is thinner and greyer and does not ride out any more. Lady Ravell runs everything now, as she always did, but openly.[/if]

    [if npc.hamon_darrell.alive && !flag.c1_hamon_fell]Sir Hamon is there, home from the war, living on what is left of Ashby. He feeds you until you cannot move and asks about Les Salines four times, and each time listens as if it were the first.[elif flag.c1_hamon_fell]Sir Hamon is dead. He died at Ambry in the second winter of the war, among the canons, and left you his hounds in a will nobody could find. The canons kept the hounds.[elif flag.c2_master_taken]Sir Hamon is dead, in a Valdrennish prison, in the first winter. They sent his sword home. It hangs in Ashby church, over a grave with nobody in it.[/if]

    [if suit.isabel_sayer.status >= courted][if flag.c2q_isabel_married]Isabel Sayer is not at Ravell any more. She married the widowed knight from Hollesby, as her father wanted.[else]Isabel Sayer is still with Lady Ravell. She sees you across the inner ward and stops walking.[/if][/if]
  choices:
    - id: isabel
      text: Find Isabel Sayer.
      tags: [diplomacy]
      visible_if: [ suit.isabel_sayer.status >= courted, "!flag.c2q_isabel_married" ]
      text_after: She has turned down the knight from Hollesby, and two others since, and her father has stopped speaking to her. "I told him I was waiting for a man who went to war," she says. "He asked which one. I said I would know him when he came back." She looks at your spurs, or the place where they are not, and says nothing about them at all.
      effects: [ { add: { suit.isabel_sayer.regard: 3 } } ]
      next: c2_grants
    - id: on
      text: Go on to Saltcombe.
      text_after: The ship back is full of men going to the war that is not, at the moment, a war.
      next: c2_grants

- id: c2_grants
  chapter: ch2
  title: The King's Grants
  checkpoint: true
  on_enter:
    - advance: { seasons: 2 }
    - if: station != knight
      then: [ { station: knight }, { set: flag.c2_ceremonial_knight } ]
    # Where did he make his name? The King pays men with land near where they earned it.
    - { if: flag.c2_fireship, then: [ { add: { counter.fame_sauvemer: 2, counter.fame_diff: 2 } } ] }
    - { if: flag.c2_built_boom, then: [ { add: { counter.fame_sauvemer: 1, counter.fame_diff: 1 } } ] }
    - { if: flag.c2_held_gallery, then: [ { add: { counter.fame_sauvemer: 1, counter.fame_diff: 1 } } ] }
    - { if: flag.c2_sortie_hero, then: [ { add: { counter.fame_sauvemer: 1, counter.fame_diff: 1 } } ] }
    - { if: flag.c2_opened_sluice, then: [ { add: { counter.fame_sauvemer: 2, counter.fame_diff: 2 } } ] }
    - { if: flag.c2_turned_garrison, then: [ { add: { counter.fame_sauvemer: 1, counter.fame_diff: 1 } } ] }
    - { if: flag.c2_saved_banner, then: [ { add: { counter.fame_sauvemer: 2, counter.fame_diff: 2 } } ] }
    - { if: flag.c2_took_thibaut, then: [ { add: { counter.fame_sauvemer: 2, counter.fame_diff: 2 } } ] }
    - { if: flag.c2_terms_carried, then: [ { add: { counter.fame_sauvemer: 2, counter.fame_diff: 2 } } ] }
    - { if: flag.c2_fought_iron, then: [ { add: { counter.fame_sauvemer: 1, counter.fame_diff: 1 } } ] }
    - { if: flag.c2_breach_survived, then: [ { add: { counter.fame_sauvemer: 1, counter.fame_diff: 1 } } ] }
    - { if: flag.c2_took_corbie, then: [ { add: { counter.fame_armance: 1, counter.fame_diff: -1 } } ] }
    - { if: flag.c2_rearguard_held_long, then: [ { add: { counter.fame_armance: 1, counter.fame_diff: -1 } } ] }
    - { if: counter.siege >= 5, then: [ { add: { counter.fame_sauvemer: 1, counter.fame_diff: 1 } } ] }
    - { if: flag.c2_vaudrey_held, then: [ { add: { counter.fame_armance: 1, counter.fame_diff: -1 } } ] }
    - { if: flag.c2_jehanne_noticed, then: [ { add: { counter.fame_armance: 1, counter.fame_diff: -1 } } ] }
    - { if: flag.c2_grisolles_held, then: [ { add: { counter.fame_armance: 2, counter.fame_diff: -2 } } ] }
    - { if: flag.c2_saved_baggage, then: [ { add: { counter.fame_armance: 1, counter.fame_diff: -1 } } ] }
    - { if: flag.c2_ford_saved, then: [ { add: { counter.fame_armance: 3, counter.fame_diff: -3 } } ] }
    - { if: flag.c2_saved_master, then: [ { add: { counter.fame_armance: 2, counter.fame_diff: -2 } } ] }
    - { if: flag.c2_carried_wounded, then: [ { add: { counter.fame_armance: 1, counter.fame_diff: -1 } } ] }
    - { if: flag.c2_ambushed_iron, then: [ { add: { counter.fame_armance: 1, counter.fame_diff: -1 } } ] }
    - { if: flag.c2_jehanne_message, then: [ { add: { counter.fame_armance: 2, counter.fame_diff: -2 } } ] }
    - { if: flag.c2_armance_castles, then: [ { add: { counter.fame_armance: 2, counter.fame_diff: -2 } } ] }
    - { if: flag.c2_knighted_grisolles, then: [ { add: { counter.fame_armance: 1, counter.fame_diff: -1 } } ] }
    - if: [ res.renown >= 10, counter.fame_sauvemer >= 5, counter.fame_diff >= 0 ]
      then: [ { set: flag.c2_grant_marsalin } ]
      else:
        - if: [ res.renown >= 10, counter.fame_armance >= 4 ]
          then: [ { set: flag.c2_grant_kerval } ]
          else:
            - if: [ res.renown >= 10, counter.fame_sauvemer >= 5 ]
              then: [ { set: flag.c2_grant_marsalin } ]
              else: [ { set: flag.c2_grant_ormel } ]
  text: |
    At Michaelmas the King's council sits in the great hall of Sauvemer castle to give out the conquered lands.

    It is not a generous business. The King wants loyal men holding the country, men who will defend it because it is theirs, and he wants it cheap. So the great lords get towns and castles, and the bannerets get manors, and the rest get what is left, and the duty to hold it. "Men get paid where they bled," the old soldiers say. "If the King remembers where that was."

    [break]

    [if flag.c2_ceremonial_knight]Before the grants are read, the King knights eleven men for their service in the war, all at once, quickly, in the hall. You are one. You have not won your spurs in any single moment. You have won them by being there, all of it, for four years: Grisolles, the breach, the salt. Some knights will say that is not the same. Some will say it is the only kind that counts.[/if]

    The great hall of Sauvemer castle is packed to the beams, and hot, and smells of wet wool and nerves. Men who have fought side by side for four years are not looking at each other.

    [break]

    [if flag.c2_grant_marsalin]Then the clerk reads your name, and the King looks up from his cup, and smiles, which he does not do for many. "Marsalin," the clerk reads.

    You know it. Everyone in the hall knows it. Marsalin is the salt manor on the edge of Les Salines: the pans where the Valdrennish drowned, the sluice-gates, the causeways, a stone house on the dyke, a village of salt-boilers, a chapel, three hundred souls and the best salt on the coast. [if flag.c2_opened_sluice]"The King thought," says the clerk, reading from his roll without expression, "that the man who opened the gates should own them."[elif flag.c2_saved_banner]"For the banner," says the King himself, quietly, before the clerk can go on.[else]"For services at Sauvemer," the clerk reads, "by sea and land."[/if]

    The salt-boilers of Marsalin watched the battle from their roofs. They know your face. Half of them are glad of it. The other half buried kin out of those pans.[elif flag.c2_grant_kerval]Then the clerk reads your name, and a place nobody else in the hall has heard of. "Kerval, in the Armance. By the King's grant, with the assent of the Duchess of Armance."

    The Duchess's steward, standing by the dais in her ermine, looks across the hall at you and inclines his head. Kerval is a manor of good farmland in the hills behind Lannec: orchards, a mill, a fortified farm on a ridge, two hundred and fifty people, and a stream that never floods. It is the best land anybody in this hall has been given today. It is also a day's ride from the nearest Adalian garrison, in a duchy with two claimants and enemies on three sides. [if flag.c2_ford_saved]"The Duchess asked for you by name," the steward tells you afterwards. "She said the man who found the ford at Grisolles brought three hundred of her allies home, and she would like him for a neighbour."[elif flag.c2_grisolles_held]"The Duchess asked for you by name," the steward tells you afterwards. "She said the rearguard at Grisolles was the only part of that day worth remembering."[else]"The Duchess asked for you," the steward says afterwards. "She has a long memory. It is her best quality, and her worst."[/if]

    The people of Kerval are the only Valdrennish you have met who are glad to see an Adalian. That may not last.[else]Then the clerk reads your name, and the name of a place: Ormel. A manor in the marsh country behind Sauvemer. A village, a mill, a church, some salt pans, three hundred acres that flood every winter, and two hundred people who watched you besiege their town. [if flag.c2_fought_iron]They have seen you since, in the marshes, fighting the Iron Company for them.[elif flag.c2_refused_villages]They have seen you since, sending their headmen away.[/if]

    Nobody else wanted it. You can see that on the faces around you. "Ormel," mutters a Carrow knight behind you, and laughs. "God help you. It's mostly water."[/if]
  choices:
    - id: accept
      text: "Kneel, and do homage for [if flag.c2_grant_marsalin]Marsalin[elif flag.c2_grant_kerval]Kerval[else]Ormel[/if]."
      text_after: |
        You put your hands between the King's hands and swear to be his man for the land of [if flag.c2_grant_marsalin]Marsalin[elif flag.c2_grant_kerval]Kerval[else]Ormel[/if]. It takes less time than a paternoster. His hands are dry and cold and he does not look at you; he has done this forty times today.

        Then you stand up, and you are a lord of somewhere. The clerk writes it in the roll. [if flag.c2_grant_kerval]Two hundred and fifty people in the Armance hills[else]A few hundred people on the edge of the sea[/if] do not know yet that they are yours.
      effects:
        - station: lord
        - add: { res.renown: 1 }
        - if: flag.c2_grant_marsalin
          then: [ { set: flag.c2_granted_marsalin } ]
          else:
            - if: flag.c2_grant_kerval
              then: [ { set: flag.c2_granted_kerval } ]
              else: [ { set: flag.c2_granted_ormel } ]
      next: c2_plague
    - id: ask_more
      text: Kneel, and ask, respectfully, for more.
      tags: [cunning]
      check:
        attr: presence
        skill: diplomacy
        difficulty: 5
        audience: nobles
        mods:
          - { if: res.renown >= 10, add: 2, label: your name }
          - { if: flag.c2_took_thibaut, add: 2, label: the Constable's son }
          - { if: flag.c2_saved_banner, add: 2, label: the King's banner at Les Salines }
          - { if: flag.c2_fireship, add: 1, label: the fireships at Sauvemer }
          - { if: flag.strong_patron, add: 1, label: your patron speaks for you }
          - { if: flag.c1_ravell_owed, add: -1, label: Lord Ravell reminds the council you are in his debt }
          - { if: flag.c2_spoke_for_town || flag.c2_terms_carried, add: -1, label: the council thinks you soft on the Valdrennish }
          - { if: flag.c1_caught_spy, add: 1, label: the spy you caught }
      success:
        text: "The King's chamberlain looks at the King, and the King looks at you, and something in your record makes him smile. [if flag.c2_grant_marsalin]Marsalin, and the toll of the causeway to Sauvemer, which every cart of salt must pay.[elif flag.c2_grant_kerval]Kerval, and the hamlet of Saint-Méen beside it, with its mill and its fishponds.[else]Ormel, and the salt rights of the whole marsh behind it, and the fishery.[/if] It near doubles what you were given. Nobody else in the hall gets more than he was first offered. Several people notice, and remember."
        effects:
          - station: lord
          - set: flag.c2_granted_more
          - add: { res.renown: 1, rep.nobles: -1 }
          - if: flag.c2_grant_marsalin
            then: [ { set: flag.c2_granted_marsalin } ]
            else:
              - if: flag.c2_grant_kerval
                then: [ { set: flag.c2_granted_kerval } ]
                else: [ { set: flag.c2_granted_ormel } ]
        next: c2_plague
      failure:
        text: "The King's face does not change. [if flag.c2_grant_marsalin]Marsalin[elif flag.c2_grant_kerval]Kerval[else]Ormel[/if], the clerk reads again, louder, and moves on. You have been noted as a man who asks."
        effects:
          - station: lord
          - add: { rep.crown: -1 }
          - if: flag.c2_grant_marsalin
            then: [ { set: flag.c2_granted_marsalin } ]
            else:
              - if: flag.c2_grant_kerval
                then: [ { set: flag.c2_granted_kerval } ]
                else: [ { set: flag.c2_granted_ormel } ]
        next: c2_plague

- id: c2_plague
  chapter: ch2
  title: News from the South
  on_enter: [ { advance: { seasons: 1 } } ]
  text: |
    That winter the Sarenzan galleys come into Sauvemer harbour late, and fewer of them, and the sailors bring a story.

    In the east, they say, beyond the Midsea, there is a sickness that came off a caravan. Now it is in the Midsea ports. It begins with a cough and a fever, and then the skin goes mottled, grey and dark like a bruise that spreads, and then the cough brings up blood. Three days. Sometimes one. The sailors call it the Mottle. In Vellagio, they say, the Signory has shut the gates and nobody goes in or out, and the bells have stopped because there is nobody left to ring them.

    [break]

    "Fairy tales," says the harbour-master, laughing. "Last year it was a sea-serpent off Vellagio. Year before, a mermaid." The sailor who told it does not laugh. He has stopped drinking, and keeps looking at his own hands.

    Nobody believes it, quite. Sailors' stories always grow. [if npc.fiammetta_lanzi.met]Fiammetta Lanzi believes it. Her letters from Sarenza have stopped.[/if]

    In the spring you will go to [if flag.c2_granted_marsalin]Marsalin[elif flag.c2_granted_kerval]Kerval[else]Ormel[/if].
  choices:
    - id: prepare
      text: Begin to prepare. Grain, salt, a physician if you can find one.
      tags: [learning]
      text_after: People laugh at you, gently. You buy grain anyway, and salt, and a Sarenzan physician's book that you cannot read and have read to you. If the sailors are wrong, you have wasted some money. You do not think they are wrong.
      effects: [ { set: flag.c2_prepared_plague }, { add: { res.coin: -120, res.supplies: 2 } } ]
      next: c2_end
    - id: pray
      text: Pray, and have Masses said, against it.
      tags: [piety]
      text_after: The priests of Sauvemer are glad of the money. Every church in the town says Masses against the pestilence all that winter. It is all anyone can think of to do.
      effects: [ { set: flag.c2_prayed_plague }, { add: { rep.piety: 1, rep.church: 1, res.coin: -24 } } ]
      next: c2_end
    - id: ignore
      text: It is a sailors' story.
      tags: [yield]
      text_after: It is a sailors' story. You go to your manor in the spring with your men and your grant and a great many plans.
      next: c2_end

- id: c2_end
  chapter: ch2
  title: "[if flag.c2_granted_marsalin]Marsalin[elif flag.c2_granted_kerval]Kerval[else]Ormel[/if]"
  on_enter: [ { advance: { seasons: 1 } } ]
  text: |
    [if flag.c2_granted_kerval]In the spring you take ship down the coast to Port-Haudry, where all of this began, and ride inland through the Armance hills, with your banner and your following and the King's writ and the Duchess's letter, to Kerval.[else]In the spring you ride out of Sauvemer by the land gate, the one Dame Clémence carried the keys out of, with your banner and your following and the King's writ, [if flag.c2_granted_marsalin]along the dyke where the line held, past the sluice-gates and the pans, to Marsalin.[else]along the dunes and across the marsh to Ormel.[/if][/if]

    [if retinue >= 4]Behind you ride the men who have followed you through the war, or the ones who are left.[elif retinue >= 1]Behind you ride the few who are left.[else]You ride alone, with Davy, if Davy is still with you.[/if] [if npc.davy_ludd.alive && npc.davy_ludd.follower]Davy carries your banner. He is a man now. "Nearly there, sir," he says, every mile, as if you might have forgotten.[/if]

    [break]

    [if flag.c2_granted_kerval]The village sees you coming down the valley road between the orchards, and comes out. You see the people gathering at the edge of the green, and for a moment you think it is a welcome. Then you hear the bell.[elif flag.c2_granted_marsalin]The salt-boilers see you coming along the dyke a mile off. By the time you reach the stone house, every door in the village is shut, and the chapel bell is ringing.[else]The village sees you coming a mile off across the flat country. By the time you reach it, everyone is indoors, and the street is empty, and the church bell is ringing.[/if]

    Not for you. For a death. The first, in [if flag.c2_granted_marsalin]Marsalin[elif flag.c2_granted_kerval]Kerval[else]Ormel[/if], of the great mortality.
  choices:
    - id: ride_in
      text: Ride in.
      next: c3_arrival

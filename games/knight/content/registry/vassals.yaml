# Lords and knights who may come to hold land of him as he rises (docs/ECONOMY.md,
# "Lordship"). The `vassals` effect takes the next unused names of a region, in an
# order fixed by the run's seed. Each owes homage, suit of court, service in war and
# dues; at Michaelmas they pay, and now and then one dies, and his heir pays a relief
# or comes into the lord's wardship.

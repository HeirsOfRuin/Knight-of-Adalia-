# Continuity rules, checked by tools/continuity.ts (npm run continuity).
#
# Each rule names a phrase the prose may only use when a condition holds in
# the state of the run that shows it. Write the condition in the same grammar
# as scene conditions. `chapters` limits a rule to some chapters; `except`
# lists scenes where the phrase means something else.
#
# Separately, the tool flags any named NPC who appears in text after he is
# dead, unless the sentence is plainly about his death or memory. Allowed
# exceptions go under `dead_names_ok` (scene id -> NPC ids).
#
# Comparisons with the past ("more people than before") must read a relative
# path such as estate.recovery, never a raw count: see the population rule.

rules:
  # Chapter 1 on the lower tracks: an archer or a groom is not a squire until he is made one
  - match: "honest squire|what squires do|Sit in, squire|seen squires before|your master's other squire|The other squires watch|whose squire you are|For a squire, there is one question"
    allow: station == squire || track == squire_track || station >= knight
    chapters: [ch1]
    why: The levy and household tracks are archers and grooms until a route up makes them squires.
  # Children at war: a page of twelve may carry a helm; a squire of fourteen rides under a captain; only a man of sixteen commands
  - match: "with your son at the point|takes the reserve out"
    allow: heir.eldest.age >= 16
    why: Nobody gives a boy under sixteen command of a charge.
  - match: "helm on his saddle-bow|your helm in his lap|your helm still in his arms"
    allow: heir.eldest.age >= 12
    why: A page on campaign is twelve at the least.
  # Adalia after Wythen Heath: only a draw leaves it with two kings
  - match: "[Aa]dalia has two kings|[Tt]wo kings are at war"
    allow: "!flag.c4_edwin_won && !flag.c4_carrow_won"
    why: After Wythen, Edwin either beheaded Carrow or is besieged in Wendmere; only a bloody draw splits the realm.
  # Origins
  - match: "reeve's son in a ditch"
    allow: background == reeve
    why: The king's reward names the player's origin.
  - match: "arrows for a farthing"
    allow: background == archer
    why: An archer's son's childhood.
  - match: "your father fought at Harrow Ford"
    allow: background == archer
  - match: "Lady Ravell has been kind"
    allow: "!flag.p_mother_dismissed"

  # The grant
  - match: "from Ormel"
    allow: flag.c2_granted_ormel
  - match: "the state of the dyke|the dyke held"
    allow: flag.c2_granted_marsalin
    chapters: [ch3, ch4, ch5]

  # The manor
  - match: "more people than before the plague|more people on the manor than there were before"
    allow: estate.recovery >= 100
  - match: "onto the new cross"
    allow: flag.c3_raised_cross

  # People and what became of them
  - match: "\\bAude\\b"
    allow: flag.c3_davy_married
    chapters: [ch4, ch5]
  - match: "spoke for my right to choose"
    allow: flag.c4_spoke_for_mahaut
  - match: "Madonna Fiammetta sends her regards"
    allow: "alias.spouse != fiammetta_lanzi"
  - match: "Kit writes"
    allow: "!flag.c3_sent_for_kin"
    chapters: [ch3, ch4]
  - match: "Your mother writes"
    allow: "!flag.c3_sent_for_kin || background != burgess"
    chapters: [ch3, ch4]
    why: The burgess's son can send for his mother; the reeve's son sends for his sisters.
  - match: "Your master is in a Valdrennish prison"
    allow: npc.@master.alive

  - match: "who was betrothed to Lady Maud"
    allow: "!flag.c1_maud_saved"
  - match: "The one who carried my message"
    allow: flag.c2_jehanne_message
  - match: "rode between Malet"
    allow: flag.c3_saved_wat
  - match: "with his cousin's wine"
    allow: flag.c3_brese_kin
  - match: "Lend Aymer"
    allow: npc.aymer_ravell.alive
  - match: "same thing that happened at Bréval"
    allow: flag.c2_breval_burned
  - match: "the man who let him go at the Leven"
    allow: flag.c1_coll_freed
  - match: "kept the tallies to the last day"
    allow: "!flag.c1_father_exposed"

  - match: "crowned again at Saint-Lys"
    allow: "!flag.c5_paid_valdrenne"
  - match: "Keep what we have"
    allow: "!flag.c5_exiled && !flag.c5_attainted"
  - match: "the ambassadors of and"
    allow: "age < 0"
    why: A broken sentence; it should never render.

dead_names_ok:
  c5_chronicle: ['*']            # the chronicle of his life names the dead as they were
  c2q_lanzi: [hamon_darrell]     # a dead man's debt is still owed
  c3_childbed: ['*']             # "Philippa does not." is the death itself
  c3_second_child: ['*']
  c4_third_child: ['*']          # the wife's death in childbed is told as it happens
  c1_after_leven: [coll_glenhallow]  # what he dreams of
  c4_master: ['*']               # the deathbed, told after the death is recorded
  c1_crisis_ancel: [ancel_brome] # the Pryce choice tells how Ancel rode to his death
  c4q_old_note: [ralf_mercer]     # the dead father's name on his old note
  c4q_steward: [piers_reeve]      # the dead reeve, cleared in church
  c4p_rival_son: ['*']           # the boy is named as the rival's son; when the rival is dead, his widow writes


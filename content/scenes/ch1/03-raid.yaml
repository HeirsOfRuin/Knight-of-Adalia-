# Chapter 1: the Leven ford. Age 17. First real danger. Second major branch.

- id: c1_muster
  chapter: ch1
  title: The Word from the March
  on_enter: [ { advance: { seasons: 1 } } ]
  text: |
    The word comes at the end of May, on a lathered horse, while [if alias.master == hamon_darrell]Sir Hamon is still talking about the hounds[else]Sir Ancel is still riding his walls[/if].

    "Ewan," the rider gasps, sliding off. "Black Ewan's over the Leven. Eighty men. They've burned Coldstream and Aikbank, and they've hanged Father Malcolm from his own lychgate."

    [break]

    By noon the whole of Ravell knows. Lord Ravell sends Sir Ancel north with forty horse and Will Cobb's sixty archers, and Sir Hamon with the Ravell banner, "because a banner must be carried by somebody," as Father Benet says, not quite quietly enough.

    You are going. Everyone is going. The armourer in the outer ward has a queue round the well and has put his prices up by half, and the grooms are betting on who comes back.

    "Not you," says one of them, a cheerful lout called Wat Haines, poking you in the chest. "You're too skinny to stop anything. You'll be fine."

    [if armour < 1]You own a shirt, a cloak, and whatever your master lends you. A Caldmoor spear does not care which.[/if]
  choices:
    - id: buy
      text: Buy a padded jack and a kettle hat from the armourer. Three shillings.
      tags: [wealth, martial]
      requires: [ res.coin >= 36 ]
      text_after: |
        "Three shillings," the armourer says. "And that's me being kind, mind. Look at this. Stitched by nuns." It was not stitched by nuns. It is a padded jack, second-hand, stiff with someone else's sweat, and a kettle hat with a dent in it you try hard not to think about. Both fit, more or less. You walk about the yard in them feeling ten feet tall, until Giles Marrick says you look like a stuffed goose, and the grooms laugh, and you keep them on anyway.
      effects: [ { add: { res.coin: -36 } }, { item: +padded_jack }, { item: +kettle_hat } ]
      next: c1_raid
    - id: borrow
      text: Ask your master for the loan of his old jack.
      tags: [allies, martial]
      requires: [ rel.@master.affection >= 2 ]
      label: "Requires: your master's goodwill"
      text_after: "[if alias.master == hamon_darrell]Sir Hamon finds it in a chest under three cloaks and a dead mouse. It is too big. He says you will grow into it.[else]Sir Ancel throws it at you without a word. It has a Caldmoor spear-hole in it, neatly patched.[/if]"
      effects: [ { item: +padded_jack }, { add: { rel.@master.affection: 1 } } ]
      next: c1_raid
    - id: pray
      text: Spend the night before in the chapel, instead.
      tags: [piety]
      text_after: |
        Father Benet hears your confession in the cold chapel, yawning. "Murder, theft, lust, pride?" he asks, ticking them off. "No? A dull boy. Go with God." He gives you a candle-end and a blessing, and you sleep on the chapel floor and wake so stiff you can barely mount. You go north in your shirt, with a blessing for armour. It weighs nothing at all.
      effects: [ { add: { rep.piety: 1, rep.church: 1 } } ]
      next: c1_raid
    - id: go
      text: Go as you are.
      tags: [yield]
      text_after: |
        You go as you are, in your shirt and your good boots. "Brave lad," says Wat Haines, grinning, "or daft." On the road north, every time it rains, you decide it was daft.
      next: c1_raid

- id: c1_raid
  chapter: ch1
  title: The Leven Ford
  text: |
    Three days north, through rain, sleeping in barns and once in a church. On the fourth day, before dawn, the scouts come back.

    [break]

    Dawn, in a cold mist off the river. Black Ewan's men are driving the cattle across the Leven ford, slowly, because cattle will not be hurried through water. Eighty men, perhaps more, half of them on the far bank already, shouting at the beasts in a language you do not know. They have not seen you.

    Sir Ancel draws up the horse behind a fold of ground. Will Cobb has the archers strung and waiting in the alders, sixty of them, not a sound. Sir Hamon sits the Ravell banner and looks old in the grey light. Beside him is Sir Hugh Wyck, a knight of Lord Ravell's from the next valley, cheerful and freckled and forty, who smiles at you as if this were a hunt and says, "Your first? Stay by me."

    Sir Ancel says the horse will go in when the archers have loosed twice. That is all the plan there is.

    [break]

    Your mouth is dry. Your hands are steady, which surprises you. Somewhere across the water a cow is bellowing, the same note over and over.

    [if armour < 1]You have no armour. A ford fight is a lottery for a man without it.[/if]
  choices:
    - id: charge
      text: Take a spear and go into the ford with the horse.
      tags: [martial]
      lethal: true
      warn: Men die at fords. Go in without armour, or carrying a wound, and a bad fall can be your last.
      check:
        attr: strength
        skill: arms
        difficulty: 2
        mods:
          - { if: armour >= 1, add: 1, label: your armour }
          - { if: item.kettle_hat, add: 1, label: your hat }
          - { if: skill.riding >= 3, add: 1, label: you sit a horse well }
          - { if: item.holy_ampulla, add: 1, label: "Saint Ebba's water, or your faith in it" }
      success:
        text: |
          "With me!" Sir Hugh Wyck yells, laughing, and goes in early, and you go in after him because he told you to stay by him.

          The horses hit them in the middle of the river and the river does the rest. Water up to the saddle-flaps, cattle bellowing, men screaming in a language you don't know. You put your spear into a man's back and lose it there. You draw, and swing at something, and all at once you are on the far bank with a boy your own age under your horse's hooves, his hands up, shouting the only Adalian word he knows, which is "Mercy!" He has good boots and a jet brooch. He is somebody. You take him.

          Behind you in the ford, Sir Hugh Wyck is face down in the water, and his horse is standing over him, nosing at his back.
        effects:
          - set: flag.c1_raid_distinguished
          - set: flag.c1_has_prisoner
          - set: flag.c1_carried_wyck_sword
          - item: +hugh_wyck_sword
          - add: { res.renown: 2, rel.@master.respect: 2, rep.knights: 1 }
          - meet: coll_glenhallow
        next: c1_prisoner
      partial:
        text: |
          The horse goes in and so do you, roaring, and an arrow from the far bank takes you through the meat of the shoulder before you reach the middle. It does not hurt. That is the strange thing. It just knocks you sideways, as if someone had shoved you.

          You stay in the saddle. That is all anyone remembers afterwards, and it is enough. You are carried home in the cart with Sir Hugh Wyck, who was not so lucky, and you look at his face under the cloak for three days.
        effects:
          - set: flag.c1_raid_distinguished
          - injury: arrow_wound
          - add: { res.renown: 2, rel.@master.respect: 1 }
        next: c1_raid_return
      failure:
        text: "[if armour >= 1][if !injured]A spear takes you in the chest and the jack stops most of it. You go into the river and come up under a horse. You remember nothing after that until the hall.[else]A spear takes you in the chest. The jack stops most of it, but you were not whole when you went in, and you do not come up.[/if][else]A spear takes you under the ribs. You go into the water and do not come up.[/if]"
        effects:
          - if: [ armour >= 1, "!injured" ]
            then: [ { injury: cracked_skull }, { injury: bruised_ribs } ]
            else: [ { die: "Speared in the Leven ford at seventeen, in a raid nobody south of Ravell has heard of." } ]
        next: c1_raid_return
    - id: flank
      text: Take two of Cobb's men upstream to the second ford and get behind the herd.
      tags: [cunning]
      check:
        attr: wits
        skill: woodcraft
        difficulty: 4
        mods: [ { if: flag.c1_found_cattle_trail, add: 2, label: you have walked this valley before } ]
      success:
        text: |
          The second ford is waist-deep and colder than anything you have ever known. "Christ's bones," one of Cobb's men keeps whispering, all the way across. "Christ's bones, Christ's bones."

          You come out of the alders behind the drovers, shouting like madmen, waving your arms, and the cattle panic and turn back into the river, right on top of Ewan's own men. It is the funniest and most terrible thing you have ever seen. In the confusion you find a boy holding the raiders' horses, and he gives himself up rather than be trampled.

          "It was the cows that won it," Sir Ancel says afterwards, to the fire. "Hm. Somebody put them there." He does not look at you. He does not need to.
        effects:
          - set: flag.c1_raid_distinguished
          - set: flag.c1_has_prisoner
          - add: { res.renown: 2, rel.@master.respect: 2, rel.ancel_brome.respect: 1 }
          - meet: coll_glenhallow
        next: c1_prisoner
      failure:
        text: The second ford is not where the shepherds said. By the time you find it, it is over. Sir Hugh Wyck is dead in the river and the cattle are back on the Adalian side, no thanks to you.
        effects: [ { set: flag.c1_raid_late } ]
        next: c1_raid_return
    - id: archers
      text: Get down into the alders with Cobb's archers and make them shoot faster.
      tags: [martial, allies]
      check:
        attr: presence
        skill: command
        difficulty: 4
        mods:
          - { if: track == levy, add: 2, label: these are your men }
          - { if: rel.will_cobb.affection >= 3, add: 1, label: Cobb backs you }
          - { if: skill.archery >= 4, add: 1, label: your own shooting }
          - { if: flag.p_fletched, add: 1, label: you know arrows from the feather up }
      success:
        text: |
          "Loose! LOOSE! Nock, draw, LOOSE!" You do not recognise your own voice. Cobb is grinning at you through the mist like a wolf.

          Six volleys instead of two. By the time the knights go in, the far bank is a mess of screaming horses and running men, and there is not much left to fight. Will Cobb tells Sir Ancel whose voice was calling the volleys, at supper, loudly, so everyone hears. Only one knight dies at the ford: Sir Hugh Wyck, who went in early, laughing.
        effects:
          - set: flag.c1_raid_distinguished
          - add: { res.renown: 2, rel.will_cobb.respect: 2, rel.ancel_brome.respect: 1, skill.command: 1 }
          - meet: will_cobb
        next: c1_raid_return
      failure:
        text: In the mist and the noise nobody listens to you. A Caldmoor arrow comes back the other way and goes through your shoulder.
        effects: [ { injury: arrow_wound } ]
        next: c1_raid_return
    - id: parley
      text: Wade out and shout for a parley. The cattle, for their lives.
      tags: [diplomacy]
      check:
        attr: presence
        skill: diplomacy
        difficulty: 5
        mods:
          - { if: flag.p_knows_war_secret, add: 1, label: your father taught you a few words of their tongue }
          - { if: rep.caldmoor >= 1, add: 1, label: your name is known over the border }
      success:
        text: "Black Ewan himself comes down to the water's edge: a tall man with grey in his beard and a voice like a cart on stones. He laughs until he has to wipe his eyes. Then he takes the bargain, because a cattle raid is a business and he has lost enough. He leaves his sister's boy Coll as a pledge. Sir Ancel calls it a merchant's victory. Lord Ravell calls it forty cattle and no widows. Only Sir Hugh Wyck, who went in before the parley was done, is dead."
        effects:
          - set: flag.c1_parley
          - set: flag.c1_has_prisoner
          - add: { rep.caldmoor: 2, rep.honor: 1, res.renown: 1, rel.ancel_brome.respect: -1, rel.thurstan_ravell.respect: 2 }
          - meet: coll_glenhallow
          - meet: ewan_dubh
        next: c1_prisoner
      failure:
        text: Somebody on the far bank shoots at you. You go back to the line soaked to the chest and shaking, and the fight happens anyway.
        effects: [ { add: { rel.@master.respect: -1 } } ]
        next: c1_raid_return
    - id: horses
      text: Stay with the horses, as you were told.
      tags: [yield]
      text_after: |
        "Hold them," your master said, and you hold them. Twenty horses in a hollow, stamping and blowing at the noise from the river.

        From the fold of ground you see the archers loose, and the knights go in, and Sir Hugh Wyck's horse come back out of the river without him, reins trailing. When it is over you are the one who goes down into the water and brings him out. He is heavier than you thought a man could be. His sword is still in his hand, and his eyes are open, and he still looks a little surprised. Nobody else wants to take the sword from him. You do it.
      effects:
        - set: flag.c1_carried_wyck_sword
        - item: +hugh_wyck_sword
        - add: { rel.@master.respect: 1 }
      next: c1_raid_return

- id: c1_prisoner
  chapter: ch1
  title: Coll of Glenhallow
  text: |
    After a fight there is a strange quiet, full of small sounds: men breathing hard, a horse coughing, someone being sick in the river. Your hands start shaking now, when it no longer matters.

    The prisoner is sixteen, red-haired, soaked to the chest, and frightened, though he is trying not to be. His name is Coll. He is Black Ewan's sister's son. Ewan will pay for him, or will burn half the March to get him back, or both.

    [break]

    [if background == archer]When he hears your father's name he goes white. His grandmother died at Carn Dubh, he says. In the mill. Everyone in Glenhallow knows the names of the archers who stood at the door. He looks at you as if you were the door.[/if]

    Sir Ancel's men want to hang him from the nearest tree, for the priest at the lychgate. Lord Ravell, when he hears, will want him ransomed. Sir Ancel says he is yours to decide, since you took him, and folds his arms, and watches to see what you will do. So does everyone else.
  choices:
    - id: ransom
      text: Hold him for ransom, properly, through Lord Ravell.
      tags: [wealth]
      text_after: |
        "Twenty pounds," says Lord Ravell, when you bring the boy in, and you nearly drop the rope. An absurd sum for a cattle-thief's nephew, and a fair one for Black Ewan's heir.

        Most of it goes to Lord Ravell and your master, by right. Your share is two pounds: more money than your father has seen in a year. You keep it in your boot for a month, and touch it at night. Coll goes home in the autumn, thinner, on a borrowed pony. He does not say goodbye. At the gate he looks back once, and nods, and you cannot tell what it means.
      effects:
        - set: flag.c1_coll_ransomed
        - add: { res.coin: 480, rep.caldmoor: 1, rel.thurstan_ravell.respect: 1, rel.coll_glenhallow.respect: 1 }
      next: c1_raid_return
    - id: give
      text: Hand him over to your master, and let him take the credit and the money.
      tags: [allies]
      text_after: Your master is surprised, then pleased, then thoughtful. It is the right thing for a squire to do and almost nobody does it. The ransom goes to him. The gratitude comes to you.
      effects:
        - set: flag.c1_coll_given
        - add: { rel.@master.affection: 3, rel.@master.respect: 1, rep.honor: 1 }
      next: c1_raid_return
    - id: hang
      text: Let the men hang him, for the priest at the lychgate.
      tags: [martial]
      text_after: |
        "Do it," you say. Your voice does not sound like yours.

        They hang him from an alder by the ford, with a horse's halter, because nobody brought rope, and they leave him there for Ewan to find. He kicks for longer than you thought anyone could. The men cheer you all the way back to Ravell. Lord Ravell, who wanted the twenty pounds, does not.

        And somewhere north of the Leven, a man with a voice like a cart on stones learns your name, and says it once, slowly, so he will not forget it.
      effects:
        - set: flag.c1_coll_hanged
        - kill: coll_glenhallow
        - add: { rep.ruthlessness: 3, rep.caldmoor: -5, rel.ancel_brome.affection: 1, rel.thurstan_ravell.respect: -1 }
      next: c1_raid_return
    - id: free
      text: Cut his bonds in the night and let him go.
      tags: [cunning, piety]
      check: { attr: agility, skill: intrigue, difficulty: 3 }
      success:
        text: He goes over the wall without a word and stops at the top to look back at you. In the morning nobody can say how the knots came loose. Sir Ancel looks at you a long time and decides not to ask.
        effects:
          - set: flag.c1_coll_freed
          - add: { rep.honor: 1, rep.caldmoor: 3, rel.coll_glenhallow.affection: 5 }
        next: c1_raid_return
      failure:
        text: The guard wakes. Coll gets away. You do not. Lord Ravell has twenty pounds less and a squire he will not forget. Your master takes the stick to you himself, to save you worse.
        effects:
          - set: flag.c1_coll_freed
          - add: { rep.caldmoor: 3, rel.coll_glenhallow.affection: 5, rel.thurstan_ravell.respect: -3, rel.@master.respect: -2 }
        next: c1_raid_return

- id: c1_raid_return
  chapter: ch1
  title: Home from the Leven
  on_enter:
    - if: flag.c1_raid_distinguished
      then: [ { set: flag.ravell_favor }, { meet: thurstan_ravell }, { add: { rel.thurstan_ravell.respect: 2 } } ]
  text: |
    It takes five days to drive the cattle home, and they lose four on the way, and nobody cares.

    Lord Ravell meets the column at the gate. He counts the cattle, then the men, then the dead. One knight, Sir Hugh Wyck, across his own saddle with a cloak over him. Two archers. A groom nobody can name.

    [break]

    [if flag.c1_raid_distinguished]He stops his horse beside you. "The ford," he says. "That was you." It is not a question. Afterwards, in the hall, he sends you a cup of his own wine from the high table, which every man in the hall sees, and which you cannot drink, because your hands will not stay still.[elif flag.c1_raid_late]Nobody speaks to you about the ford. You hear them not speaking about it all the way to the hall.[else]Nobody singles you out. You are alive and in one piece, more or less, and that is not nothing.[/if]

    [if track != squire_track][if flag.c1_raid_distinguished]Your master is looking at you as if he were seeing you for the first time.[/if][/if]

    Somebody has to take Sir Hugh Wyck's sword home to his widow.
  choices:
    - id: squire
      text: Kneel when your master offers to take you as his squire.
      tags: [martial]
      visible_if: [ track != squire_track ]
      requires: [ flag.c1_raid_distinguished ]
      label: "Requires: distinguished at the ford"
      text_after: |
        [if alias.master == hamon_darrell]"I need a squire who can do something besides count," Sir Hamon says, which is unfair to squires who can count, and then laughs at his own joke for some time. That night he names you before the household. The cooks bang their ladles on the tables. Giles Marrick does not.[else]"You'll do," Sir Ancel says, and gives you his gauntlets to carry. That is the whole ceremony. Will Cobb thumps you on the back hard enough to loosen a tooth.[/if] Grooms and archers do not become squires. You just did.
      effects:
        - station: squire
          track: squire_track
        - add: { rel.@master.affection: 2 }
        - set: flag.c1_raised_at_ford
      next: { pool: c1_hall, count: 2, then: c1_after_leven }
    - id: wyck
      text: Take Sir Hugh Wyck's sword home to his widow yourself.
      tags: [diplomacy]
      visible_if: [ flag.c1_carried_wyck_sword ]
      next: c1_wyck_widow
    - id: duties
      text: Go back to your duties.
      text_after: There is harness to mend and horses to doctor and a ford to stop dreaming about. You do all three, slowly.
      next: { pool: c1_hall, count: 2, then: c1_after_leven }

- id: c1_wyck_widow
  chapter: ch1
  title: Wyck
  text: |
    Wyck is a half-day's ride west: a moated house, a mill, a church, and two hundred acres of good land with too many sheep on it. Everything is neat. Somebody here works hard.

    Dame Joan Wyck is twenty-seven, brown-haired, square-handed, with her sleeves rolled. She meets you in the hall in her working apron, because nobody has told her yet, and she sees the sword in your hands and knows before you open your mouth.

    [break]

    You tell her anyway. You give her the sword. She holds it across her knees, not crying, running her thumb along the guard where his hand wore it smooth, and asks how he died. [if flag.c1_raid_distinguished]You tell her the truth: he went in early, and bravely, and alone, and he told you to stay by him, and you did not get the chance.[else]You tell her he died well. It is not quite a lie.[/if]

    Her stepson Ralph, nineteen and Sir Hugh's son by his first wife, comes in while you are still talking, with mud to the knee, and asks whether the sword is his now. She does not answer him. She does not look at him. She looks at you.
  choices:
    - id: comfort
      text: Stay to supper, and let her talk about him.
      tags: [diplomacy]
      text_after: She talks about him until the candles are stubs. He snored. He was kind to dogs and careless with money and wanted a son by her. When you leave she gives you her hand, and holds yours a moment, and says you must come back when you are passing. You are never passing Wyck. You will find reasons.
      effects:
        - meet: joan_wyck
        - assign: { suit.joan_wyck.status: known }
        - add: { suit.joan_wyck.regard: 3, rel.joan_wyck.affection: 3 }
        - item: -hugh_wyck_sword
      next: { pool: c1_hall, count: 2, then: c1_after_leven }
    - id: ralph
      text: Tell Ralph Wyck plainly that the sword is his father's widow's to give.
      tags: [martial]
      text_after: Ralph goes red, then white, and leaves the hall. Dame Joan thanks you, and then says you have made her life harder, and both things are true. She asks you to write to her if you hear of anything said about Wyck at Ravell. It is the beginning of something; neither of you would call it that.
      effects:
        - meet: joan_wyck
        - assign: { suit.joan_wyck.status: known }
        - set: flag.c1_joan_owed
        - add: { suit.joan_wyck.regard: 2, rel.joan_wyck.respect: 2, rep.honor: 1 }
        - item: -hugh_wyck_sword
      next: { pool: c1_hall, count: 2, then: c1_after_leven }
    - id: leave
      text: Give her the sword, say what must be said, and go.
      tags: [yield]
      text_after: |
        "Thank you," she says, looking at the sword and not at you. "You've had a long ride."

        You ride back to Ravell in the rain. It was a duty, and you did it, and you think about her running her thumb along that guard all the way home.
      effects:
        - meet: joan_wyck
        - assign: { suit.joan_wyck.status: known }
        - item: -hugh_wyck_sword
        - add: { rep.honor: 1 }
      next: { pool: c1_hall, count: 2, then: c1_after_leven }

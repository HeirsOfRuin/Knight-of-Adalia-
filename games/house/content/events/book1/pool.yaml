# Book I, Act I's pools (STORY.md, Layer 2: a rival's border quarrel, an indebted house's daughter, the
# free company on the road, the founder's widow's dower suit; c5r_peace_castle's hostile holding).
# h_b1_early is drawn after the wedding (spring 56) and goes on to the suit, the sibling, or the muster;
# h_b1_late is drawn after the muster (autumn 57) and returns to the Estates.

- id: h_b1p_border
  chapter: book1
  kind: pool
  pool: h_b1_early
  title: Sheep on the Hill
  frames: [free, adalian]
  text: |
    Quérec's shepherds have been grazing your high pasture since the snow went, three hundred head on grass that is yours by every roll the steward owns. Your own shepherd went up to tell them, and came back with a black eye and a message for you that he will not repeat in front of the chaplain.

    "Quérec's testing you," says the steward. "He tested your father the same way, the first year. Your father went up the hill himself."
  choices:
    - id: ride
      text: Ride up the hill yourself, as {house.parent} did.
      check: { attr: presence, skill: command, difficulty: 3, audience: commons, mods: [ { if: flag.h_rode_out, add: 1, label: they heard about the boundary stone } ] }
      success:
        text: |
          You ride up with six men and sit your horse in the middle of the flock until the Quérec shepherds come to you. "Off by Sunday," you say, "or the sheep are mine." They are off by Saturday. At the inn in the valley they say you have your father's seat on a horse, which is not true, and you do not correct them.
        effects: [ { add: { counter.household: 1, counter.shadow: 1 } } ]
        next: { switch: [ { if: [ "!flag.h_suit_bought", "!flag.h_suit_settled" ], go: h_b06_suit }, { if: sibling.exists, go: h_b07_grievance }, { if: flag.h_cloister, go: h_b09_abbot } ], default: h_b10_knights }
      failure:
        text: |
          The Quérec shepherds are not impressed, and say so, in front of your men. You have to send to Quérec himself in the end, with a lawyer's letter, and the sheep stay on your hill until midsummer, eating your grass.
        effects: [ { add: { counter.household: -1 } } ]
        next: { switch: [ { if: [ "!flag.h_suit_bought", "!flag.h_suit_settled" ], go: h_b06_suit }, { if: sibling.exists, go: h_b07_grievance }, { if: flag.h_cloister, go: h_b09_abbot } ], default: h_b10_knights }
    - id: impound
      text: Have the reeve impound a hundred head and sell them at Lammas.
      effects: [ { add: { res.coin: 1200 } }, { set: flag.h_b_impounded } ]
      text_after: |
        The reeve takes a hundred and twelve, to be safe, and sells them at the Lammas fair for five pounds. Quérec writes you a furious letter, and keeps his sheep off your hill for ever after. The steward frames the letter.
      next: { switch: [ { if: [ "!flag.h_suit_bought", "!flag.h_suit_settled" ], go: h_b06_suit }, { if: sibling.exists, go: h_b07_grievance }, { if: flag.h_cloister, go: h_b09_abbot } ], default: h_b10_knights }
    - id: let_be
      text: Let it go. It is one hill, and you have a wedding to pay for.
      effects: [ { add: { counter.shadow: -1, counter.household: -1, estate.temper: -1 } } ]
      text_after: |
        You let it go. The sheep stay. So does the shepherd's black eye, and the story of it, which goes round the valley twice and comes back worse.
      next: { switch: [ { if: [ "!flag.h_suit_bought", "!flag.h_suit_settled" ], go: h_b06_suit }, { if: sibling.exists, go: h_b07_grievance }, { if: flag.h_cloister, go: h_b09_abbot } ], default: h_b10_knights }

- id: h_b1p_company
  chapter: book1
  kind: pool
  pool: h_b1_early
  title: Men on the Road
  frames: [free, adalian]
  text: |
    Forty men come up the valley road at noon, on foot and horse, with a wagon and a dog and a banner nobody recognises: a free company, paid off after the last war and walking home the long way, through other people's valleys.

    Their captain rides up to your gate alone, which is good manners, and takes off his helm, which is better. He is a Hroswalder with a grey moustache and one ear. "We want bread," he says, "and a night in your barn, and we'll be gone at Prime. Or we want nothing, and we camp by your river, and we see."
  choices:
    - id: feed
      text: Give them bread and the barn, and send them on at Prime. (£1)
      requires: "res.coin >= 240"
      effects: [ { add: { res.coin: -240 } } ]
      text_after: |
        They eat everything in the bake-house and sleep in the long barn, and in the morning they are gone, as he said, with the dog. The captain leaves a Hroswald coin on the gatepost. "For luck," he tells the porter. "Or for next time."
      next: { switch: [ { if: [ "!flag.h_suit_bought", "!flag.h_suit_settled" ], go: h_b06_suit }, { if: sibling.exists, go: h_b07_grievance }, { if: flag.h_cloister, go: h_b09_abbot } ], default: h_b10_knights }
    - id: hire
      text: Hire a dozen of them for the house. (£6)
      requires: "res.coin >= 1440"
      effects: [ { add: { res.coin: -1440, res.men: 12 } }, { set: flag.h_b_hired_company } ]
      text_after: |
        Twelve of them stay: the captain picks them himself, the steadiest, he says, and the ones who can count past ten. The old knights look at them the way cats look at a new dog. The rest go on down the valley at Prime, singing.
      next: { switch: [ { if: [ "!flag.h_suit_bought", "!flag.h_suit_settled" ], go: h_b06_suit }, { if: sibling.exists, go: h_b07_grievance }, { if: flag.h_cloister, go: h_b09_abbot } ], default: h_b10_knights }
    - id: refuse
      text: Shut the gate, and post men on the river.
      effects: [ { add: { counter.household: 1 } } ]
      text_after: |
        You shut the gate. They camp by the river, and light fires, and sing until the small hours, and in the morning two of your sheep and a goose are missing, and so is the company. Nobody was hurt. You count that a win, mostly.
      next: { switch: [ { if: [ "!flag.h_suit_bought", "!flag.h_suit_settled" ], go: h_b06_suit }, { if: sibling.exists, go: h_b07_grievance }, { if: flag.h_cloister, go: h_b09_abbot } ], default: h_b10_knights }

- id: h_b1p_dower
  chapter: book1
  kind: pool
  pool: h_b1_early
  title: The Dower
  frames: [free, adalian]
  requires: "dowager.alive"
  weight: 20
  text: |
    {dowager.first} comes to you after the wedding with a clerk from {dowager.his} own family and a roll of parchment.

    "My dower," {dowager.he} says. "A third of the house's land, for my life, as the custom is. {house.parent_start}'s will gave it to me, and I'd like it measured and set out now, while we're all still speaking." {dowager.He} looks at your new [if spouse.alive]{spouse.lord}[else]household[/if] across the hall. "Before there are more mouths at this table to argue about it."

    The clerk unrolls the parchment. {dowager.His} family has already chosen which third.
  choices:
    - id: generous
      text: Give {dowager.him} the third {dowager.his} family chose, and the house at the ford to live in.
      effects: [ { add: { res.coin: -2400, counter.household: 1 } }, { set: flag.h_b_dower_generous } ]
      text_after: |
        {dowager.first} looks at you, and then at the clerk, who is visibly disappointed not to have to argue. "Well," {dowager.he} says. "{house.parent_start} would have made me fight for it." {dowager.He} kisses you on the cheek, which {dowager.he} has not done since you were small.
      next: { switch: [ { if: [ "!flag.h_suit_bought", "!flag.h_suit_settled" ], go: h_b06_suit }, { if: sibling.exists, go: h_b07_grievance }, { if: flag.h_cloister, go: h_b09_abbot } ], default: h_b10_knights }
    - id: letter
      text: Give the third the custom allows, measured by the steward, not the clerk.
      check: { attr: wits, skill: stewardship, difficulty: 3 }
      success:
        text: |
          The steward measures it, field by field, and argues the clerk down from the orchard to the hill pasture, and from the mill to the fishery. {dowager.first} takes it with a face like a shut door, and is, by Michaelmas, perfectly civil to you, which you know better than to trust.
        effects: [ { set: flag.h_b_dower_custom } ]
        next: { switch: [ { if: [ "!flag.h_suit_bought", "!flag.h_suit_settled" ], go: h_b06_suit }, { if: sibling.exists, go: h_b07_grievance }, { if: flag.h_cloister, go: h_b09_abbot } ], default: h_b10_knights }
      failure:
        text: |
          The clerk is better than the steward. {dowager.first} gets the orchard and the mill, and {dowager.his} family's men put up a fence round them within the month.
        effects: [ { add: { res.coin: -1200 } }, { set: flag.h_b_dower_custom } ]
        next: { switch: [ { if: [ "!flag.h_suit_bought", "!flag.h_suit_settled" ], go: h_b06_suit }, { if: sibling.exists, go: h_b07_grievance }, { if: flag.h_cloister, go: h_b09_abbot } ], default: h_b10_knights }

- id: h_b1p_debtor
  chapter: book1
  kind: pool
  pool: h_b1_late
  on_enter: [ { catch_up: { year: 57, season: autumn } } ]
  title: Sir Josselin's Daughter
  frames: [free, adalian]
  requires: "opening != crowned"
  text: |
    Sir Josselin of the dyke comes at Michaelmas with his hat in his hands and his daughter behind him, a tall girl of fifteen with ink on her fingers. [if flag.h_p_lent]He owes the house ten pounds from {house.parent}'s day, and cannot pay it, and has come to say so to your face, which you have to respect.[else]He owes the Lannec moneylenders forty pounds, and cannot pay it, and has come to the greatest house he knows.[/if]

    "Take her into your household," he says. "She can read and reckon better than my steward. Better than me. In a great house she'll meet a husband I could never find her." He does not look at his daughter while he says it. She looks at you.
  choices:
    - id: take
      text: Take her into the household, and forgive the debt.
      effects: [ { set: flag.h_b_josselin_girl }, { add: { counter.household: 1 } } ]
      text_after: |
        Her name is Perrine. Within a year she is keeping the household's accounts, and finding things in them the steward would rather she had not, and the steward has started, grudgingly, to ask her to check his sums.
      next: "@return"
    - id: lend
      text: Lend him what he needs, at no interest, and send them both home. (£10)
      requires: "res.coin >= 2400"
      effects: [ { add: { res.coin: -2400 } }, { set: flag.h_b_josselin_lent } ]
      text_after: |
        He weeps, as he did for your father. The girl does not. She thanks you properly at the door, and looks back once at the hall as if memorising it.
      next: "@return"
    - id: refuse
      text: Tell him the house cannot.
      effects: [ { add: { counter.household: -1 } } ]
      text_after: |
        He nods, and goes. In the spring you hear that his land has gone to the Lannec moneylenders, and that the girl has gone into a nunnery at Saint-Lys. The steward says nothing, carefully, for a week.
      next: "@return"

- id: h_b1p_castle
  chapter: book1
  kind: pool
  pool: h_b1_late
  on_enter: [ { catch_up: { year: 57, season: autumn } } ]
  title: The Castle's People
  frames: [free, adalian]
  requires: [ inherited.c5r_peace_castle, "opening != crowned" ]
  weight: 20
  text: |
    The castle {house.parent} gave up for the peace stands across the border on its hill, with a foreign banner on it now. Its people have long memories. At Michaelmas they send their rents to the new lord, and a dead dog to you, wrapped in a sack, with a note in the old tongue that the chaplain will not translate.

    "They think your father sold them," says the steward. "They're not wrong."
  choices:
    - id: alms
      text: Send alms to the castle village, quietly, every year.
      effects: [ { add: { res.coin: -480 } }, { set: flag.h_b_castle_alms } ]
      text_after: |
        Two pounds a year, through the priest at the castle church, with no name on it. They will know whose it is. They may never forgive it. They will, at least, eat.
      next: "@return"
    - id: ignore
      text: Burn the sack, and the note, and say nothing.
      effects: []
      text_after: |
        You burn it in the yard. The note goes up last, curling, in a hand you will never be able to read.
      next: "@return"

- id: h_b1p_audit
  chapter: book1
  kind: pool
  pool: h_b1_late
  on_enter: [ { catch_up: { year: 57, season: autumn } } ]
  title: The Michaelmas Audit
  frames: [free, adalian]
  requires: "opening != crowned"
  text: |
    The Michaelmas reckoning takes three days this year. The steward has found a hole in the accounts of the outlying farms: forty shillings a year, for six years, going somewhere that is not the house.

    He has found it in the reeve's accounts at the farm, and the reeve has been with the house since before you were born. He taught you to sit a pony. He is waiting outside.
  choices:
    - id: forgive
      text: Have him in, hear him out, and forgive him if he pays it back.
      effects: [ { add: { counter.household: 1, res.coin: 480 } } ]
      text_after: |
        It was his daughter's dowry, and then her husband's debts, and then her husband's funeral. He pays back what he can, two pounds, and weeps, and you send him home to his farm with his job. The steward says you are soft. The household says something else.
      next: "@return"
    - id: dismiss
      text: Dismiss him, and put the steward's own man in.
      effects: [ { add: { counter.household: -1, res.coin: 1440 } } ]
      text_after: |
        He goes. The new man is honest, and finds another six pounds the old one missed, and is disliked by everyone at the farm for the rest of his life.
      next: "@return"

# The crowned path's late events (STORY.md, "The crowned path"): the same autumn, at the scale of a crown.
- id: h_b1p_c_charter
  chapter: book1
  kind: pool
  pool: h_b1_late
  on_enter: [ { catch_up: { year: 57, season: autumn } } ]
  title: The Salt Towns' Charter
  frames: [free]
  requires: "opening == crowned"
  text: |
    At Michaelmas the burgesses of the salt towns come up the river to Lannec, six of them in good wool, with a charter already written out on the best parchment in the West, wanting only a seal.

    It asks for the right to choose their own mayors, keep their own weights and scales, and pay the crown a fixed farm every Michaelmas instead of whatever the crown's men can find. [if flag.h_c_largesse]Your father remitted their arrears, and they have not forgotten it. This is the next thing.[/if]

    "Two hundred pounds a year," says the eldest of them, "in silver, for ever. Your Grace's father's men never got a hundred and fifty out of us in a good year."

    The chancellor says the towns will be harder to tax in a bad year. {house.mahaut_start} says the towns will be harder to frighten in a bad year, which is not the same thing, and looks at you.
  choices:
    - id: seal
      text: Seal the charter.
      effects: [ { set: flag.h_bc_charter }, { add: { res.coin: 4800, counter.favour: 1, counter.household: -1 } } ]
      text_after: |
        You seal it yourself, with the Great Seal, which takes both hands. The burgesses kneel, and pay the first year's farm on the spot, in silver, out of a chest they brought up the river on the chance. The chancellor counts it twice. It is all there.
      next: "@return"
    - id: bargain
      text: Seal it for three hundred, and see if they'll pay.
      check: { attr: wits, skill: trade, difficulty: 4, mods: [ { if: flag.h_c_largesse, add: 1, label: they owe your father } ] }
      success:
        text: |
          They go out into the gallery to talk among themselves, loudly, in the salt-town way. They come back at two hundred and fifty, and you seal it at two hundred and fifty, and the eldest burgess says to {house.mahaut} on his way out that the {house.ruler_lc} will do.
        effects: [ { set: flag.h_bc_charter }, { add: { res.coin: 6000, counter.favour: 1 } } ]
        next: "@return"
      failure:
        text: |
          They go out into the gallery to talk among themselves, and come back, and thank you, and take their charter home unsealed. It will be at the Estates next year, with every other town's grievance written on the back of it.
        effects: [ { set: flag.h_bc_charter_refused }, { add: { counter.favour: -1 } } ]
        next: "@return"
    - id: estates
      text: Tell them a charter for ever is a matter for the Estates.
      effects: [ { set: flag.h_bc_charter_refused } ]
      text_after: |
        The burgesses bow, and say that the Estates will hear of it, and take their charter home. {house.mahaut_start} says nothing until they are gone. Then she says, "They will. Every word."
      next: "@return"

- id: h_b1p_c_letter
  chapter: book1
  kind: pool
  pool: h_b1_late
  on_enter: [ { catch_up: { year: 57, season: autumn } } ]
  title: A Letter from Cordelle
  frames: [free]
  requires: "opening == crowned"
  text: |
    At Michaelmas a letter comes for you from Cordelle, from King Amaury of Valdrenne, not to the council, not to {house.mahaut}: to you, under his privy seal, in his own hand.

    It is a kind letter. [if flag.h_c_grown]It says that he too came to a crown while an old man still lived who thought it his, and that he remembers how long those years were. It asks how you do, and what you hunt, and whether your council lets you read your own letters yet.[else]It says that he was a king at fourteen himself, with old Gaucelin de Brésy governing in his name, and that he remembers how long the years were. It asks how you do, and what you hunt, and whether you are let to read your own letters yet.[/if] It says that if you are ever in need of a friend who is not in your council, you need only write, and that this letter need not go any further than you.

    The messenger is waiting in the gallery for an answer. He has been told to give it to no one but you.
  choices:
    - id: answer
      text: Write back yourself, warmly, and say nothing that matters.
      check: { attr: wits, skill: diplomacy, difficulty: 4, mods: [ { if: flag.h_bc_learned, add: 1, label: the Queen's lessons } ] }
      success:
        text: |
          You write that you hunt hares, mostly, and read everything, and are grateful for his kindness, and that {house.mahaut} sends her greetings. It takes you an evening and four drafts. The answer that comes back at Christmas is shorter, and more careful, and is addressed to you as a king writes to a king.
        effects: [ { set: flag.h_bc_amaury_answered }, { add: { counter.favour: 1 } } ]
        next: "@return"
      failure:
        text: |
          You write back, and say more than you meant to about the council and the Estates and the long years, because he asked, and because nobody else does. You read it over after the messenger has gone, in your head, and go cold.
        effects: [ { set: flag.h_bc_amaury_told } ]
        next: "@return"
    - id: mother
      text: Take it to {house.mahaut}.
      effects: [ { add: { rel.mahaut_armance.affection: 1, counter.shadow: 1 } } ]
      text_after: |
        She reads it twice, and smiles at the part about the long years, and then answers it herself, [if flag.h_c_grown]as Queen[else]as regent[/if], in the plainest Latin the chancery has. "He wanted to see whether you'd keep a secret from me," she says. "Next time, keep one. Not this one."
      next: "@return"
    - id: burn
      text: Burn it, and send the messenger home with nothing.
      effects: [ { add: { counter.favour: -1 } } ]
      text_after: |
        The messenger goes back to Cordelle with an empty bag. Amaury does not write again. At the end of the year the Valdrennish customs men on the march are slower than usual with the salt, which may mean nothing.
      next: "@return"


# Penhoët moves against the house when its temper is bad enough (PLAN.md §4.4: rivals act through gated events).
- id: h_b1p_penhoet_feud
  chapter: book1
  kind: pool
  pool: h_b1_late
  on_enter: [ { catch_up: { year: 57, season: autumn } } ]
  title: Penhoët's Men
  frames: [free, adalian]
  requires: "rival.penhoet.temper <= -4"
  weight: 40
  text: |
    [if opening == crowned]At Michaelmas Penhoët's men stop the salt carts on the Armance road at the Penhoët bridge, and take a toll from them that the crown never granted, and give the carters a receipt in Hervé's name, all courtesy. The carters bring the receipts to Lannec.[else]At Michaelmas Penhoët's men come over the stream below {house.manor} with a reeve and a cart, dig up two of the boundary stones, and set them again forty yards inside your land. They leave a receipt, signed in Hervé's name, for the stones.[/if]

    Nobody was hurt. That is the point. Hervé de Penhoët has told the whole Armance what he thinks your house is worth, and done it in a way no court will call a war.
  choices:
    - id: answer
      text: Send your men to put it back, and say why.
      check: { attr: presence, skill: command, difficulty: 4, audience: nobles }
      success:
        text: |
          Your men go out in daylight, with a banner and a clerk of their own, and undo it all in an afternoon, and leave a receipt of their own in your name. The Armance laughs, and the laugh is at Penhoët. Hervé does not write.
        effects: [ { add: { counter.household: 1, rival.penhoet.temper: -1 } }, { set: flag.h_b_penhoet_answered } ]
        next: "@return"
      failure:
        text: |
          Your men go out, and Penhoët's men are waiting for them, more of them, and there is shoving, and then a broken arm, and then the men come home. The stones stay where Hervé put them, and now there is blood on them.
        effects: [ { add: { counter.household: -1, rival.penhoet.temper: -1, res.men: -2 } } ]
        next: "@return"
    - id: court
      text: Take it to law, with the receipt as evidence.
      check: { attr: wits, skill: diplomacy, difficulty: 4 }
      success:
        text: |
          The court hears it at Martinmas, reads the receipt aloud twice, and finds for you with costs. Hervé pays at once, in full, and sends a note with the money saying he is glad the matter is settled in a lawful way. He may even mean it.
        effects: [ { add: { rival.penhoet.temper: 1, res.coin: 1200 } } ]
        next: "@return"
      failure:
        text: |
          The court hears it at Martinmas and adjourns it to the spring, and then to the next Michaelmas. Hervé's lawyer is better than yours, and older, and bills less.
        effects: [ { add: { res.coin: -1200 } } ]
        next: "@return"
    - id: let_go
      text: Let it go. It is two stones, and a toll.
      effects: [ { add: { rival.penhoet.temper: 1, counter.household: -1 } } ]
      text_after: |
        You say nothing. The household says a great deal, in the kitchens. Hervé, hearing of it, sends a cask of wine at Christmas, which is worse.
      next: "@return"
